services:

  # --------------------------------------------------------
  # DATABASE (PostgreSQL)
  # Wiki.js keeps pages, files, users and settings here, in the schema `wiki`;
  # the data volume holds only caches. 3.x supports PostgreSQL alone (17 or 18)
  # and installs the ltree and pg_trgm extensions itself at its first start —
  # the official image ships both, and POSTGRES_USER may create them.
  # --------------------------------------------------------
  wikijs-db:
    # --- Identity ---
    image: postgres:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official entrypoint starts as root, fixes ownership on the data
    # directory and then drops to the postgres user. Without these it exits on
    # `chown: Operation not permitted`.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # --- Resources ---
    memswap_limit: 512m          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          # cpus: derived starting value, not measured — v0.10.0
          cpus: "0.50"
          pids: 200
        reservations:
          memory: 128m

    # --- Configuration ---
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PWD
      # PostgreSQL 18 keeps its cluster under /var/lib/postgresql/<major> and
      # refuses to start when a volume sits on the old path without this. Same
      # pattern as apps/defectdojo.
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ}
    secrets:
      - DB_PWD

    # --- Storage ---
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # WIKI.JS
  # One Node process with worker threads. The first start creates the root
  # administrator from ADMIN_EMAIL and the ADMIN_PWD secret — see README before
  # the router is opened to anyone.
  # --------------------------------------------------------
  wikijs-app:
    # --- Identity ---
    image: ghcr.io/requarks/wiki:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    depends_on:
      wikijs-db:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # No `user:` — the image already runs as uid 1000 (`node`), which is what
    # ./volumes/data has to belong to.
    # Wiki.js reads the initial administrator password only from ADMIN_PASS;
    # the wrapper sets it from the secret and then starts the image's own
    # command (tini in front of node).
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

    # --- Resources ---
    memswap_limit: 1g            # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1g
          # cpus: derived starting value, not measured — v0.10.0
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 256m

    # --- Configuration ---
    # DB_PASS_FILE is read by Wiki.js itself and trimmed. Everything else here
    # is non-sensitive. 2.x's DB_TYPE, SSL_ACTIVE and HA_ACTIVE are gone in 3.x:
    # PostgreSQL is the only engine, TLS stays off unless config.yml turns it on
    # (Traefik terminates it), and replicas always coordinate through the
    # database.
    environment:
      DB_HOST: wikijs-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS_FILE: /run/secrets/DB_PWD
      DB_SSL: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      LOG_LEVEL: ${APP_LOG_LEVEL}
      TZ: ${TZ}
    secrets:
      - DB_PWD
      - ADMIN_PWD

    # --- Storage ---
    # Caches and the optional Git content mirror. Pages and uploaded files
    # live in the database.
    volumes:
      - ./volumes/data:/wiki/data
      - ./ops/entrypoint.sh:/entrypoint.sh:ro

    # --- Networking ---
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    labels:
      # Router
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # TLS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      # Uncomment ONLY for per-domain certificates; leave off when a wildcard
      # certificate already covers this host.
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      # Middlewares — who may reach it, then what headers apply.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_HEADERS}@file,${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_LIMIT}@file,${APP_TRAEFIK_AUTH}"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000"

    # --- Health & Observability ---
    # /_ready answers 200 without a session once the server has finished
    # starting (graceful-server readiness endpoint; 3.x has no /healthz).
    # curl is in the image.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/_ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    name: ${TRAEFIK_NETWORK}
    external: true

  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  ADMIN_PWD:
    file: ./.secrets/admin_pwd.txt
