    container_name: dify-local-pgvector
    environment:
      POSTGRES_DB: dify
      POSTGRES_PASSWORD_FILE: /run/secrets/PGVECTOR_PASSWORD
      TZ: UTC
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d dify -h 127.0.0.1 || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 30s
    image: pgvector/pgvector:0.8.1-pg16
    networks:
    - dify-local
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - /Users/rb3nt/Code/sdb-ai/apps/dify/volumes/pgvector:/var/lib/postgresql/data
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/pgvector_password.txt:/run/secrets/PGVECTOR_PASSWORD:ro
