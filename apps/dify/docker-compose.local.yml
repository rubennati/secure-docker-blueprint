    - /Users/rb3nt/Code/sdb-ai/apps/dify/volumes/plugin_daemon:/app/storage
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/db_password.txt:/run/secrets/DB_PASSWORD:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/redis_password.txt:/run/secrets/REDIS_PASSWORD:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/plugin_daemon_key.txt:/run/secrets/PLUGIN_DAEMON_KEY:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/plugin_inner_api_key.txt:/run/secrets/PLUGIN_INNER_API_KEY:ro
  redis:
    cap_drop:
    - ALL
    container_name: dify-local-redis
    entrypoint:
    - /bin/sh
    - /redis-entrypoint.sh
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$(cat /run/secrets/REDIS_PASSWORD)" redis-cli ping | grep -q PONG || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 10s
    image: redis:7.4-alpine
    networks:
    - dify-local
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    user: 999:999
    volumes:
    - /Users/rb3nt/Code/sdb-ai/apps/dify/config/redis-entrypoint.sh:/redis-entrypoint.sh:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/volumes/redis:/data
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/redis_password.txt:/run/secrets/REDIS_PASSWORD:ro
    environment: {}
  sandbox:
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - SYS_CHROOT
    - DAC_OVERRIDE
    cap_drop:
    - ALL
    container_name: dify-local-sandbox
    entrypoint:
    - /bin/sh
    - /secrets-entrypoint.sh
    - /entrypoint.sh
    environment:
      API_KEY__FILE: /run/secrets/SANDBOX_API_KEY
      ENABLE_NETWORK: 'true'
      GIN_MODE: release
      HTTP_PROXY: http://ssrf-proxy:3128
      HTTPS_PROXY: http://ssrf-proxy:3128
      SANDBOX_PORT: '8194'
      TZ: UTC
      WORKER_TIMEOUT: '15'
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8194/health
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 30s
    image: langgenius/dify-sandbox:0.2.15
    networks:
    - dify-local
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - /Users/rb3nt/Code/sdb-ai/apps/dify/config/entrypoint.sh:/secrets-entrypoint.sh:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/sandbox_api_key.txt:/run/secrets/SANDBOX_API_KEY:ro
  ssrf-proxy:
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cap_drop:
    - ALL
    container_name: dify-local-ssrf-proxy
    entrypoint:
    - /bin/bash
    - /entrypoint-dify.sh
    environment:
      COREDUMP_DIR: /var/spool/squid
      HTTP_PORT: '3128'
      TZ: UTC
    image: ubuntu/squid:6.6-24.04_edge
    networks:
    - dify-local
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - /Users/rb3nt/Code/sdb-ai/apps/dify/config/ssrf_proxy/docker-entrypoint.sh:/entrypoint-dify.sh:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/config/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/config/ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro
  worker:
    cap_drop:
    - ALL
    container_name: dify-local-worker
    depends_on:
      dify-api:
        condition: service_healthy
    entrypoint:
