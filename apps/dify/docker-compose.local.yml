    cap_drop:
    - ALL
    command:
    - /bin/bash
    - -c
    - /app/commandline migrate && exec /app/main
    container_name: dify-local-plugin-daemon
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - /secrets-entrypoint.sh
    - /usr/bin/tini
    - -g
    - --
    environment:
      DB_DATABASE: dify_plugin
      DB_HOST: db
      DB_PASSWORD__FILE: /run/secrets/DB_PASSWORD
      DB_PORT: '5432'
      DB_SSL_MODE: disable
      DB_TYPE: postgresql
      DB_USERNAME: postgres
      DIFY_INNER_API_KEY__FILE: /run/secrets/PLUGIN_INNER_API_KEY
      DIFY_INNER_API_URL: http://dify-api:5001
      FORCE_VERIFYING_SIGNATURE: 'true'
      HOME: /tmp
      MAX_PLUGIN_PACKAGE_SIZE: '52428800'
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_MAX_EXECUTION_TIMEOUT: '600'
      PLUGIN_MEDIA_CACHE_PATH: assets
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_REMOTE_INSTALLING_HOST: 127.0.0.1
      PLUGIN_REMOTE_INSTALLING_PORT: '5003'
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PYTHON_ENV_INIT_TIMEOUT: '120'
      REDIS_HOST: redis
      REDIS_PASSWORD__FILE: /run/secrets/REDIS_PASSWORD
      REDIS_PORT: '6379'
      SERVER_KEY__FILE: /run/secrets/PLUGIN_DAEMON_KEY
      SERVER_PORT: '5002'
      TZ: UTC
