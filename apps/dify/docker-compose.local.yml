# Dify — local
#
#   ops/init.sh
#   mkdir -p volumes/{storage,plugin_daemon,db,pgvector,redis}
#   sudo chown 1001:1001 volumes/storage volumes/plugin_daemon; sudo chown 999:999 volumes/redis
#   docker compose -f docker-compose.local.yml up -d
#   open http://localhost:3000/install   # setup password: .secrets/init_password.txt
#   docker compose -f docker-compose.local.yml down
#
# The console at :3000 talks to the API at :5001 directly (absolute URLs); behind
# Traefik one host serves both. A model backend on another container must share a
# network with plugin-daemon.

services:
  db:
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cap_drop:
    - ALL
    command:
    - postgres
    - -c
    - max_connections=200
    container_name: dify-local-db
    environment:
      POSTGRES_DB: dify
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      POSTGRES_USER: postgres
      TZ: UTC
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d dify -h 127.0.0.1 || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 30s
    image: postgres:15.14-alpine
    networks:
    - dify-local
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - /Users/rb3nt/Code/sdb-ai/apps/dify/config/init-plugin-db.sh:/docker-entrypoint-initdb.d/10-plugin-db.sh:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/volumes/db:/var/lib/postgresql/data
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/db_password.txt:/run/secrets/DB_PASSWORD:ro
  dify-api:
    cap_drop:
    - ALL
    container_name: dify-local-api
    depends_on:
      db:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - /secrets-entrypoint.sh
    - /bin/bash
    - /entrypoint.sh
    environment:
      APP_WEB_URL: http://localhost:3000
      CELERY_BROKER_URL__FILE: /run/secrets/CELERY_BROKER_URL
      CHECK_UPDATE_URL: ''
      CODE_EXECUTION_API_KEY__FILE: /run/secrets/SANDBOX_API_KEY
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CONSOLE_API_URL: http://localhost:5001
      CONSOLE_WEB_URL: http://localhost:3000
      DB_DATABASE: dify
      DB_HOST: db
      DB_PASSWORD__FILE: /run/secrets/DB_PASSWORD
      DB_PORT: '5432'
      DB_TYPE: postgresql
      DB_USERNAME: postgres
      DEPLOY_ENV: PRODUCTION
      ENDPOINT_URL_TEMPLATE: https://dify.example.com/e/{hook_id}
      FILES_URL: http://localhost:5001
      INIT_PASSWORD__FILE: /run/secrets/INIT_PASSWORD
      INNER_API_KEY_FOR_PLUGIN__FILE: /run/secrets/PLUGIN_INNER_API_KEY
      INTERNAL_FILES_URL: http://api:5001
      LOG_FILE: ''
      LOG_LEVEL: INFO
      MARKETPLACE_ENABLED: 'true'
      MIGRATION_ENABLED: 'true'
      MODE: api
      OPENDAL_FS_ROOT: storage
      OPENDAL_SCHEME: fs
      PGVECTOR_DATABASE: dify
      PGVECTOR_HOST: pgvector
      PGVECTOR_PASSWORD__FILE: /run/secrets/PGVECTOR_PASSWORD
      PGVECTOR_PORT: '5432'
      PGVECTOR_USER: postgres
      PLUGIN_DAEMON_KEY__FILE: /run/secrets/PLUGIN_DAEMON_KEY
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      REDIS_DB: '0'
      REDIS_HOST: redis
      REDIS_PASSWORD__FILE: /run/secrets/REDIS_PASSWORD
      REDIS_PORT: '6379'
      SECRET_KEY__FILE: /run/secrets/SECRET_KEY
      SERVICE_API_URL: http://localhost:5001
      SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
      STORAGE_TYPE: opendal
      TRIGGER_URL: https://dify.example.com
      TZ: UTC
      UV_CACHE_DIR: /tmp/.uv-cache
      VECTOR_STORE: pgvector
      APP_API_URL: http://localhost:5001
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:5001/health
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 2m0s
    image: langgenius/dify-api:1.17.1
    networks:
    - dify-local
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    volumes:
    - /Users/rb3nt/Code/sdb-ai/apps/dify/config/entrypoint.sh:/secrets-entrypoint.sh:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/volumes/storage:/app/api/storage
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/init_password.txt:/run/secrets/INIT_PASSWORD:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/secret_key.txt:/run/secrets/SECRET_KEY:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/db_password.txt:/run/secrets/DB_PASSWORD:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/redis_password.txt:/run/secrets/REDIS_PASSWORD:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/celery_broker_url.txt:/run/secrets/CELERY_BROKER_URL:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/pgvector_password.txt:/run/secrets/PGVECTOR_PASSWORD:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/sandbox_api_key.txt:/run/secrets/SANDBOX_API_KEY:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/plugin_daemon_key.txt:/run/secrets/PLUGIN_DAEMON_KEY:ro
    - /Users/rb3nt/Code/sdb-ai/apps/dify/.secrets/plugin_inner_api_key.txt:/run/secrets/PLUGIN_INNER_API_KEY:ro
    ports:
    - 127.0.0.1:5001:5001
  dify-web:
    cap_drop:
    - ALL
    container_name: dify-local-web
    environment:
      APP_API_URL: http://localhost:5001
      CONSOLE_API_URL: http://localhost:5001
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
      NEXT_TELEMETRY_DISABLED: '1'
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      TZ: UTC
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://$$(hostname):3000/ || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
