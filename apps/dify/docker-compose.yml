# =============================================================================
# Dify — production stack (Traefik + Docker Secrets)
# =============================================================================
# An application platform for LLM apps: chat and workflow builders, knowledge
# bases, a plugin system for model providers and tools. Standalone; model
# providers are plugins installed from its own UI, and any of them (or an
# OpenAI-compatible server of your choosing) can be the backend.
#
# Services, following upstream's Docker Compose deployment: api, worker and
# worker-beat (one image, three modes), web, plugin-daemon (runs the model-
# provider and tool plugins), sandbox (isolated code-node execution),
# ssrf-proxy (the only route for user-triggered outbound requests), PostgreSQL,
# a separate pgvector database as the vector store, and Redis.
#
# Spec: docs/standards/compose-structure.md · security-baseline.md
# =============================================================================

x-dify-env: &dify-env
  # --- Application ---
  DEPLOY_ENV: PRODUCTION
  CONSOLE_API_URL: ""
  CONSOLE_WEB_URL: ""
  SERVICE_API_URL: ""
  APP_WEB_URL: ""
  FILES_URL: ""
  INTERNAL_FILES_URL: http://dify-api:5001
  TRIGGER_URL: https://${APP_TRAEFIK_HOST}
  ENDPOINT_URL_TEMPLATE: https://${APP_TRAEFIK_HOST}/e/{hook_id}
  SECRET_KEY__FILE: /run/secrets/SECRET_KEY
  CHECK_UPDATE_URL: ""
  LOG_LEVEL: INFO
  LOG_FILE: ""
  UV_CACHE_DIR: /tmp/.uv-cache
  TZ: ${TZ}
  # --- PostgreSQL ---
  DB_TYPE: postgresql
  DB_HOST: db
  DB_PORT: "5432"
  DB_USERNAME: ${DB_USER}
  DB_DATABASE: ${DB_NAME}
  DB_PASSWORD__FILE: /run/secrets/DB_PASSWORD
  # --- Redis ---
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASSWORD__FILE: /run/secrets/REDIS_PASSWORD
  CELERY_BROKER_URL__FILE: /run/secrets/CELERY_BROKER_URL
  # --- Storage: local files under /app/api/storage ---
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: storage
  # --- Vector store: pgvector ---
  VECTOR_STORE: pgvector
  PGVECTOR_HOST: pgvector
  PGVECTOR_PORT: "5432"
  PGVECTOR_USER: postgres
  PGVECTOR_DATABASE: ${VECTOR_DB_NAME}
  PGVECTOR_PASSWORD__FILE: /run/secrets/PGVECTOR_PASSWORD
  # --- Code execution and outbound requests ---
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY__FILE: /run/secrets/SANDBOX_API_KEY
  SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
  # --- Plugins ---
  PLUGIN_DAEMON_URL: http://plugin-daemon:5002
  PLUGIN_DAEMON_KEY__FILE: /run/secrets/PLUGIN_DAEMON_KEY
  INNER_API_KEY_FOR_PLUGIN__FILE: /run/secrets/PLUGIN_INNER_API_KEY
  MARKETPLACE_ENABLED: "${MARKETPLACE_ENABLED}"

x-dify-secrets: &dify-secrets
  - SECRET_KEY
  - DB_PASSWORD
  - REDIS_PASSWORD
  - CELERY_BROKER_URL
  - PGVECTOR_PASSWORD
  - SANDBOX_API_KEY
  - PLUGIN_DAEMON_KEY
  - PLUGIN_INNER_API_KEY

x-dify-hardening: &dify-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:

  # --------------------------------------------------------
  # API (console API, service API, file access)
  # On proxy-public, so it carries the stack identity + role suffix
  # --------------------------------------------------------
  dify-api:
    # --- Identity ---
    image: langgenius/dify-api:${APP_TAG}
    container_name: ${CONTAINER_NAME_API}
    restart: unless-stopped

    # --- Security ---
    <<: *dify-hardening

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.00"
          pids: 400
        reservations:
          memory: 512m

    # --- Configuration ---
    # entrypoint.sh reads every NAME__FILE variable into NAME, then runs the
    # image's own entrypoint (database migrations, then gunicorn).
    entrypoint: ["/bin/sh", "/secrets-entrypoint.sh", "/bin/bash", "/entrypoint.sh"]
    environment:
      <<: *dify-env
      MODE: api
      MIGRATION_ENABLED: "true"
      INIT_PASSWORD__FILE: /run/secrets/INIT_PASSWORD
    secrets:
      - INIT_PASSWORD
      - SECRET_KEY
      - DB_PASSWORD
      - REDIS_PASSWORD
      - CELERY_BROKER_URL
      - PGVECTOR_PASSWORD
      - SANDBOX_API_KEY
      - PLUGIN_DAEMON_KEY
      - PLUGIN_INNER_API_KEY
    depends_on:
      db:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy

    # --- Storage ---
    volumes:
      - ./config/entrypoint.sh:/secrets-entrypoint.sh:ro
      - ./volumes/storage:/app/api/storage
    tmpfs:
      - /tmp

    # --- Networking ---
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    # The API paths of upstream's nginx configuration.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.rule=Host(`${APP_TRAEFIK_HOST}`) && (PathPrefix(`/console/api`) || PathPrefix(`/api`) || PathPrefix(`/v1`) || PathPrefix(`/openapi`) || PathPrefix(`/files`) || PathPrefix(`/mcp`) || PathPrefix(`/triggers`))"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.service=${COMPOSE_PROJECT_NAME}-api"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-api.loadbalancer.server.port=5001"

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # --------------------------------------------------------
  # WORKER (Celery: indexing, workflows, mail)
  # --------------------------------------------------------
  worker:
    # --- Identity ---
    image: langgenius/dify-api:${APP_TAG}
    container_name: ${CONTAINER_NAME_WORKER}
    restart: unless-stopped

    # --- Security ---
    <<: *dify-hardening

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.00"
          pids: 400
        reservations:
          memory: 512m

    # --- Configuration ---
    entrypoint: ["/bin/sh", "/secrets-entrypoint.sh", "/bin/bash", "/entrypoint.sh"]
    environment:
      <<: *dify-env
      MODE: worker
      # The api container runs the migrations.
      MIGRATION_ENABLED: "false"
      CELERY_WORKER_AMOUNT: "2"
    secrets: *dify-secrets
    depends_on:
      dify-api:
        condition: service_healthy

    # --- Storage ---
    volumes:
      - ./config/entrypoint.sh:/secrets-entrypoint.sh:ro
      - ./volumes/storage:/app/api/storage
    tmpfs:
      - /tmp

    # --- Networking ---
    # app-internal only; outbound requests go through ssrf-proxy.
    networks:
      - app-internal

    # --- Health & Observability ---
    # healthcheck: none — a Celery worker serves no port; upstream ships its
    # `celery inspect ping` check disabled by default, and it is slow and heavy.

  # --------------------------------------------------------
  # WORKER BEAT (Celery scheduler)
  # --------------------------------------------------------
  worker-beat:
    # --- Identity ---
    image: langgenius/dify-api:${APP_TAG}
    container_name: ${CONTAINER_NAME_BEAT}
    restart: unless-stopped

    # --- Security ---
    <<: *dify-hardening

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
          pids: 100
        reservations:
          memory: 128m

    # --- Configuration ---
    entrypoint: ["/bin/sh", "/secrets-entrypoint.sh", "/bin/bash", "/entrypoint.sh"]
    environment:
      <<: *dify-env
      MODE: beat
      MIGRATION_ENABLED: "false"
    secrets: *dify-secrets
    depends_on:
      dify-api:
        condition: service_healthy

    # --- Storage ---
    volumes:
      - ./config/entrypoint.sh:/secrets-entrypoint.sh:ro
    tmpfs:
      - /tmp

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    # healthcheck: none — the scheduler serves no port.

  # --------------------------------------------------------
  # WEB (console and app front end)
  # On proxy-public, so it carries the stack identity + role suffix
  # --------------------------------------------------------
  dify-web:
    # --- Identity ---
    image: langgenius/dify-web:${APP_TAG}
    container_name: ${CONTAINER_NAME_WEB}
    restart: unless-stopped

    # --- Security ---
    <<: *dify-hardening

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 128m

    # --- Configuration ---
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      NEXT_PUBLIC_SOCKET_URL: wss://${APP_TRAEFIK_HOST}
      NEXT_TELEMETRY_DISABLED: "1"
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
      TZ: ${TZ}
    tmpfs:
      - /tmp

    # --- Networking ---
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-web.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-web.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-web.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-web.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-web.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-web.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-web.service=${COMPOSE_PROJECT_NAME}-web"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-web.loadbalancer.server.port=3000"

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname):3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------
  # PLUGIN DAEMON (model-provider and tool plugins)
  # --------------------------------------------------------
  plugin-daemon:
    # --- Identity ---
    image: langgenius/dify-plugin-daemon:${PLUGIN_TAG}
    container_name: ${CONTAINER_NAME_PLUGIN}
    restart: unless-stopped
    user: "1001:1001"

    # --- Security ---
    # Runs as root in the image; see UPSTREAM.md.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.00"
          pids: 500
        reservations:
          memory: 256m

    # --- Configuration ---
    entrypoint: ["/bin/sh", "/secrets-entrypoint.sh", "/usr/bin/tini", "-g", "--"]
    environment:
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD__FILE: /run/secrets/DB_PASSWORD
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD__FILE: /run/secrets/REDIS_PASSWORD
      SERVER_PORT: "5002"
      SERVER_KEY__FILE: /run/secrets/PLUGIN_DAEMON_KEY
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY__FILE: /run/secrets/PLUGIN_INNER_API_KEY
      # Remote-debugging listener for plugin developers: loopback only, not published.
      PLUGIN_REMOTE_INSTALLING_HOST: 127.0.0.1
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      FORCE_VERIFYING_SIGNATURE: "true"
      HOME: /tmp
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      MAX_PLUGIN_PACKAGE_SIZE: "52428800"
      PYTHON_ENV_INIT_TIMEOUT: "120"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
      TZ: ${TZ}
    command: ["/bin/bash", "-c", "/app/commandline migrate && exec /app/main"]
    secrets:
      - DB_PASSWORD
      - REDIS_PASSWORD
      - PLUGIN_DAEMON_KEY
      - PLUGIN_INNER_API_KEY
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # --- Storage ---
    volumes:
      - ./config/entrypoint.sh:/secrets-entrypoint.sh:ro
      - ./volumes/plugin_daemon:/app/storage
    tmpfs:
      - /tmp

    # --- Networking ---
    # app-egress: plugins are downloaded from the marketplace, their Python
    # dependencies from PyPI, and model providers are called from here.
    networks:
      - app-internal
      - app-egress

    # --- Health & Observability ---
    # healthcheck: none — the image has no probe command, and upstream ships none.

  # --------------------------------------------------------
  # SANDBOX (isolated execution of code nodes)
  # --------------------------------------------------------
  sandbox:
    # --- Identity ---
    image: langgenius/dify-sandbox:${SANDBOX_TAG}
    container_name: ${CONTAINER_NAME_SANDBOX}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - SYS_CHROOT
      - DAC_OVERRIDE

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 128m

    # --- Configuration ---
    entrypoint: ["/bin/sh", "/secrets-entrypoint.sh", "/entrypoint.sh"]
    environment:
      API_KEY__FILE: /run/secrets/SANDBOX_API_KEY
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf-proxy:3128
      HTTPS_PROXY: http://ssrf-proxy:3128
      SANDBOX_PORT: "8194"
      TZ: ${TZ}
    secrets:
      - SANDBOX_API_KEY

    # --- Storage ---
    volumes:
      - ./config/entrypoint.sh:/secrets-entrypoint.sh:ro

    # --- Networking ---
    # app-internal only; its outbound requests go through ssrf-proxy.
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8194/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # SSRF PROXY (Squid — the only route for user-triggered outbound requests)
  # --------------------------------------------------------
  ssrf-proxy:
    # --- Identity ---
    image: ubuntu/squid:${SQUID_TAG}
    container_name: ${CONTAINER_NAME_SSRF}
    restart: unless-stopped

    # --- Security ---
    # Squid's entrypoint writes its configuration under /etc/squid at start.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
          pids: 100
        reservations:
          memory: 64m

    # --- Configuration ---
    entrypoint: ["/bin/bash", "/entrypoint-dify.sh"]
    environment:
      HTTP_PORT: "3128"
      COREDUMP_DIR: /var/spool/squid
      TZ: ${TZ}

    # --- Storage ---
    volumes:
      - ./config/ssrf_proxy/docker-entrypoint.sh:/entrypoint-dify.sh:ro
      - ./config/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./config/ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro

    # --- Networking ---
    # The only service besides the plugin daemon with a route out. Squid denies
    # private destinations, so the containers behind it cannot reach each other
    # or the host through it.
    networks:
      - app-internal
      - app-egress

    # --- Health & Observability ---
    # healthcheck: none — the image has no client to probe with; Squid's own
    # log is streamed to the container log.

  # --------------------------------------------------------
  # DATABASE (PostgreSQL — application data and plugin-daemon data)
  # --------------------------------------------------------
  db:
    # --- Identity ---
    image: postgres:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.00"
          pids: 300
        reservations:
          memory: 256m

    # --- Configuration ---
    # The plugin daemon keeps its own database beside the application's.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      TZ: ${TZ}
    secrets:
      - DB_PASSWORD

    # --- Storage ---
    volumes:
      - ./config/init-plugin-db.sh:/docker-entrypoint-initdb.d/10-plugin-db.sh:ro
      - ./volumes/db:/var/lib/postgresql/data

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # VECTOR STORE (PostgreSQL with pgvector)
  # --------------------------------------------------------
  pgvector:
    # --- Identity ---
    image: pgvector/pgvector:${PGVECTOR_TAG}
    container_name: ${CONTAINER_NAME_PGVECTOR}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.00"
          pids: 300
        reservations:
          memory: 256m

    # --- Configuration ---
    environment:
      POSTGRES_DB: ${VECTOR_DB_NAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/PGVECTOR_PASSWORD
      TZ: ${TZ}
    secrets:
      - PGVECTOR_PASSWORD

    # --- Storage ---
    volumes:
      - ./volumes/pgvector:/var/lib/postgresql/data

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${VECTOR_DB_NAME} -h 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # REDIS (cache, Celery broker)
  # --------------------------------------------------------
  redis:
    # --- Identity ---
    image: redis:${REDIS_TAG}
    container_name: ${CONTAINER_NAME_REDIS}
    restart: unless-stopped
    user: "999:999"

    # --- Security ---
    <<: *dify-hardening

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
          pids: 100
        reservations:
          memory: 64m

    # --- Configuration ---
    entrypoint: ["/bin/sh", "/redis-entrypoint.sh"]
    secrets:
      - REDIS_PASSWORD

    # --- Storage ---
    volumes:
      - ./config/redis-entrypoint.sh:/redis-entrypoint.sh:ro
      - ./volumes/redis:/data
    tmpfs:
      - /tmp

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/REDIS_PASSWORD)\" redis-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true
  # Outbound for the SSRF proxy and the plugin daemon only.
  app-egress:
    name: ${COMPOSE_PROJECT_NAME}-egress

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  SECRET_KEY:
    file: ./.secrets/secret_key.txt
  INIT_PASSWORD:
    file: ./.secrets/init_password.txt
  DB_PASSWORD:
    file: ./.secrets/db_password.txt
  REDIS_PASSWORD:
    file: ./.secrets/redis_password.txt
  CELERY_BROKER_URL:
    file: ./.secrets/celery_broker_url.txt
  PGVECTOR_PASSWORD:
    file: ./.secrets/pgvector_password.txt
  SANDBOX_API_KEY:
    file: ./.secrets/sandbox_api_key.txt
  PLUGIN_DAEMON_KEY:
    file: ./.secrets/plugin_daemon_key.txt
  PLUGIN_INNER_API_KEY:
    file: ./.secrets/plugin_inner_api_key.txt
