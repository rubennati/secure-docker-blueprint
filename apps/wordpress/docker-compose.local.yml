# WordPress — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:8080
#   # after the installer has run:
#   docker compose -f docker-compose.local.yml --env-file .env.local \
#     exec app bash -c 'cat /config/.htaccess-security >> /var/www/html/.htaccess'
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  db:
    image: mariadb:${DB_TAG}
    container_name: wordpress-local-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 200
        reservations:
          memory: 256M
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./volumes/local/mysql:/var/lib/mysql
    networks: [wordpress-local]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: wordpress:${APP_TAG}
    container_name: wordpress-local-app
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      TZ: ${TZ}
    volumes:
      - ./volumes/local/wordpress:/var/www/html
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      - ./config/apache/.htaccess-security:/config/.htaccess-security:ro
      - ./config/mu-plugins/security-hardening.php:/var/www/html/wp-content/mu-plugins/security-hardening.php:ro
    ports:
      - "127.0.0.1:8080:80"
    networks: [wordpress-local]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/wp-admin/install.php >/dev/null || curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  wordpress-local:
    name: wordpress-local
