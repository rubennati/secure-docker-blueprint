# =============================================================================
# LiteLLM — production stack (Traefik + Docker Secrets)
# =============================================================================
# An OpenAI-compatible gateway in front of model providers: one API, virtual
# keys, budgets and a usage log kept in PostgreSQL. Standalone; it needs no other
# stack, and any OpenAI-compatible backend can be listed in config/config.yaml.
#
# Spec: docs/standards/compose-structure.md · security-baseline.md
# =============================================================================

services:

  # --------------------------------------------------------
  # DATABASE (PostgreSQL — virtual keys, spend log)
  # --------------------------------------------------------
  db:
    # --- Identity ---
    image: postgres:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 128m

    # --- Configuration ---
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PWD
      TZ: ${TZ}
    secrets:
      - DB_PWD

    # --- Storage ---
    volumes:
      - ./volumes/postgres:/var/lib/postgresql

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # LITELLM PROXY
  # On proxy-public, so it carries the stack identity + role suffix
  # --------------------------------------------------------
  litellm:
    # --- Identity ---
    # The non-root variant of upstream's image (uid 65534).
    image: ghcr.io/berriai/litellm-non_root:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    # --- Resources ---
    # Starting values, not measured.
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.00"
          pids: 300
        reservations:
          memory: 512m

    # --- Configuration ---
    # LiteLLM reads the master key, salt key and database URL from the
    # environment only. entrypoint.sh builds them from the Docker Secrets and
    # then starts the image's own entrypoint.
    entrypoint: ["/bin/sh", "/entrypoint.sh", "/app/docker/prod_entrypoint.sh"]
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DISABLE_SCHEMA_UPDATE: "false"
      TZ: ${TZ}
    secrets:
      - DB_PWD
      - LITELLM_MASTER_KEY
      - LITELLM_SALT_KEY
    depends_on:
      db:
        condition: service_healthy

    # --- Storage ---
    volumes:
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./config/config.yaml:/app/config.yaml:ro
    tmpfs:
      - /tmp

    # --- Networking ---
    # proxy-public: Traefik reaches it, and it reaches model backends there or
    # on the internet. The database is on app-internal only.
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=4000"

    # --- Health & Observability ---
    # Liveliness endpoint; unauthenticated, does not touch the database.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  LITELLM_MASTER_KEY:
    file: ./.secrets/litellm_master_key.txt
  LITELLM_SALT_KEY:
    file: ./.secrets/litellm_salt_key.txt
