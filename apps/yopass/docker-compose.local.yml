# Yopass — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:8080
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  memcached:
    image: memcached:${MEMCACHED_TAG}
    container_name: yopass-local-memcached
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [yopass-local]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11211"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: jhaals/yopass:${APP_TAG}
    container_name: yopass-local-app
    restart: unless-stopped
    depends_on:
      memcached: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MEMCACHED: memcached:11211
      PORT: "1337"
      TZ: ${TZ}
    ports:
      - "127.0.0.1:8080:1337"
    networks: [yopass-local]
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  yopass-local:
    name: yopass-local
