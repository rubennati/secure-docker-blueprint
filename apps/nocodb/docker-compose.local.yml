# NocoDB — local
#
#   cp .env.local.example .env.local
#   mkdir -p volumes/local/data
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   docker compose -f docker-compose.local.yml --env-file .env.local logs -f app
#   http://localhost:8080
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  app:
    image: nocodb/nocodb:${APP_TAG}
    container_name: nocodb-local-app
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      NC_PUBLIC_URL: http://localhost:8080
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_DISABLE_TELE: "true"
      NC_INVITE_ONLY_SIGNUP: "false"
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL:-}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-}
    volumes:
      - ./volumes/local/data:/usr/app/data
    ports:
      - "127.0.0.1:8080:8080"
    networks: [nocodb-local]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  nocodb-local:
    name: nocodb-local
