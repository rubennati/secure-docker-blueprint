# Collabora Online (CODE) — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   curl http://localhost:9980/
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  app:
    image: collabora/code:${APP_TAG}
    container_name: collabora-local-app
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [MKNOD]
    environment:
      aliasgroup1: "https://localhost:.*"
      DONT_GEN_SSL_CERT: "true"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
      TZ: ${TZ}
    ports:
      - "127.0.0.1:9980:9980"
    healthcheck:
      test: ["CMD", "/usr/bin/coolwsd", "--probe", "--use-env-vars"]  # no shell in the image
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
