# =============================================================================
# calrs — production stack (Traefik + Docker Secrets)
# =============================================================================
# Scheduling: bookable meeting types on a public page, with availability read
# from a CalDAV calendar you already run. One container, SQLite in the data
# volume — upstream ships no database service and needs none.
#
# Image: ghcr.io/olivierlambert/calrs
# Source: https://github.com/olivierlambert/calrs
#
# Booking pages and the administrator's own pages share one host name. The
# shipped access policy is VPN-only for that reason — see README.
#
# Spec: docs/standards/compose-structure.md · security-baseline.md
# =============================================================================

services:

  # --------------------------------------------------------
  # CALRS
  # On proxy-public, so it carries the stack identity + role suffix
  # --------------------------------------------------------
  calrs-app:
    # --- Identity ---
    image: ghcr.io/olivierlambert/calrs:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    # The image already ships a non-root user (uid 999) and needs no
    # capability: it opens one port above 1024 and writes only its data
    # directory. Verified with this file — see UPSTREAM.md.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    # --- Resources ---
    # A Rust binary in front of SQLite; derived starting values, not measured.
    memswap_limit: 512m          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
          pids: 100
        reservations:
          memory: 128m

    # --- Configuration ---
    # entrypoint.sh reads the Docker Secret into CALRS_SECRET_KEY and then runs
    # the image's own binary. Overriding the entrypoint clears the image's
    # command, so it is restated below.
    entrypoint: ["/bin/sh", "/entrypoint.sh", "calrs"]
    command: ["serve", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      # Public URL: OIDC redirects and the links in confirmation mail are built
      # from it, so it has to be the address guests actually reach.
      CALRS_BASE_URL: https://${APP_TRAEFIK_HOST}
      CALRS_DATA_DIR: /var/lib/calrs
      RUST_LOG: ${LOG_LEVEL}
      TZ: ${TZ}
    secrets:
      - CALRS_SECRET_KEY

    # --- Storage ---
    # SQLite database, and nothing else that has to survive a restart. The
    # directory belongs to uid 999 on the host.
    volumes:
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./volumes/data:/var/lib/calrs
    tmpfs:
      - /tmp

    # --- Networking ---
    # proxy-public only: it reaches its CalDAV server and SMTP relay from here,
    # and there is no second service to isolate.
    networks:
      - proxy-public

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000"

    # --- Health & Observability ---
    # The image carries no HTTP client — no curl, no wget. bash is present, so
    # the check speaks HTTP over bash's own /dev/tcp. CMD, not CMD-SHELL:
    # /dev/tcp is a bash feature and the default shell here is dash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000; printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  CALRS_SECRET_KEY:
    file: ./.secrets/calrs_secret_key.txt
