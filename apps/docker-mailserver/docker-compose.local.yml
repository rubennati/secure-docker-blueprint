# docker-mailserver — local
#
#   cp .env.local.example .env.local
#   ops/init.sh --local
#   ops/setup.sh --local
#   SMTP localhost:1025 · submission localhost:1465 · IMAP localhost:1993
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  # --------------------------------------------------------
  # DOCKER-MAILSERVER
  # --------------------------------------------------------
  app:
    # --- Identity ---
    image: ghcr.io/docker-mailserver/docker-mailserver:${APP_TAG}
    container_name: docker-mailserver-local-app
    hostname: mail.${APP_MAIL_DOMAIN}
    restart: unless-stopped
    stop_grace_period: 1m

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      # Fail2ban writes its bans with nftables. Without it nothing is banned.
      - NET_ADMIN

    # --- Configuration ---
    environment:
      POSTMASTER_ADDRESS: postmaster@${APP_MAIL_DOMAIN}
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: 1
      SSL_TYPE: manual
      SSL_CERT_PATH: /certs/fullchain.pem
      SSL_KEY_PATH: /certs/privkey.pem
      ENABLE_FAIL2BAN: 1
      ENABLE_RSPAMD: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_AMAVIS: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      ENABLE_MTA_STS: 1
      ENABLE_UPDATE_CHECK: 0
      TZ: ${TZ}

    # --- Storage ---
    volumes:
      - ./volumes/local/mail-data:/var/mail
      - ./volumes/local/mail-state:/var/mail-state
      - ./volumes/local/mail-logs:/var/log/mail
      - ./volumes/local/config:/tmp/docker-mailserver
      - ./volumes/local/certs:/certs:ro

    # --- Networking ---
    networks:
      - docker-mailserver-local
    ports:
      - "127.0.0.1:1025:25"
      - "127.0.0.1:1465:465"
      - "127.0.0.1:1993:993"

    # --- Health ---
    healthcheck:
      test: ["CMD", "dms-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  docker-mailserver-local:
    name: docker-mailserver-local
