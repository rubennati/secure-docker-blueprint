services:

  # --------------------------------------------------------
  # DASHY
  # Self-hosted dashboard for your homelab services.
  # Config-driven (YAML), static UI, no external database.
  # --------------------------------------------------------
  dashy-app:
    # --- Identity ---
    image: lissy93/dashy:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


    # --- Resources ---
    # Generous ceiling: a limit the normal workload reaches is a limit that
    # kills imports and background jobs. Retune from docker stats, not down to it.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      NODE_ENV: production

    # --- Storage ---
    volumes:
      # Your dashboard configuration (sections, icons, bookmarks, etc.)
      - ./config/conf.yml:/app/user-data/conf.yml:ro

    # --- Networking ---
    networks:
      - proxy-public

    # --- Traefik ---
    labels:
      # Router
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # TLS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      # Middlewares
      # Optional: append ,auth-authentik@file to protect Dashy with Authentik Forward-Auth.
      # Prerequisites: core/authentik running, outpost configured, and
      # AUTHENTIK_FORWARD_AUTH_ENABLED=true rendered in core/traefik.
      # See core/authentik/README.md — Pattern 1.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_LIMIT}@file,${APP_TRAEFIK_HEADERS}@file,${APP_TRAEFIK_AUTH}"
      # Middleware: HTTP basic auth, the stack's own gate (DEC-077). The value is
      # `user:hash` from the gitignored .env — .env.example says how to make it.
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth.basicauth.users=${APP_BASIC_AUTH_USERS}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth.basicauth.realm=Dashy"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8080"

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "node", "/app/services/healthcheck.js"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 40s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    name: ${TRAEFIK_NETWORK}
    external: true
