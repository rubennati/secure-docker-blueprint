# Dashy — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:8080
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  app:
    image: lissy93/dashy:${APP_TAG}
    container_name: dashy-local-app
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      NODE_ENV: production
    volumes:
      - ./config/conf.example.yml:/app/user-data/conf.yml:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [dashy-local]
    healthcheck:
      test: ["CMD", "node", "/app/services/healthcheck.js"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dashy-local:
    name: dashy-local
