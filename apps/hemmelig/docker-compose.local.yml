# Hemmelig — local
#
#   cp .env.local.example .env.local
#   mkdir -p volumes/local/database volumes/local/uploads
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:8080
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  app:
    image: hemmeligapp/hemmelig:${APP_TAG}
    container_name: hemmelig-local-app
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      DATABASE_URL: file:/app/database/hemmelig.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:8080
      HEMMELIG_BASE_URL: http://localhost:8080
      NODE_ENV: production
      TZ: ${TZ}
    volumes:
      - ./volumes/local/database:/app/database
      - ./volumes/local/uploads:/app/uploads
    ports:
      - "127.0.0.1:8080:3000"
    networks: [hemmelig-local]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  hemmelig-local:
    name: hemmelig-local
