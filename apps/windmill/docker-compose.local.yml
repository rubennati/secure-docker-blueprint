# Windmill — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   curl http://localhost:8000/api/version
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  db:
    image: postgres:${DB_TAG}
    container_name: windmill-local-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./volumes/local/postgres:/var/lib/postgresql
    networks: [windmill-local]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  windmill-server:
    image: ghcr.io/windmill-labs/windmill:${APP_TAG}
    container_name: windmill-local-server
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    user: "${WM_UID}:${WM_GID}"
    environment:
      TZ: ${TZ}
      HOME: /tmp
      MODE: server
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}?sslmode=disable
      BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    networks: [windmill-local]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/health/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    image: ghcr.io/windmill-labs/windmill:${APP_TAG}
    container_name: windmill-local-worker
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    user: "${WM_UID}:${WM_GID}"
    environment:
      TZ: ${TZ}
      HOME: /tmp
      MODE: worker
      WORKER_GROUP: default
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}?sslmode=disable
    volumes:
      # mode is decimal, not octal digits: 1023 == 0o1777 (sticky, world rwx).
      # Compose passes this integer straight through as the raw bit pattern
      # rather than parsing it as octal — verified 2026-09-18: `mode: 1777`
      # produced octal 3361 (d-wxrwS--t), not the intended 1777.
      - type: tmpfs
        target: /tmp
        tmpfs: {mode: 1023}
      - type: tmpfs
        target: /tmp/windmill
        tmpfs: {mode: 1023}
      - ./volumes/local/worker_cache:/tmp/windmill/cache
    networks: [windmill-local]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "windmill"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker-native:
    image: ghcr.io/windmill-labs/windmill:${APP_TAG}
    container_name: windmill-local-worker-native
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    user: "${WM_UID}:${WM_GID}"
    environment:
      TZ: ${TZ}
      HOME: /tmp
      MODE: worker
      WORKER_GROUP: native
      NATIVE_MODE: "true"
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}?sslmode=disable
    networks: [windmill-local]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "windmill"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  windmill-local:
    name: windmill-local
