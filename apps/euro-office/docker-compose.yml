services:

  # --------------------------------------------------------
  # EURO-OFFICE DOCUMENT SERVER
  # EU-governed fork of OnlyOffice Document Server (Nextcloud, IONOS,
  # XWiki, Proton). Drop-in replacement for onlyoffice/documentserver —
  # same API, same JWT + iframe integration. Used by Seafile / Nextcloud.
  # --------------------------------------------------------
  euro-office-app:
    # --- Identity ---
    image: ghcr.io/euro-office/documentserver:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # Search, rendering or ML — generous on purpose. Retune from docker stats.
    memswap_limit: 4G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 300
        reservations:
          memory: 512M

    # --- Configuration ---
    # No _FILE support (OnlyOffice fork) — entrypoint wrapper reads the
    # Docker Secret and exports JWT_SECRET, then execs the DS start script.
    # EXAMPLE_ENABLED is left OFF — the demo server is an unauthenticated endpoint.
    entrypoint: ["/bin/bash", "/config/entrypoint.sh", "/app/ds/run-document-server.sh"]
    environment:
      JWT_ENABLED: "true"
      WOPI_ENABLED: "true"
      TZ: ${TZ}
    secrets:
      - EURO_OFFICE_JWT_SECRET

    # --- Storage ---
    volumes:
      - ./config/entrypoint.sh:/config/entrypoint.sh:ro
      - ./volumes/data:/var/www/onlyoffice/Data
      - ./volumes/logs:/var/log/onlyoffice

    # --- Networking ---
    networks:
      - proxy-public

    # --- Traefik ---
    # Embedded in iframes by Seafile/Nextcloud. Standard sec-* chains set
    # frameDeny:true which blocks this. A dedicated -headers middleware gives
    # equivalent protection but allows embedding via CSP frame-ancestors.
    labels:
      # Router
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # TLS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      # Middlewares — the four positions; nosniff and the stack's frame-ancestors
      # CSP before the headers profile (response headers that must win over it),
      # the proto header after the four.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_LIMIT}@file,header-nosniff@file,${COMPOSE_PROJECT_NAME}-csp@docker,${APP_TRAEFIK_HEADERS}@file,${APP_TRAEFIK_AUTH},forwarded-proto-https@file"
      # Proxy headers: sits behind Traefik's TLS termination. Without
      # X-Forwarded-Proto it generates http:// URLs → Mixed Content errors.
      # The frame-ancestors CSP the stack owns — the file host that embeds the
      # editor is named by the operator. nosniff is header-nosniff@file, HSTS is
      # the profile's base; both as this stack set them before the model.
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-csp.headers.contentSecurityPolicy=frame-ancestors 'self' ${EURO_OFFICE_ALLOWED_ORIGINS}"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    name: ${TRAEFIK_NETWORK}
    external: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  EURO_OFFICE_JWT_SECRET:
    file: ./.secrets/jwt_secret.txt
