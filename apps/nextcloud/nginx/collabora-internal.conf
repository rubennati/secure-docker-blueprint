# Collabora's internal address for Nextcloud's own server-side calls — discovery,
# capabilities and the document conversions behind previews. Mounted by
# office-collabora.yml only. The public route closes /cool/convert-to
# (apps/collabora), so the PHP container reaches Collabora here: nginx is the one
# Nextcloud container on Collabora's edge network, and PHP-FPM stays off it.
# Set richdocuments' wopi_url to http://<nginx>:9980 (README, "Office servers
# behind a closed route"). Nothing routes to this port from outside.
server {
    listen 9980;

    # Docker's resolver, at request time: nginx starts even while Collabora is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $collabora http://collabora-app:9980;   # apps/collabora CONTAINER_NAME_APP

    location ~ ^/(hosting/discovery|hosting/capabilities|cool/convert-to)(/|$) {
        proxy_pass $collabora;
        proxy_set_header Host $host;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
