; PHP-FPM pool overrides for Nextcloud on CPX32 (4 vCPU / 8 GB RAM).
;
; This file is loaded AFTER the image's own zz-docker.conf (alphabetical order)
; so these values take precedence over image defaults.
;
; Sizing rationale:
;   Server RAM:       8 GB
;   MariaDB:         ~1.5 GB (1G buffer pool + overhead)
;   Redis:            512 MB
;   OnlyOffice:      ~1.5 GB
;   OS + nginx:      ~512 MB
;   Available for PHP: ~4 GB
;
;   Per-worker average in normal operation: ~200–300 MB
;   Per-worker hard limit (PHP_MEMORY_LIMIT): 1024 MB
;
;   max_children = 10 allows up to ~3 GB average usage or 10 GB worst-case.
;   In practice average usage stays well below 3 GB.
;   10 workers is conservative — raise to 15 only if you see workers at
;   capacity under normal load (check pm.status page).
;
; Relationship to cron container:
;   The cron container uses the same pool config. Cron tasks consume
;   1–2 workers for 30–120 seconds every 5 minutes. With 10 workers,
;   enough remain available for interactive user requests during cron
;   execution. This resolves the intermittent 1–3 minute unavailability
;   observed with the default max_children = 5.

[www]
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Recycle workers after 500 requests to prevent slow PHP memory leaks.
pm.max_requests      = 500
