; PHP-FPM pool overrides for Nextcloud.
;
; Loaded after the image's own zz-docker.conf (alphabetical order), so these
; values win. Mounted read-only into both `app` and `cron`.
;
; ---------------------------------------------------------------------------
; How pm.max_children is derived
; ---------------------------------------------------------------------------
; Nextcloud documents the formula:
;
;     pm.max_children = floor(RAM available for PHP / average worker RSS)
;
; and states that a typical worker uses 50–100 MB.
; https://docs.nextcloud.com/server/latest/admin_manual/installation/server_tuning.html
;
; The value below uses the top of that band, because a default has to hold on a
; machine nobody has measured. The reference is 4 vCPU / 8 GB, a small team, this
; stack and nothing else on the host:
;
;     MariaDB (1 GB buffer pool + overhead)   ~1.5 GB
;     Redis                                    0.5 GB
;     OS, nginx, container overhead            0.5 GB
;     Left for page cache and growth          ~3.0 GB
;     Budgeted for PHP                         2.5 GB
;
;     2560 MB / 100 MB  =  25 workers
;
; Then measure your own and adjust. A stack running preview generation and
; full-text search sits at the top of the band, one without at the bottom, and
; the difference is worth a factor of two in worker count:
;
;     docker compose exec -u root app sh -c '
;       for p in $(pgrep -f "php-fpm: pool www"); do
;         awk "/VmRSS/{printf \"%6.1f MB\n\", \$2/1024}" /proc/$p/status
;       done'
;
; PHP_MEMORY_LIMIT is a per-request ceiling, not an allocation. It bounds one
; runaway request; it is not what a worker normally holds, and multiplying it by
; max_children describes a state that does not occur.
;
; An office server on the same host (OnlyOffice and the like) takes its share
; out of the PHP budget — subtract it before dividing.
;
; Signs the value is wrong:
;
;   Too low — PHP-FPM says so itself, in the container's log:
;     docker compose logs app | grep "max_children"
;     WARNING: [pool www] server reached pm.max_children setting (32), …
;
;   Too high — the host swaps under load. Watch `free -h` while it is busy.
;
; The `cron` container shares this pool configuration. Its jobs occupy a worker
; or two for up to a couple of minutes every five minutes, which is why the
; image default of 5 produces intermittent 502s on an otherwise idle instance.
; ---------------------------------------------------------------------------

[www]
pm                   = dynamic
pm.max_children      = 25
pm.start_servers     = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12

; Recycle workers periodically; guards against slow growth in leaky extensions.
; Nextcloud suggests 500–1000.
pm.max_requests      = 500

; Live counters, for when the log warning is not enough. Enabled here but not
; reachable: nothing proxies it, and the image ships no FastCGI client. To read
; it, add a location block for /status in nginx/nginx.conf restricted to your own
; address — do not expose it.
pm.status_path       = /status
