# Nextcloud — local
#
#   cp .env.local.example .env.local
#   mkdir -p volumes/local/mysql volumes/local/redis volumes/local/html
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   docker compose -f docker-compose.local.yml --env-file .env.local logs -f app
#   http://localhost:8080 — log in as ADMIN_USER / ADMIN_PASSWORD
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  db:
    image: mariadb:${DB_TAG}
    container_name: nextcloud-local-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: >
      --transaction-isolation=READ-COMMITTED
      --skip-innodb-read-only-compressed
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --max-connections=200
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "1"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./volumes/local/mysql:/var/lib/mysql
    networks: [nextcloud-local]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:${REDIS_TAG}
    container_name: nextcloud-local-redis
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: >
      sh -c 'exec redis-server
      --requirepass "$$REDIS_PASSWORD"
      --maxmemory 512mb
      --maxmemory-policy noeviction'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./volumes/local/redis:/data
    networks: [nextcloud-local]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    image: nextcloud:${APP_TAG}
    container_name: nextcloud-local-app
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      TZ: ${TZ}
      MYSQL_HOST: db
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
    volumes:
      - ./volumes/local/html:/var/www/html
      - ./php-fpm/zz-nextcloud-pool.conf:/usr/local/etc/php-fpm.d/zz-nextcloud-pool.conf:ro
    networks: [nextcloud-local]
    healthcheck:
      test: ["CMD-SHELL", "su -s /bin/sh www-data -c 'php -f /var/www/html/occ status' 2>/dev/null | grep -q 'installed: true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  nginx:
    image: nginx:${NGINX_TAG}
    container_name: nextcloud-local-nginx
    restart: unless-stopped
    depends_on:
      - app
    security_opt: [no-new-privileges:true]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volumes/local/html:/var/www/html:ro
    ports:
      - "127.0.0.1:8080:80"
    networks: [nextcloud-local]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/status.php | grep -q '\"installed\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cron:
    image: nextcloud:${APP_TAG}
    container_name: nextcloud-local-cron
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    entrypoint: /cron.sh
    environment:
      TZ: ${TZ}
      MYSQL_HOST: db
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./volumes/local/html:/var/www/html
      - ./php-fpm/zz-nextcloud-pool.conf:/usr/local/etc/php-fpm.d/zz-nextcloud-pool.conf:ro
    networks: [nextcloud-local]
    healthcheck:
      test: ["CMD-SHELL", "grep -q crond /proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  nextcloud-local:
    name: nextcloud-local
