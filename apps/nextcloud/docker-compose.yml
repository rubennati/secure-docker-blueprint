services:

  # --------------------------------------------------------
  # DATABASE (MariaDB)
  # --------------------------------------------------------
  db:
    # --- Identity ---
    image: mariadb:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # The buffer pool alone is configured at 1G below; connections, sort buffers
    # and temporary tables come on top. 2G is the ceiling, not the appetite.
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 512M

    # --- Configuration ---
    command: >
      --transaction-isolation=READ-COMMITTED
      --skip-innodb-read-only-compressed
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --max-connections=200
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PWD
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PWD
      MYSQL_INITDB_SKIP_TZINFO: "1"
      MARIADB_AUTO_UPGRADE: "1"
    secrets:
      - DB_PWD
      - DB_ROOT_PWD

    # --- Storage ---
    volumes:
      - db_data:/var/lib/mysql

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------
  # REDIS
  # --------------------------------------------------------
  redis:
    # --- Identity ---
    image: redis:${REDIS_TAG}
    container_name: ${CONTAINER_NAME_REDIS}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # maxmemory is 512mb; the rest covers allocator fragmentation and overhead.
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 50
        reservations:
          memory: 64M

    # --- Configuration ---
    command: >
      sh -c 'exec redis-server
      --requirepass "$$(cat /run/secrets/REDIS_PWD)"
      --maxmemory 512mb
      --maxmemory-policy noeviction'

    secrets:
      - REDIS_PWD

    # --- Storage ---
    volumes:
      - redis_data:/data

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/REDIS_PWD)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --------------------------------------------------------
  # NEXTCLOUD (PHP-FPM)
  # --------------------------------------------------------
  app:
    # --- Identity ---
    image: nextcloud:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # --- Security ---
    # NOTE: no-new-privileges omitted — Nextcloud entrypoint needs to
    # chown/chmod files as root before PHP-FPM drops to www-data.
    # With no-new-privileges, config.php gets created as root:root
    # and PHP-FPM (www-data) cannot write to it → 503.

    # --- Resources ---
    # pm.max_children is 25 and a worker measured 65–107 MB, so the working set
    # is around 2G. The ceiling sits above it deliberately: a limit the normal
    # workload reaches is a limit that kills previews and imports.
    deploy:
      resources:
        limits:
          memory: 3G
          pids: 300
        reservations:
          memory: 512M

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      # Database
      MYSQL_HOST: db
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PWD
      # Redis
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD_FILE: /run/secrets/REDIS_PWD
      # Set together with the database values, these make the entrypoint run
      # `occ maintenance:install` on first start — no setup wizard.
      NEXTCLOUD_ADMIN_USER_FILE: /run/secrets/ADMIN_USER
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/ADMIN_PWD
      # Mail — required for password reset and share notifications.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_AUTHTYPE: ${SMTP_AUTHTYPE}
      SMTP_NAME: ${SMTP_NAME}
      SMTP_PASSWORD_FILE: /run/secrets/SMTP_PWD
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      # Reverse Proxy
      TRUSTED_PROXIES: ${NC_TRUSTED_PROXIES}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${APP_TRAEFIK_HOST}
      OVERWRITECLIURL: https://${APP_TRAEFIK_HOST}
      # PHP
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
    secrets:
      - DB_PWD
      - ADMIN_USER
      - ADMIN_PWD
      # Read at PHP runtime as www-data, so these files on the host must be owned
      # by that uid — see .env.example.
      - REDIS_PWD
      - SMTP_PWD

    # --- Storage ---
    volumes:
      - nextcloud_html:/var/www/html
      - ./php-fpm/zz-nextcloud-pool.conf:/usr/local/etc/php-fpm.d/zz-nextcloud-pool.conf:ro

    # --- Networking ---
    networks:
      - app-internal
      - app-egress

    # --- Health & Observability ---
    healthcheck:
      # Run occ as the web user, not as root. Two of the secrets are readable by
      # that user's group and by nobody else, so a root healthcheck logs a
      # permission error for each of them on every interval — 2880 entries a day,
      # and the instance's own overview then reports errors in its log.
      test: ["CMD-SHELL", "su -s /bin/sh www-data -c 'php -f /var/www/html/occ status' 2>/dev/null | grep -q 'installed: true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # --------------------------------------------------------
  # NGINX (Web Server)
  # --------------------------------------------------------
  nextcloud-nginx:
    # --- Identity ---
    image: nginx:${NGINX_TAG}
    container_name: ${CONTAINER_NAME_NGINX}
    restart: unless-stopped
    depends_on:
      - app

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 50
        reservations:
          memory: 32M

    # --- Storage ---
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nextcloud_html:/var/www/html:ro

    # --- Networking ---
    networks:
      - app-internal
      - proxy-public

    # --- Health & Observability ---
    # status.php answers 200 with JSON and reaches through FastCGI to the
    # application, so this proves the whole path rather than that nginx is up.
    # Do not check `/`: it answers 302, and a redirect that a minimal wget
    # treats as failure makes the container unhealthy — whereupon Traefik drops
    # it from the load balancer and the symptom is a 404 from the proxy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/status.php | grep -q '\"installed\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # --- Traefik ---
    labels:
      # Router
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # TLS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      # Middlewares (CalDAV/CardDAV redirect + access + security)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"

  # --------------------------------------------------------
  # CRON
  # --------------------------------------------------------
  cron:
    # --- Identity ---
    image: nextcloud:${APP_TAG}
    container_name: ${CONTAINER_NAME_CRON}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # --- Security ---
    # NOTE: no-new-privileges omitted — same reason as app container

    # --- Resources ---
    # Same pool file as `app`, but cron occupies one or two workers at a time.
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 150
        reservations:
          memory: 256M

    # --- Configuration ---
    entrypoint: /cron.sh
    environment:
      TZ: ${TZ}
      MYSQL_HOST: db
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PWD
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD_FILE: /run/secrets/REDIS_PWD
      # Set together with the database values, these make the entrypoint run
      # `occ maintenance:install` on first start — no setup wizard.
      NEXTCLOUD_ADMIN_USER_FILE: /run/secrets/ADMIN_USER
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/ADMIN_PWD
      # Mail — required for password reset and share notifications.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_AUTHTYPE: ${SMTP_AUTHTYPE}
      SMTP_NAME: ${SMTP_NAME}
      SMTP_PASSWORD_FILE: /run/secrets/SMTP_PWD
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
    secrets:
      - DB_PWD
      - ADMIN_USER
      - ADMIN_PWD
      # Read at PHP runtime as www-data, so these files on the host must be owned
      # by that uid — see .env.example.
      - REDIS_PWD
      - SMTP_PWD

    # --- Storage ---
    volumes:
      - nextcloud_html:/var/www/html
      - ./php-fpm/zz-nextcloud-pool.conf:/usr/local/etc/php-fpm.d/zz-nextcloud-pool.conf:ro

    # --- Networking ---
    networks:
      - app-internal
      - app-egress

    # --- Health & Observability ---
    # There is no service to query here — the container is busybox crond running
    # cron.php on a schedule. If PID 1 is still crond, the scheduler is alive;
    # if it exited, this is the only thing that would say so.
    healthcheck:
      test: ["CMD-SHELL", "grep -q crond /proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

# --------------------------------------------------------
# VOLUMES
# --------------------------------------------------------
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  nextcloud_html:
    driver: local

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true

  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

  # Outbound for the application containers only. The database and cache stay on
  # app-internal alone and never reach the internet. See README, "Network
  # exception".
  app-egress:
    name: ${COMPOSE_PROJECT_NAME}-egress

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  DB_ROOT_PWD:
    file: ./.secrets/db_root_pwd.txt
  REDIS_PWD:
    file: ./.secrets/redis_pwd.txt
  ADMIN_USER:
    file: ./.secrets/admin_user.txt
  ADMIN_PWD:
    file: ./.secrets/admin_pwd.txt
  SMTP_PWD:
    file: ./.secrets/smtp_pwd.txt
