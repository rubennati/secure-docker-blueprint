services:

  # --------------------------------------------------------
  # HOMARR
  # Modern self-hosted dashboard with an extensive
  # integration library (service status, torrent clients,
  # media servers, Proxmox, etc.).
  # --------------------------------------------------------
  homarr-app:
    # --- Identity ---
    image: ghcr.io/homarr-labs/homarr:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    # NOTE: cap_drop not set — Homarr starts as UID=0 and runs an internal
    # Redis server; dropping ALL capabilities would break both.


    # --- Resources ---
    # Generous ceiling: a limit the normal workload reaches is a limit that
    # kills imports and background jobs. Retune from docker stats, not down to it.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      # 64-character hex encryption key (openssl rand -hex 32)
      # See README "Setup" section for generation instructions.
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY:?Set HOMARR_SECRET_ENCRYPTION_KEY in .env}
      # Canonical public origin (v2): MCP OAuth metadata and origin checks.
      # Upstream requires an HTTPS origin behind a TLS-terminating proxy.
      BASE_URL: https://${APP_TRAEFIK_HOST}
      # Proxies whose X-Forwarded-For the bundled nginx trusts (v2). Empty by
      # default: every client behind Traefik then shares one OAuth abuse budget.
      # See .env.example before setting it.
      HOMARR_TRUSTED_PROXIES: ${HOMARR_TRUSTED_PROXIES:-}

    # --- Storage ---
    volumes:
      - ./volumes/appdata:/appdata
      # OPTIONAL: Docker integration (service status, container controls).
      # The socket-proxy pattern from core/traefik/ is safer than direct
      # socket mount — re-enable only after considering the trade-off.
      # See README "Docker integration" for details.
      # - /var/run/docker.sock:/var/run/docker.sock:ro

    # --- Networking ---
    networks:
      - proxy-public

    # --- Traefik ---
    labels:
      # Router
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # TLS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      # Middlewares
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_HEADERS}@file,${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_LIMIT}@file,${APP_TRAEFIK_AUTH}"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=7575"

    # --- Health & Observability ---
    # v2's Debian image has no wget or curl; node checks upstream's liveness
    # route (database and internal Redis) through the bundled nginx on 7575.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7575/api/health/live',{method:'HEAD',signal:AbortSignal.timeout(8000)}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    name: ${TRAEFIK_NETWORK}
    external: true
