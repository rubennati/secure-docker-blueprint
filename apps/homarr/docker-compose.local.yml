# Homarr — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:7575
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  app:
    image: ghcr.io/homarr-labs/homarr:${APP_TAG}
    container_name: homarr-local-app
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ}
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY}
    volumes:
      - ./volumes/local/appdata:/appdata
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:7575:7575"
    networks: [homarr-local]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7575/api/health/live',{method:'HEAD',signal:AbortSignal.timeout(8000)}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  homarr-local:
    name: homarr-local
