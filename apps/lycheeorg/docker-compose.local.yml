# Lychee — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   # open http://localhost:8000
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  db:
    image: mariadb:${DB_TAG}
    container_name: lychee-local-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./volumes/local/mysql:/var/lib/mysql
    networks: [lychee-local]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:${REDIS_TAG}
    container_name: lychee-local-redis
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./volumes/local/redis:/data
    networks: [lychee-local]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: lycheeorg/lychee:${APP_TAG}
    container_name: lychee-local-app
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      PHP_TZ: ${TZ}
      TIMEZONE: ${TZ}
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      LOG_VIEWER_CACHE_DRIVER: file
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      STARTUP_DELAY: "30"
      SKIP_PERMISSIONS_CHECKS: "false"
      DISABLE_BASIC_AUTH: "false"
      DISABLE_WEBAUTHN: "false"
      TRUSTED_PROXIES: "*"
    volumes:
      - ./volumes/local/conf:/conf
      - ./volumes/local/uploads:/uploads
      - ./volumes/local/sym:/sym
      - ./volumes/local/logs:/logs
      - ./volumes/local/tmp:/lychee-tmp
    ports:
      - "127.0.0.1:8000:8000"
    networks: [lychee-local]

networks:
  lychee-local:
    name: lychee-local
