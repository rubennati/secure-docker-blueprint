services:

  # --------------------------------------------------------
  # SEADOC (Collaborative Document Editing)
  # --------------------------------------------------------
  seadoc:
    # --- Identity ---
    image: seafileltd/sdoc-server:${SEADOC_TAG}
    container_name: ${CONTAINER_NAME_SEADOC}
    restart: unless-stopped
    # --- Resources ---
    # Collaborative document editing.
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 200
        reservations:
          memory: 128M

    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD}
      - DB_NAME=${SEAHUB_DB_NAME:-seahub_db}
      - TIME_ZONE=${TZ}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - NON_ROOT=false
      - SEAHUB_SERVICE_URL=http://app

    # --- Storage ---
    volumes:
      - ./volumes/seadoc-data:/shared

    # --- Health & Observability ---
    # Any HTTP answer means the server is serving, including a 5xx —
    # `-f` is deliberately absent, but not for the reason once written here.
    # curl --fail triggers at 400 and above; it does not fail on a redirect,
    # so a 3xx passes either way. What omitting it really buys is that a
    # broken application still reports healthy. Add `-f` once the response
    # this endpoint gives during startup is known (v0.8.0 / .ai/tasks.md).
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # --- Networking ---
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    labels:
      # Router: socket.io (WebSocket, no path stripping)
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc-ws.rule=Host(`${APP_TRAEFIK_HOST}`) && PathPrefix(`/socket.io/`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc-ws.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc-ws.priority=100"
      # Access policy repeated: this router runs at priority=100 and outranks the
      # main one, so it decides the request. Without this, acc-tailscale on the
      # stack leaves this path answering wherever the host answers.
      # WebSocket endpoint (/socket.io, required by SeaDoc). Access policy only —
      # see the sibling router for why the sec-* chain is not applied here either.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc-ws.middlewares=${APP_TRAEFIK_ACCESS}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc-ws.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc-ws.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc-ws.service=${COMPOSE_PROJECT_NAME}-seadoc"
      # Router: sdoc-server API (strip /sdoc-server prefix)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc.rule=Host(`${APP_TRAEFIK_HOST}`) && PathPrefix(`/sdoc-server`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-seadoc.middlewares=${APP_TRAEFIK_ACCESS}@file,seadoc-strip@docker"
      - "traefik.http.middlewares.seadoc-strip.stripprefix.prefixes=/sdoc-server"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-seadoc.loadbalancer.server.port=80"

networks:
  proxy-public:
    external: true
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
