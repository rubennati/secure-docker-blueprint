services:
  seafile-ai:
    image: ${SEAFILE_AI_IMAGE:-seafileltd/seafile-ai:13.0-latest}
    container_name: ${CONTAINER_NAME_AI}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # Model inference.
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 256M

    volumes:
      - ./volumes/seafile-data:/shared
    # ports:
    #   - 8888:8888
    environment:
      - SEAFILE_AI_LLM_TYPE=${SEAFILE_AI_LLM_TYPE:-openai}
      - SEAFILE_AI_LLM_URL=${SEAFILE_AI_LLM_URL:-}
      - SEAFILE_AI_LLM_KEY=${SEAFILE_AI_LLM_KEY:-}
      - SEAFILE_AI_LLM_MODEL=${SEAFILE_AI_LLM_MODEL:-gpt-4o-mini}
      - FACE_EMBEDDING_SERVICE_URL=${FACE_EMBEDDING_SERVICE_URL:-http://face-embedding:8886}
      - FACE_EMBEDDING_SERVICE_KEY=${FACE_EMBEDDING_SERVICE_KEY:-${JWT_PRIVATE_KEY:?Variable is not set or empty}}
      - SEAFILE_SERVER_URL=${INNER_SEAHUB_SERVICE_URL:-http://seafile-pro-app}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SEAFILE_AI_LOG_LEVEL=${SEAFILE_AI_LOG_LEVEL:-info}
      - CACHE_PROVIDER=${CACHE_PROVIDER:-redis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      seafile-pro-app:
        condition: service_healthy
    # --- Health & Observability ---
    # healthcheck: none — the image could not be pulled to establish what it
    # contains, and a check written without that is a guess. Establish it
    # the next time this stack runs:
    #   docker run --rm --entrypoint sh <image> -c 'command -v curl wget nc'

    networks:
      - app-internal

networks:
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true
