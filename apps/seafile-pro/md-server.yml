services:

  # --------------------------------------------------------
  # METADATA SERVER (File Metadata Management)
  # --------------------------------------------------------
  md-server:
    # --- Identity ---
    image: seafileltd/seafile-md-server:${MD_TAG}
    container_name: ${CONTAINER_NAME_MD_SERVER}
    restart: unless-stopped
    # --- Resources ---
    # Markdown rendering service.
    memswap_limit: 1G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 200
        reservations:
          memory: 128M

    depends_on:
      db:
        condition: service_healthy
      seafile-pro-app:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    # secrets-env.sh exports the Docker Secrets below, then starts the image's own command.
    entrypoint: ["/bin/sh", "/config/secrets-env.sh"]
    command: ["bash", "-c", "/opt/scripts/entrypoint.sh"]
    secrets:
      - SEAFILE_DB_PWD
      - JWT_KEY
      - REDIS_PWD
    environment:
      - SEAFILE_MYSQL_DB_HOST=db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=${DB_USER}
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_LOG_TO_STDOUT=false
      - MD_PORT=8084
      - MD_LOG_LEVEL=${MD_LOG_LEVEL:-info}
      - MD_MAX_CACHE_SIZE=${MD_MAX_CACHE_SIZE:-1GB}
      - MD_CHECK_UPDATE_INTERVAL=30m
      - MD_FILE_COUNT_LIMIT=${MD_FILE_COUNT_LIMIT:-100000}
      - MD_STORAGE_TYPE=${MD_STORAGE_TYPE:-disk}
      - SEAF_SERVER_STORAGE_TYPE=${SEAF_SERVER_STORAGE_TYPE:-disk}
      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    # --- Storage ---
    volumes:
      - ./config/secrets-env.sh:/config/secrets-env.sh:ro
      - ./volumes/seafile-data:/shared

    # --- Health & Observability ---
    # healthcheck: none yet. The image has a shell (secrets-env.sh runs in
    # it), but no endpoint or command has been established that tells a
    # working server from a running process.

    # --- Networking ---
    networks:
      - app-internal

networks:
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
