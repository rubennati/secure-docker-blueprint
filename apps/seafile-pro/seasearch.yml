services:

  # --------------------------------------------------------
  # SEASEARCH (Full-text Search)
  # Lightweight alternative to Elasticsearch, recommended by Seafile.
  # To use Elasticsearch instead, see UPSTREAM.md.
  # --------------------------------------------------------
  seasearch:
    # --- Identity ---
    image: seafileltd/seasearch:${SEASEARCH_TAG}
    container_name: ${CONTAINER_NAME_SEASEARCH}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    # --- Resources ---
    # Search index.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 256M

    # secrets-env.sh exports the Docker Secrets below, then starts the image's own command.
    entrypoint: ["/bin/sh", "/config/secrets-env.sh"]
    command: ["/opt/scripts/entrypoint.sh"]
    secrets:
      - SEAFILE_ADMIN_PWD
    environment:
      - SS_FIRST_ADMIN_USER=${SEAFILE_ADMIN_EMAIL}
      - SS_MAX_OBJ_CACHE_SIZE=${SS_MAX_OBJ_CACHE_SIZE:-10GB}
      - SS_STORAGE_TYPE=${SS_STORAGE_TYPE:-disk}
      - SS_LOG_TO_STDOUT=false
      - SS_LOG_DIR=/opt/seasearch/data/log
      - SS_LOG_LEVEL=${SS_LOG_LEVEL:-info}

    # --- Storage ---
    volumes:
      - ./config/secrets-env.sh:/config/secrets-env.sh:ro
      - ./volumes/seasearch-data:/opt/seasearch/data

    # --- Health & Observability ---
    # healthcheck: none yet. The image has a shell (secrets-env.sh runs in
    # it), but no endpoint or command has been established that tells a
    # working server from a running process.

    # --- Networking ---
    networks:
      - app-internal

networks:
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
