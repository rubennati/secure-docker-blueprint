{
    "device.node_id": "opencanary",
    "ip.ignorelist": [],

    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",

    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "Ubuntu 14.04 LTS",

    "http.enabled": true,
    "http.port": 80,
    "http.skin": "nasLogin",

    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.5.43-0ubuntu0.14.04.1",

    "rdp.enabled": true,
    "rdp.port": 3389,

    "_comment_disabled_by_default": "Enable more modules here as needed — see the upstream sample config for the full list (git, https, httpproxy, mongodb, mssql, ntp, redis, sip, snmp, ssh, tftp, vnc). Each needs a matching port published in docker-compose.yml.",

    "smb.enabled": false,
    "_comment_smb": "SMB needs an extra host-side audit-log bind mount — see README.md before enabling.",

    "portscan.enabled": false,
    "_comment_portscan": "Deliberately disabled, not worked around. The portscan module shells out to iptables to detect scan patterns; Docker's network namespace does not give a container the same iptables view as the host, and the module does not work correctly here. See UPSTREAM.md.",

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": { "format": "%(message)s" }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                }
            }
        }
    },

    "_comment_alerting": "No file handler by default — every hit already goes to stdout (docker compose logs), and this stack runs read_only with no writable log path. To forward hits elsewhere in real time, add a WebhookHandler, SlackHandler or TeamsHandler under logger.kwargs.handlers — see README.md#alerting."
}
