# Easy!Appointments — local
#
#   cp .env.local.example .env.local
#   mkdir -p volumes/local/mysql volumes/local/storage
#   sudo chown -R 33:33 volumes/local/storage
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:8080/index.php/installation
#   http://localhost:8080/index.php/user/login
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  db:
    image: mariadb:${DB_TAG}
    container_name: easyappointments-local-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./volumes/local/mysql:/var/lib/mysql
    networks: [easyappointments-local]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: alextselegidis/easyappointments:${APP_TAG}
    container_name: easyappointments-local-app
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ}
      BASE_URL: http://localhost:8080
      DEBUG_MODE: "false"
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_ANALYTICS_CODE: ""
      SESSION_EXPIRATION: "7200"
    volumes:
      - ./volumes/local/storage:/var/www/html/storage
    ports:
      - "127.0.0.1:8080:80"
    networks: [easyappointments-local]
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  easyappointments-local:
    name: easyappointments-local
