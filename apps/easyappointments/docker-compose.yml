services:

  # --------------------------------------------------------
  # DATABASE (MySQL / MariaDB)
  # --------------------------------------------------------
  db:
    image: mariadb:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]

    # --- Resources ---
    # Ceiling above the buffer pool, connections and temporary tables.
    memswap_limit: 1G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 200
        reservations:
          memory: 256M

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PWD
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PWD
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    secrets:
      - DB_PWD
      - DB_ROOT_PWD

    volumes:
      - ./volumes/mysql:/var/lib/mysql

    networks:
      - app-internal

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------
  # EASY!APPOINTMENTS (PHP self-hosted scheduling)
  # --------------------------------------------------------
  easyappointments-app:
    image: alextselegidis/easyappointments:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    # --- Resources ---
    # Generous ceiling: a limit the normal workload reaches is a limit that
    # kills imports and background jobs. Retune from docker stats, not down to it.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M

    depends_on:
      db:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    environment:
      TZ: ${TZ}
      BASE_URL: https://${APP_TRAEFIK_HOST}
      DEBUG_MODE: "false"
      # Database — EA reads DB_PASSWORD inline from env (no _FILE support).
      # Value must match contents of .secrets/db_pwd.txt.
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PWD_INLINE}
      # Optional Google Calendar sync — configure in UI or via env
      GOOGLE_ANALYTICS_CODE: ""
      # Session + CSRF tokens
      SESSION_EXPIRATION: "7200"

    volumes:
      - ./volumes/storage:/var/www/html/storage

    # --- Health & Observability ---
    # Any HTTP answer means the server is serving, including a 5xx —
    # `-f` is deliberately absent, but not for the reason once written here.
    # curl --fail triggers at 400 and above; it does not fail on a redirect,
    # so a 3xx passes either way. What omitting it really buys is that a
    # broken application still reports healthy. Add `-f` once the response
    # this endpoint gives during startup is known (v0.8.0 / .ai/tasks.md).
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - proxy-public
      - app-internal

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_HEADERS}@file,${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_LIMIT}@file,${APP_TRAEFIK_AUTH}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      # The image serves its build files from the web root: the dependency list
      # with exact versions (vendor/composer/installed.json, 77 kB), composer.json,
      # README.md, CHANGELOG.md and LICENSE (final audit FA-34). The pages load
      # nothing from these paths — assets come from /assets/. A second router of
      # higher priority answers them with 404 and lets nobody through; it keeps
      # the four positions, so a refusal carries the headers as well.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.rule=Host(`${APP_TRAEFIK_HOST}`) && (PathPrefix(`/vendor/`) || Path(`/composer.json`) || Path(`/composer.lock`) || Path(`/README.md`) || Path(`/CHANGELOG.md`) || Path(`/LICENSE`))"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.priority=1000"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.middlewares=${APP_TRAEFIK_HEADERS}@file,${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_LIMIT}@file,${APP_TRAEFIK_AUTH},${COMPOSE_PROJECT_NAME}-files-deny@docker"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.service=${COMPOSE_PROJECT_NAME}"
      # Nobody: 192.0.2.1 is TEST-NET-1 (RFC 5737) and never a client — unlike
      # access-blocked, whose placeholder 127.0.0.1 admits Traefik's own namespace.
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-files-deny.ipallowlist.sourcerange=192.0.2.1/32"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-files-deny.ipallowlist.rejectstatuscode=404"

networks:
  proxy-public:
    name: ${TRAEFIK_NETWORK}
    external: true
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  DB_ROOT_PWD:
    file: ./.secrets/db_root_pwd.txt
