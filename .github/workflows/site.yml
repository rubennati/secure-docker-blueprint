name: Site build

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Astro/Starlight site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # Before the content gate runs, prove the gate still works. A rule whose
      # regex has quietly stopped matching would otherwise report "clean".
      - name: Verify the content checks catch what they claim
        working-directory: site
        run: npm run check:self

      - name: Build site
        working-directory: site
        run: npm run build

      # Blocks dangerous or unpinned commands in documented instructions, and
      # internal links or anchors that do not resolve. Runs after the build
      # because the link checks read dist/.
      - name: Check content
        working-directory: site
        run: npm run check
