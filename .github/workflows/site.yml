name: Site build

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

# One deployment at a time, and a superseded run is cancelled rather than
# queued: the newer commit is the one that should be live, and two runs racing
# to publish decide the result by finishing order.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro/Starlight site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # Before the content gate runs, prove the gate still works. A rule whose
      # regex has quietly stopped matching would otherwise report "clean".
      - name: Verify the content checks catch what they claim
        working-directory: site
        run: npm run check:self

      - name: Build site
        working-directory: site
        run: npm run build

      # Blocks dangerous or unpinned commands in documented instructions, and
      # internal links or anchors that do not resolve. Runs after the build
      # because the link checks read dist/.
      - name: Check content
        working-directory: site
        run: npm run check

      # Only what passed everything above becomes a publishable artifact, and
      # only from main. A pull request builds and is checked; it does not
      # produce something that could be deployed.
      - name: Package the built site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Scoped to this job rather than the file: publishing is the only step that
    # needs write access, and `id-token` is what lets Pages verify the artifact
    # came from this workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
