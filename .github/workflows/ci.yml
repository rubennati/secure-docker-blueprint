name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC — catches stale configs even without commits
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: read-all

jobs:

  # ─────────────────────────────────────────────
  # 1. SECRET SCANNING
  # ─────────────────────────────────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 2. COMPOSE SYNTAX VALIDATION
  # ─────────────────────────────────────────────
  compose-validate:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate all compose files
        run: |
          failed=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            [ -f "$dir/.env.example" ] && cp "$dir/.env.example" "$dir/.env"
            echo -n "  checking $file ... "
            if docker compose -f "$file" config --quiet 2>/dev/null; then
              echo "ok"
            else
              echo "FAIL"
              docker compose -f "$file" config 2>&1 | head -20
              failed=1
            fi
            [ -f "$dir/.env" ] && rm -f "$dir/.env"
          done < <(find core apps business monitoring -name "docker-compose.yml" | sort)
          exit $failed

  # ─────────────────────────────────────────────
  # 3. STRUCTURE CHECK
  # ─────────────────────────────────────────────
  structure:
    name: Structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check README, .env.example, no :latest
        run: |
          failed=0

          echo "── README + .env.example ──────────────────"
          while IFS= read -r compose; do
            dir=$(dirname "$compose")
            [[ "$dir" == *"templates"* ]] && continue
            if [ ! -f "$dir/README.md" ]; then
              echo "  MISSING README.md    : $dir"
              failed=1
            fi
            if [ ! -f "$dir/.env.example" ]; then
              echo "  MISSING .env.example : $dir"
              failed=1
            fi
          done < <(find core apps business monitoring -name "docker-compose.yml" | sort)

          echo "── :latest tags (non-commented lines) ─────"
          while IFS= read -r file; do
            # Match only actual image: lines — lines starting with # are comments
            if grep -qP '^\s+image:\s+\S+:latest' "$file" 2>/dev/null; then
              echo "  :latest found        : $file"
              grep -nP '^\s+image:\s+\S+:latest' "$file"
              failed=1
            fi
          done < <(find core apps business monitoring -name "docker-compose.yml" | sort)

          [ "$failed" -eq 0 ] && echo "  all checks passed"
          exit $failed

  # ─────────────────────────────────────────────
  # 4. SENTINEL VALUE CHECK
  # ─────────────────────────────────────────────
  # .env.example files contain __REPLACE_ME__ as a forcing function
  # so deployers must substitute real values. This job fails if any
  # committed .env file (not .env.example) still contains a sentinel —
  # catching the case where someone committed an unsubstituted .env.
  # Runtime deployments are not covered by CI; this only catches git.
  sentinel:
    name: Sentinel value check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Fail if committed .env contains __REPLACE_ME__
        run: |
          # Find .env files that are NOT .env.example
          files=$(find . -name ".env" -not -name ".env.example" -not -path "./.git/*")
          if [ -z "$files" ]; then
            echo "No committed .env files found — ok"
            exit 0
          fi
          failed=0
          while IFS= read -r f; do
            if grep -q "__REPLACE_ME__" "$f" 2>/dev/null; then
              echo "FAIL: $f contains __REPLACE_ME__ — replace all sentinel values before committing"
              failed=1
            fi
          done <<< "$files"
          exit $failed

  # ─────────────────────────────────────────────
  # 5. SECURITY BASELINE (custom script)
  # ─────────────────────────────────────────────
  baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PyYAML
        run: pip install --require-hashes -r scripts/ci/requirements.txt --quiet

      - name: Run baseline check
        run: python3 scripts/ci/check-baseline.py "$GITHUB_STEP_SUMMARY"
