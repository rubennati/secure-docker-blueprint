name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC — catches stale configs even without commits
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: read-all

jobs:

  # ─────────────────────────────────────────────
  # 1. SECRET SCANNING
  # ─────────────────────────────────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 2. COMPOSE SYNTAX VALIDATION
  # ─────────────────────────────────────────────
  compose-validate:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: pip install --require-hashes -r scripts/ci/requirements.txt --quiet

      # Validated per stack directory, not per file. A split-compose stack's
      # fragments do not stand alone — apps/seafile/seadoc.yml declares a service
      # that depends on `db`, which lives in seafile-server.yml, so validating it
      # by itself fails on a stack that is entirely correct. Running `docker
      # compose config` inside the directory picks up COMPOSE_FILE from the .env,
      # which is what the operator runs and what therefore has to parse.
      #
      # The directory list comes from check-structure.py --list, so there is one
      # discovery in this repository. The `find` this used to run missed all
      # fourteen Seafile fragments and backup/urbackup — fifteen files that were
      # never syntax-validated while the Python checkers reported full coverage.
      - name: Validate all compose files
        run: |
          failed=0
          while IFS= read -r dir; do
            [ -f "$dir/.env.example" ] && cp "$dir/.env.example" "$dir/.env"
            echo -n "  checking $dir ... "
            if (cd "$dir" && docker compose config --quiet 2>/dev/null); then
              echo "ok"
            else
              echo "FAIL"
              (cd "$dir" && docker compose config 2>&1 | head -20)
              failed=1
            fi
            [ -f "$dir/.env" ] && rm -f "$dir/.env"
          done < <(python3 scripts/ci/check-structure.py --list | xargs -n1 dirname | sort -u)
          exit $failed

  # ─────────────────────────────────────────────
  # 3. STRUCTURE CHECK
  # ─────────────────────────────────────────────
  # Every stack must be documented and configurable. Tag pinning used to live
  # here too; check-structure.py (job 6) now covers it more strictly — it also
  # rejects major-only tags, not just :latest — so this job keeps only the
  # file-presence rule, which check-structure.py reports as a warning.
  structure:
    name: Required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: pip install --require-hashes -r scripts/ci/requirements.txt --quiet

      - name: Every stack has a README and a .env.example
        run: |
          failed=0
          while IFS= read -r dir; do
            [[ "$dir" == *"templates"* ]] && continue
            if [ ! -f "$dir/README.md" ]; then
              echo "  MISSING README.md    : $dir"
              failed=1
            fi
            if [ ! -f "$dir/.env.example" ]; then
              echo "  MISSING .env.example : $dir"
              failed=1
            fi
          done < <(python3 scripts/ci/check-structure.py --list | xargs -n1 dirname | sort -u)

          [ "$failed" -eq 0 ] && echo "  all stacks documented"
          exit $failed

  # ─────────────────────────────────────────────
  # 4. SENTINEL VALUE CHECK
  # ─────────────────────────────────────────────
  # .env.example files contain __REPLACE_ME__ as a forcing function
  # so deployers must substitute real values. This job fails if any
  # committed .env file (not .env.example) still contains a sentinel —
  # catching the case where someone committed an unsubstituted .env.
  # Runtime deployments are not covered by CI; this only catches git.
  sentinel:
    name: Sentinel value check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if committed .env contains __REPLACE_ME__
        run: |
          # Find .env files that are NOT .env.example
          files=$(find . -name ".env" -not -name ".env.example" -not -path "./.git/*")
          if [ -z "$files" ]; then
            echo "No committed .env files found — ok"
            exit 0
          fi
          failed=0
          while IFS= read -r f; do
            if grep -q "__REPLACE_ME__" "$f" 2>/dev/null; then
              echo "FAIL: $f contains __REPLACE_ME__ — replace all sentinel values before committing"
              failed=1
            fi
          done <<< "$files"
          exit $failed

  # ─────────────────────────────────────────────
  # 5. SECURITY BASELINE (custom script)
  # ─────────────────────────────────────────────
  baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: pip install --require-hashes -r scripts/ci/requirements.txt --quiet

      - name: Run baseline check
        run: python3 scripts/ci/check-baseline.py "$GITHUB_STEP_SUMMARY"

      - name: CrowdSec remediation ships default-off
        run: python3 scripts/ci/check-crowdsec-config.py --templates

  # ─────────────────────────────────────────────
  # 6. CANONICAL STRUCTURE (docs/standards/*-structure.md)
  # Fails only on the dangerous rules — :latest tags, plaintext secrets,
  # unprotected .secrets/, a datastore on proxy-public. Structural drift
  # (missing resource limits, healthchecks) is reported, not blocking.
  # ─────────────────────────────────────────────
  structure-canonical:
    name: Canonical structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: pip install --require-hashes -r scripts/ci/requirements.txt --quiet

      - name: Run structure check
        run: python3 scripts/ci/check-structure.py "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # 7. STATUS MODEL (docs/standards/status-model.md)
  # Catches a status claim that is not backed — the owner and the root README
  # disagreeing, ✅ without a verification date, or LIFECYCLE.md left stale.
  # ─────────────────────────────────────────────
  lifecycle:
    name: Status model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check status consistency and LIFECYCLE.md freshness
        run: python3 scripts/ci/lifecycle-report.py --check "$GITHUB_STEP_SUMMARY"

      # A stack that loses its licence or origin loses it silently — the field
      # is prose in a file nothing reads. Twelve stacks had already drifted
      # before anyone looked. This is what stops it happening again.
      - name: Check licence and origin are complete and current
        run: python3 scripts/ci/sovereignty-report.py --check

  # ─────────────────────────────────────────────
  # 8. CHECKER COVERAGE
  # Inverts the question the other jobs ask: not "does this stack comply?" but
  # "is there content nothing looks at?". Three blind spots surfaced by accident
  # in one day — split compose files, a component without compose, and a whole
  # category missing from the checker roots. Finding the next one by accident
  # does not scale.
  # ─────────────────────────────────────────────
  coverage:
    name: Checker coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: pip install --require-hashes -r scripts/ci/requirements.txt --quiet

      - name: Check that every content directory is covered
        run: python3 scripts/ci/check-coverage.py "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # 9. DOCS QA
  # This repository is mostly documentation, and documentation rots silently:
  # a renamed file leaves a dead link, a moved heading leaves a dead anchor,
  # and nothing complains until a reader hits it. Closes the markdown-lint item
  # in the v1.0 CI baseline.
  #
  # External URLs are deliberately not fetched — they fail for reasons unrelated
  # to the commit under test.
  #
  # The prose register is checked across the whole repository. It was
  # differential while reader-facing files still carried findings older than the
  # phrase list; that inventory is now clear, so any blocking finding anywhere
  # fails here. Maintainer files still only warn — a findings log records how
  # something was established, and that is its subject.
  # ─────────────────────────────────────────────
  docs-qa:
    name: Docs QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2

      - name: Check internal links and anchors
        run: python3 scripts/ci/check-links.py "$GITHUB_STEP_SUMMARY"

      - name: Prose register — checker regression tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Prose register — whole repository
        run: python3 scripts/ci/check-prose.py --hints

  # ─────────────────────────────────────────────
  # 10. WORKFLOW SUPPLY CHAIN
  # An action referenced by tag is mutable — the owner can move `@v7` at any
  # time, and the new code runs with the same repository permissions. This
  # repository pinned by SHA everywhere except site.yml, which had drifted back
  # to `@v7` because nothing checked.
  # ─────────────────────────────────────────────
  workflows:
    name: Workflow supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check action pinning and workflow permissions
        run: python3 scripts/ci/check-workflows.py "$GITHUB_STEP_SUMMARY"
