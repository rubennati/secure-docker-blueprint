name: Trivy

# Trivy scans for:
#   1. IaC misconfigurations — all config files in the repository (fast, no image pulls)
#      Results are uploaded to the GitHub Security tab as SARIF.
#   2. CVEs in container images — curated high-priority image list (scripts/ci/list-images.sh)
#      Results appear in CI logs. Fails on CRITICAL severity.
#
# Triggers: push/PR to main, weekly Monday 04:00 UTC, manual dispatch.
#
# Limitations (documented in docs/security-verification.md):
#   - Image scanning covers ~11 high-risk compose files, not all 50+.
#   - Images are pulled at scan time; new CVEs only detected on next scheduled run.
#   - Tags are pinned to versions but not to digest. A re-tagged upstream image
#     with a new CVE is not detected until the next push or scheduled run.
#   - CRITICAL severity blocks CI. HIGH severity is reported but non-blocking.
#   - --ignore-unfixed is set; CVEs with no available fix are skipped to reduce noise.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to GitHub Security tab

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. IaC MISCONFIGURATION SCAN
  # ─────────────────────────────────────────────────────────────────────────
  # Scans the repository for Docker Compose and config misconfigurations.
  # No image pulls required — completes in seconds.
  # Results are uploaded to the GitHub Security tab.
  #
  # Note: exit-code is 0 here. The custom baseline (check-baseline.py in ci.yml)
  # is the authoritative control for compose security. This scan is informational
  # and may overlap with check-baseline.py findings.
  config-scan:
    name: IaC config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan repository for IaC misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-iac

  # ─────────────────────────────────────────────────────────────────────────
  # 2. IMAGE CVE SCAN
  # ─────────────────────────────────────────────────────────────────────────
  # Scans container images from the curated high-risk list for known CVEs.
  # Results appear in CI logs. Fails the job on CRITICAL severity.
  image-scan:
    name: Image CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install gettext (provides envsubst for image list resolution)
        run: sudo apt-get install -y gettext-base --quiet

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Dummy scan used only to install the Trivy CLI on the runner.
          # The actual image scanning below calls trivy directly in a loop.
          scan-type: image
          image-ref: alpine:latest
          exit-code: '0'
          severity: NONE

      - name: Extract image list from compose files
        run: |
          bash scripts/ci/list-images.sh | tee /tmp/images.txt
          echo "$(wc -l < /tmp/images.txt) images to scan"

      - name: Scan for CRITICAL CVEs
        # exit-code 0: non-blocking while the CVE baseline is being established.
        # The scan still runs and reports all findings in the job log.
        # Change to exit-code 1 once the baseline is reviewed and known
        # CRITICALs in pinned images are either remediated or accepted.
        run: |
          while IFS= read -r image; do
            echo "── $image"
            trivy image \
              --quiet \
              --no-progress \
              --ignore-unfixed \
              --severity CRITICAL,HIGH \
              --exit-code 0 \
              "$image" || true
          done < /tmp/images.txt
