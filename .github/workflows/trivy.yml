name: Trivy

# Trivy scans for:
#   1. IaC misconfigurations — all config files in the repository (fast, no image pulls)
#      Results are uploaded to the GitHub Security tab as SARIF.
#   2. CVEs in container images — every image the checkers discover (scripts/ci/list-images.sh)
#      Full per-image findings go to a workflow artifact (trivy-image-scan-results);
#      the job's own summary page carries the concise index. Trivy's own exit code
#      stays 0; the gate step fails the job on a CRITICAL absent from
#      .trivy-baseline.json — see docs/security-verification.md for the current
#      control description.
#
# Triggers: push/PR to main, weekly Monday 04:00 UTC, manual dispatch. A pull
# request to main scans in full, whatever changed: it is the last check before
# the published branch, and both jobs are required there. On push, job 2
# (image-scan) only runs when an input that can change the discovered image set
# changed (see the detect-changes job below); job 1 (config-scan) stays
# unconditional. Schedule and manual dispatch always run both jobs in full.
#
# Limitations (documented in docs/security-verification.md):
#   - Image scanning covers every compose file check-structure.py --list reports.
#   - Images are pulled at scan time; new CVEs only detected on next scheduled run.
#   - Tags are pinned to versions but not to digest.
#   - --ignore-unfixed: a CVE with no published fix is excluded from every count
#     this job produces. That is not a claim it is safe to ignore — only that no
#     fix exists yet for a pin change to apply.
#   - Trivy's own exit code stays 0 on every image. The gate is a separate step:
#     trivy-gate.py fails the job on a CRITICAL absent from .trivy-baseline.json,
#     so findings recorded as known pass and new ones do not.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 04:00 UTC
  workflow_dispatch:

permissions: read-all

# A superseded run on the same open PR is cancelled. A push to main or a
# scheduled/manual run never shares this group with a PR (different ref), so
# cancellation here can never touch the weekly scan or landed evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # 0. DETECT IMAGE-RELEVANT CHANGES
  # ─────────────────────────────────────────────────────────────────────────
  # Gates job 2 (image-scan) on a push only. A pull request to main scans in
  # full — see the first branch below. Job 1 (config-scan) is fast and stays
  # unconditional on its existing triggers.
  #
  # list-images.sh's actual inputs, verified from source rather than assumed:
  # production compose files under core/, apps/, business/, monitoring/,
  # backup/ (check-structure.py's ROOTS — *.local.yml overlays are excluded
  # from image resolution, so they don't gate this either), each stack's
  # .env.example (sourced to resolve ${VAR} image tags), and the discovery/
  # scan/summarize scripts themselves. A change to none of these cannot change
  # which images get pulled or scanned. A pull request to main, the schedule
  # and a manual dispatch always scan everything: new CVEs appear in
  # already-published images independent of any commit here.
  detect-changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    outputs:
      images_changed: ${{ steps.diff.outputs.images_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Pull request to \`main\` — scanning all images regardless of changes: the last check before the published branch." >> "$GITHUB_STEP_SUMMARY"
            echo "images_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "${{ github.event_name }} run — scanning all images regardless of changes." >> "$GITHUB_STEP_SUMMARY"
            echo "images_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No comparable base commit (new branch) — scanning all images." >> "$GITHUB_STEP_SUMMARY"
            echo "images_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A diff that cannot be trusted must not be read as "no changes" —
          # fail safe by scanning all images, not by skipping.
          if ! changed="$(git diff --name-only "$base" "$head" 2>&1)"; then
            echo "git diff $base..$head failed — scanning all images (failing safe): $changed" >> "$GITHUB_STEP_SUMMARY"
            echo "images_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files ($base..$head):"
          echo "$changed"

          pattern='^(core|apps|business|monitoring|backup)/.*\.ya?ml$'
          pattern+='|^(core|apps|business|monitoring|backup)/.*/\.env\.example$'
          pattern+='|^scripts/ci/(check-structure\.py|list-images\.sh|trivy-summarize\.py)$'
          pattern+='|^\.github/workflows/trivy\.yml$'

          if echo "$changed" | grep -E "$pattern" | grep -qv '\.local\.yml$'; then
            echo "images_changed=true" >> "$GITHUB_OUTPUT"
            echo "Image-relevant input changed — image scan will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "images_changed=false" >> "$GITHUB_OUTPUT"
            echo "No compose file, \`.env.example\`, or scan-script input changed — image scan skipped for this run. The weekly schedule still covers this image set in full." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # 1. IaC MISCONFIGURATION SCAN
  # ─────────────────────────────────────────────────────────────────────────
  # Scans the repository for Docker Compose and config misconfigurations.
  # No image pulls required — completes in seconds.
  # Results are uploaded to the GitHub Security tab.
  #
  # Note: exit-code is 0 here. The custom baseline (check-baseline.py in ci.yml)
  # is the authoritative control for compose security. This scan is informational.
  config-scan:
    name: IaC config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to GitHub Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository for IaC misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-iac

  # ─────────────────────────────────────────────────────────────────────────
  # 2. IMAGE CVE SCAN
  # ─────────────────────────────────────────────────────────────────────────
  # Scans every image list-images.sh resolves. Trivy's exit code stays 0 so the
  # scan reports rather than judges; the gate that follows it blocks a CRITICAL
  # that is not recorded in .trivy-baseline.json.
  #
  # Each image is scanned individually to its own JSON report rather than one
  # combined run, so one image's scan failure (see the loop below) never loses
  # the results already collected for the others.
  image-scan:
    name: Image CVE scan
    needs: detect-changes
    if: needs.detect-changes.outputs.images_changed == 'true'
    runs-on: ubuntu-latest
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML (list-images.sh discovers compose files via check-structure.py)
        run: pip install --require-hashes -r scripts/ci/requirements.txt --quiet

      - name: Install gettext (provides envsubst for image list resolution)
        run: sudo apt-get install -y gettext-base --quiet

      - name: Install Trivy CLI
        run: |
          # Download pre-built binary and verify SHA256 before execution.
          # Both TRIVY_VERSION and TRIVY_CHECKSUM must be updated together on bumps.
          # Checksums: https://github.com/aquasecurity/trivy/releases/download/v<ver>/trivy_<ver>_checksums.txt
          TRIVY_VERSION="0.74.0"
          TRIVY_CHECKSUM="2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
          curl -sfLo /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_CHECKSUM}  /tmp/trivy.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm /tmp/trivy.tar.gz
          trivy --version

      - name: Cache Trivy vulnerability database
        # One entry per UTC day: every push/PR/manual run that day restores it
        # instead of downloading the ~300 MB database again. Trivy's own
        # staleness check (embedded in the cached metadata) still decides
        # whether to refresh it — this cache does not skip or widen that
        # check, it only avoids re-fetching a copy that check would keep
        # anyway. restore-keys falls back to the most recent day available if
        # today's entry does not exist yet, so the very first run of a new
        # day still starts from a warm cache rather than nothing.
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-

      - name: Extract image list from compose files
        run: |
          bash scripts/ci/list-images.sh | tee /tmp/images.txt
          echo "$(wc -l < /tmp/images.txt) images to scan"

      - name: Scan for CVEs (CRITICAL + HIGH, non-blocking)
        # Every image gets its own JSON report — the full per-package findings
        # Trivy produces, not the table this job used to print into the log.
        # An image that fails to scan writes no report; its name and Trivy's
        # own reason go to failures.tsv instead, so "not scanned" is never
        # silently read as "scanned clean" — trivy-summarize.py below reports
        # it under its own heading, by name, with that reason.
        run: |
          mkdir -p /tmp/trivy-results
          : > /tmp/trivy-failures.tsv
          while IFS= read -r image; do
            safe=$(echo "$image" | tr -c 'A-Za-z0-9._-' '_')
            outfile="/tmp/trivy-results/${safe}.json"
            errfile=$(mktemp)
            if trivy image \
              --quiet \
              --format json \
              --ignore-unfixed \
              --severity CRITICAL,HIGH \
              --exit-code 0 \
              --output "$outfile" \
              "$image" 2>"$errfile"; then
              :
            else
              reason=$(grep -v '^[[:space:]]*$' "$errfile" | tail -1 | sed -E 's/^[[:space:]]*\*[[:space:]]*//')
              printf '%s\t%s\n' "$image" "${reason:-scan failed, no reason captured}" >> /tmp/trivy-failures.tsv
              rm -f "$outfile"
            fi
            rm -f "$errfile"
          done < /tmp/images.txt

      - name: Summarize results
        if: always()
        run: |
          python3 scripts/ci/trivy-summarize.py \
            --results-dir /tmp/trivy-results \
            --failures-file /tmp/trivy-failures.tsv \
            --images-total "$(wc -l < /tmp/images.txt)" \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Gate on unrecorded CRITICAL findings
        # The scan itself stays non-blocking. What blocks is a CRITICAL that the
        # repository has not accounted for: `.trivy-baseline.json` records the
        # ones that exist today, and anything outside it fails here. Making the
        # scan itself blocking would fail every pull request on the first day,
        # because the blueprint does not build these images and the findings sit
        # in layers upstream ships — see .ai/decisions.md, 2026-09-20.
        #
        # Coverage can only shrink deliberately. An image that stops scanning
        # contributes no findings, so it can never fail the CVE half; it fails
        # here unless it is acknowledged in the baseline with a reason. The same
        # goes for an image discovery resolved that left neither a report nor a
        # recorded failure — hence --images-total.
        run: |
          python3 scripts/ci/trivy-gate.py \
            --results-dir /tmp/trivy-results \
            --failures-file /tmp/trivy-failures.tsv \
            --images-total "$(wc -l < /tmp/images.txt)" \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-scan-results
          path: |
            /tmp/trivy-results/
            /tmp/trivy-failures.tsv
          if-no-files-found: warn
