name: Trivy

# Trivy scans for:
#   1. IaC misconfigurations — all config files in the repository (fast, no image pulls)
#      Results are uploaded to the GitHub Security tab as SARIF.
#   2. CVEs in container images — every image the checkers discover (scripts/ci/list-images.sh)
#      Full per-image findings go to a workflow artifact (trivy-image-scan-results);
#      the job's own summary page carries the concise index. Trivy's own exit code
#      stays 0, and so does the report step for a CRITICAL absent from
#      .trivy-baseline.json: a finding in an upstream image is reported, never
#      blocking (DEC-079) — see docs/standards/ci.md.
#   3. Stack status — after every image scan: per stack the
#      pinned tag, the newest upstream tag in the same shape, both release dates,
#      whether upstream is archived or quiet, and the findings of this scan
#      (scripts/ci/upstream-status.py), written on main to the pinned issue
#      labelled `stack-status`. The same data, as upstream-status.json, is the
#      artifact the maintainer commits at a pin move and before a release
#      (DEC-080).
#
# Triggers: PR to main, push to main, weekly Monday 04:00 UTC, manual
# dispatch (DEC-081). The IaC config scan runs on every trigger: it takes
# seconds, is a required check on main and uploads main's SARIF. The image
# scan and the stack status run on the weekly schedule and on manual dispatch
# only. Their answer changes with the calendar, not with a merge: a CVE is
# published against an image whose pin has not moved. The weekly run finds
# those on main; a pin move or a release is scanned by hand on its branch
# (docs/maintenance.md, Version Chain step 7 and Release Chain step 4), and
# that run's artifact is the upstream data the change commits. A scan on the
# pull request into main and again on the push after its merge would repeat
# that run on the same tree, about 25 minutes each, and change no outcome,
# since a finding does not block (DEC-079). On a pull request and a push the
# image job shows as skipped.
#
# Limitations (documented in docs/security-verification.md):
#   - Image scanning covers every compose file check-structure.py --list reports.
#   - Images are pulled at scan time; new CVEs only detected on next scheduled run.
#   - Tags are pinned to versions but not to digest.
#   - --ignore-unfixed: a CVE with no published fix is excluded from every count
#     this job produces. That is not a claim it is safe to ignore — only that no
#     fix exists yet for a pin change to apply.
#   - Trivy's own exit code stays 0 on every image. trivy-gate.py then names
#     every CRITICAL that is not listed under an image exception in
#     .trivy-baseline.json, each with its stacks, reason and risk, and exits 0
#     for it. It fails only on the repository's own errors: an exception
#     without its reason, an unreadable report, an image that left no trace.
#     A finding with a fixed upstream release is fixed by the pin instead.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 04:00 UTC
  workflow_dispatch:

# Least privilege: the token reads the repository and nothing else; a job
# that needs more names it in its own block.
permissions:
  contents: read

# A superseded run on the same open PR is cancelled. A push, scheduled or
# manual run never shares this group with a PR (different ref), so
# cancellation here can never touch the run on main or the weekly scan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. IaC MISCONFIGURATION SCAN
  # ─────────────────────────────────────────────────────────────────────────
  # Scans the repository for Docker Compose and config misconfigurations.
  # No image pulls required — completes in seconds.
  # Results are uploaded to the GitHub Security tab.
  #
  # Note: exit-code is 0 here. The custom baseline (check-baseline.py in ci.yml)
  # is the authoritative control for compose security. This scan is informational.
  config-scan:
    name: IaC config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to GitHub Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository for IaC misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-iac

  # ─────────────────────────────────────────────────────────────────────────
  # 2. IMAGE CVE SCAN
  # ─────────────────────────────────────────────────────────────────────────
  # Scans every image list-images.sh resolves. Trivy's exit code stays 0 so the
  # scan reports rather than judges; the step that follows it names a CRITICAL
  # that is not recorded in .trivy-baseline.json and blocks nothing (DEC-079).
  #
  # Each image is scanned individually to its own JSON report rather than one
  # combined run, so one image's scan failure (see the loop below) never loses
  # the results already collected for the others.
  image-scan:
    name: Image CVE scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML (list-images.sh discovers compose files via check-structure.py)
        run: pip install --require-hashes -r scripts/ci/requirements.txt --quiet

      - name: Install gettext (provides envsubst for image list resolution)
        run: sudo apt-get install -y gettext-base --quiet

      - name: Install Trivy CLI
        run: |
          # Download pre-built binary and verify SHA256 before execution.
          # Both TRIVY_VERSION and TRIVY_CHECKSUM must be updated together on bumps.
          # Checksums: https://github.com/aquasecurity/trivy/releases/download/v<ver>/trivy_<ver>_checksums.txt
          TRIVY_VERSION="0.74.0"
          TRIVY_CHECKSUM="2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
          curl -sfLo /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_CHECKSUM}  /tmp/trivy.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm /tmp/trivy.tar.gz
          trivy --version

      - name: Cache Trivy vulnerability database
        # One entry per UTC day: every run that day restores it
        # instead of downloading the ~300 MB database again. Trivy's own
        # staleness check (embedded in the cached metadata) still decides
        # whether to refresh it — this cache does not skip or widen that
        # check, it only avoids re-fetching a copy that check would keep
        # anyway. restore-keys falls back to the most recent day available if
        # today's entry does not exist yet, so the very first run of a new
        # day still starts from a warm cache rather than nothing.
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-

      - name: Extract image list from compose files
        run: |
          bash scripts/ci/list-images.sh | tee /tmp/images.txt
          echo "$(wc -l < /tmp/images.txt) images to scan"

      - name: Scan for CVEs (CRITICAL + HIGH, non-blocking)
        # Every image gets its own JSON report — the full per-package findings
        # Trivy produces, not the table this job used to print into the log.
        # An image that fails to scan writes no report; its name and Trivy's
        # own reason go to failures.tsv instead, so "not scanned" is never
        # silently read as "scanned clean" — trivy-summarize.py below reports
        # it under its own heading, by name, with that reason.
        run: |
          mkdir -p /tmp/trivy-results
          : > /tmp/trivy-failures.tsv
          while IFS= read -r image; do
            safe=$(echo "$image" | tr -c 'A-Za-z0-9._-' '_')
            outfile="/tmp/trivy-results/${safe}.json"
            errfile=$(mktemp)
            if trivy image \
              --quiet \
              --format json \
              --ignore-unfixed \
              --severity CRITICAL,HIGH \
              --exit-code 0 \
              --output "$outfile" \
              "$image" 2>"$errfile"; then
              :
            else
              reason=$(grep -v '^[[:space:]]*$' "$errfile" | tail -1 | sed -E 's/^[[:space:]]*\*[[:space:]]*//')
              printf '%s\t%s\n' "$image" "${reason:-scan failed, no reason captured}" >> /tmp/trivy-failures.tsv
              rm -f "$outfile"
            fi
            rm -f "$errfile"
          done < /tmp/images.txt

      - name: Summarize results
        if: always()
        run: |
          python3 scripts/ci/trivy-summarize.py \
            --results-dir /tmp/trivy-results \
            --failures-file /tmp/trivy-failures.tsv \
            --images-total "$(wc -l < /tmp/images.txt)" \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Report CRITICAL findings against the recorded exceptions
        # A CRITICAL in an upstream image is information for whoever uses or
        # updates the stack, not a defect in this repository: the blueprint does
        # not build these images. So a finding outside `.trivy-baseline.json`,
        # and an image that stopped scanning, are named here and the step stays
        # green (DEC-079). It fails only on the repository's own errors: an
        # exception without its stacks, reason, risk or findings, a report that
        # could not be read, and an image discovery resolved that left neither
        # a report nor a recorded failure — hence --images-total.
        run: |
          python3 scripts/ci/trivy-gate.py \
            --results-dir /tmp/trivy-results \
            --failures-file /tmp/trivy-failures.tsv \
            --images-total "$(wc -l < /tmp/images.txt)" \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-scan-results
          path: |
            /tmp/trivy-results/
            /tmp/trivy-failures.tsv
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # 3. STACK STATUS
  # ─────────────────────────────────────────────────────────────────────────
  # Per stack: the pinned tag of the primary image and when upstream released
  # it, the newest upstream tag in the same shape and its release date, whether
  # the upstream repository is archived or has not released for a year, and
  # the CRITICAL and HIGH findings of this run's scan in every image of the
  # stack. Information, not a gate: scripts/ci/upstream-status.py exits 0
  # whatever it finds (DEC-079). The token reads the upstream repositories'
  # releases, which the anonymous API limit would not cover.
  #
  # Runs with the image scan, on the schedule and by hand. On main the
  # table overwrites the body of the one open issue labelled `stack-status`,
  # created and pinned on the first run; a manual run from another branch
  # writes the table to its summary only. Nothing is committed by the job: both
  # branches reject a direct push. The maintainer commits upstream-status.json
  # from the artifact with the pull request that moves a pin or cuts a release.
  stack-status:
    name: Stack status
    needs: image-scan
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # overwrite the stack-status issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch this run's scan results
        # Missing when the scan failed before uploading; the table then shows
        # no findings rather than zero.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-image-scan-results
          path: /tmp/scan

      - name: Look up upstream versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/upstream-status.py \
            --results-dir /tmp/scan/trivy-results \
            --json /tmp/upstream-status.json \
            --markdown /tmp/stack-status.md
          cat /tmp/stack-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Overwrite the stack-status issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create stack-status --force --color 0E8A16 \
            --description "Weekly per-stack versions and findings, overwritten by trivy.yml"
          number=$(gh issue list --label stack-status --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh issue create --title "Stack status" --label stack-status --body-file /tmp/stack-status.md)
            number="${url##*/}"
            gh issue pin "$number" || echo "::notice::issue #$number created; pinning was refused — pin it once by hand"
          else
            gh issue edit "$number" --body-file /tmp/stack-status.md
          fi
          echo "stack status written to issue #$number"

      - name: Upload the stack status data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-status
          path: |
            /tmp/upstream-status.json
            /tmp/stack-status.md
          if-no-files-found: warn
