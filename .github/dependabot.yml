version: 2

# Every version-update pull request Dependabot opens targets `dev`. The branch
# model in docs/standards/commit-rules.md routes all change through `dev`; a
# pull request against `main` has to be re-targeted by hand and then falls
# behind `dev` the moment anything else merges there, because the `dev`
# ruleset requires an up-to-date branch.
#
# Security updates are different: GitHub raises them against the default
# branch (`main`) only, whatever `target-branch` says — `target-branch`
# applies to version updates. A re-targeted security pull request is set back
# to `main` by the next `@dependabot rebase`. They stay on, by decision; what
# `main` lacks reaches it with the next release from `dev`.

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /site
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    # One pull request per week for the site instead of one per package: the
    # site build is the only check that exercises them, and five separate
    # branches each fall behind `dev` as soon as the first one merges.
    groups:
      site:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /development/static-site/recipes/astro
      - /development/static-site/recipes/vite-react
      - /development/web-api/fixture
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    # One pull request per week for the three examples, like the site. No CI
    # job builds them: build an example's image before merging its update.
    groups:
      development:
        patterns:
          - "*"
