# UrBackup Server — local
#
#   cp .env.local.example .env.local
#   mkdir -p volumes/local/database volumes/local/backups
#   sudo chown 0:101 volumes/local/database volumes/local/backups
#   sudo chmod 775 volumes/local/database volumes/local/backups
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:55414
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  app:
    image: uroni/urbackup-server:${APP_TAG}
    container_name: urbackup-local-app
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]        # su and the drop to uid 101 (docker-compose.yml)
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT}
          cpus: ${APP_CPU_LIMIT}
          pids: 500
        reservations:
          memory: 512m
    environment:
      TZ: ${TZ}
    volumes:
      - ${BACKUP_STORAGE_PATH}:/backups
      - ./volumes/local/database:/var/urbackup
    ports:
      - "127.0.0.1:55414:55414"
      #- "127.0.0.1:55415:55415"
    networks: [urbackup-local]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/55414 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 5 head -c 12 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  urbackup-local:
    name: urbackup-local
