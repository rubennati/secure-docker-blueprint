# Secure Docker Blueprint — drop-in for Debian's nftables.service
# (installed as /etc/systemd/system/nftables.service.d/10-blueprint-no-flush.conf).
# Debian's unit stops with "nft flush ruleset": a restart, a stop or the package's
# try-restart on every upgrade then removes Docker's and Tailscale's tables too.
# Here a stop removes only the blueprint's own table; start, reload and boot are
# unchanged. Tested on a host (core/traefik/docs/host-firewall.md).
[Service]
ExecStop=
ExecStop=/usr/sbin/nft destroy table inet blueprint_ingress
