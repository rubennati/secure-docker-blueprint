services:

  # --------------------------------------------------------
  # SOCKET PROXY (Security Layer 1)
  # Prevents Traefik from having write access to Docker
  # --------------------------------------------------------
  docker-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE}
    container_name: ${SOCKET_PROXY_CONTAINER_NAME}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /tmp

    # --- Resources ---
    # Measured in single-digit MB; this is a ceiling, not an appetite.
    memswap_limit: 128M          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 50
        reservations:
          memory: 32M

    networks:
      - socket_proxy_net

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro

    environment:
      # HAProxy template vars (used by the docker-socket-proxy image)
      LOG_LEVEL: ${DSP_LOG_LEVEL}
      SOCKET_PATH: ${DSP_SOCKET_PATH}
      BIND_CONFIG: ${DSP_BIND_CONFIG}
      POST: ${DSP_POST}

      # Allow only what Traefik needs for discovery
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      EVENTS: 1
      PING: 1
      VERSION: 1

      SERVICES: 0
      SWARM: 0
      TASKS: 0
      NODES: 0
      IMAGES: 0
      VOLUMES: 0
      SYSTEM: 0

      # Allow start/stop/restart? Keep disabled by default.
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # TRAEFIK (Edge Router)
  # --------------------------------------------------------
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: ${TRAEFIK_CONTAINER_NAME}
    restart: unless-stopped
    # --- Resources ---
    # A ceiling against runaway growth, not an appetite. TRAEFIK_MEMORY in .env
    # carries the measurement and the reason; the default here keeps an existing
    # .env working.
    memswap_limit: ${TRAEFIK_MEMORY:-256m}   # == memory: no swap
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY:-256m}
          pids: 50
        reservations:
          memory: 64M

    depends_on:
      docker-socket-proxy:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    # The published ports below are mapped to Traefik's address on ONE of its
    # networks — the one that provides the container's default gateway. Docker
    # picks it by gw_priority, and without one by Compose's order, which is
    # alphabetical: crowdsec-security before public (measured 2026-10-31).
    # gw_priority names the public network, so the ports arrive where the
    # client address is preserved and the address family is checked, and a
    # connection from the host or from another container reaches Traefik
    # as this network's gateway. Needs Docker Engine 28.0 and Compose 2.33.1;
    # validate.sh checks the running container (ops/scripts/check-published-family.py).
    networks:
      public:
        gw_priority: 100
      socket_proxy_net:
      crowdsec-security:

    # No ports here. render.sh writes them into config/published-ports.yml,
    # one block per address family, from TRAEFIK_BIND_V4 and TRAEFIK_BIND_V6
    # — an empty variable leaves its family out, which a fixed line in this
    # file could not (DEC-075.3). COMPOSE_FILE in .env applies the rendered
    # file; every port names its host address, so nothing listens on [::]
    # where the public network cannot carry IPv6 to the container.

    environment:
      - TZ=${TZ}
      # Cloudflare credentials (only needed if you use DNS-01 resolver)
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}

    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic:/etc/traefik/dynamic:ro
      - ./volumes/letsencrypt:/etc/traefik/acme
      - ./volumes/logs:/var/log/traefik
      # Writable plugin storage — required when experimental.plugins is
      # configured (CrowdSec bouncer, etc.). Without this the read-only
      # root filesystem prevents the plugin manager from creating
      # /plugins-storage/sources, plugins get disabled on startup, and
      # any router referencing a plugin middleware fails with
      # "invalid middleware type or middleware does not exist".
      - ./volumes/plugins-storage:/plugins-storage

    # Docker healthcheck for auto-healing
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s

    # --------------------------------------------------------
    # NOTE:
    # No Traefik labels are defined here on purpose.
    # All routers, services, middlewares, and TLS settings
    # are managed centrally in the dynamic file configuration
    # (see: config/dynamic/routers-system.yml).
    # --------------------------------------------------------

networks:
  # IPv4-only in this file (Docker auto-assigns the subnet — unchanged
  # behavior for existing installs). Tailscale clients always have an
  # IPv6 address; without IPv6 on this network, IPv6 ingress loses the
  # real client IP (see docs/ipv6-dual-stack.md). The network-dual-stack.yml
  # overlay adds IPv6; .env.example applies it, the default for a new
  # installation (DEC-063), and an existing one keeps its COMPOSE_FILE.
  public:
    name: ${PUBLIC_NETWORK}
    driver: bridge

  socket_proxy_net:
    name: ${SOCKET_PROXY_NETWORK}
    internal: true

  # Core-to-core only: Traefik reaches the CrowdSec LAPI (8080) and AppSec
  # (7422) here. No application joins it. Declared here rather than in
  # core/crowdsec because Traefik is always deployed and CrowdSec is optional.
  #
  # Not internal: true — CrowdSec uses this normal bridge for outbound access
  # required by hub updates, CAPI and blocklists. Making it internal would
  # require a separate egress network without improving the intended member
  # isolation.
  #
  # IPv4-only: container-to-container traffic, no client source IP to preserve.
  crowdsec-security:
    name: ${CROWDSEC_SECURITY_NETWORK}
    driver: bridge
