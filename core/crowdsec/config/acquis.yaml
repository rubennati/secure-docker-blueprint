# =============================================
# CrowdSec – Log Acquisition
# =============================================
# Defines which log sources CrowdSec monitors.
# Each source requires the log file to be mounted
# into the container (see docker-compose.yml).
# =============================================

# Traefik access logs (JSON format)
filenames:
  - /var/log/traefik/access.log
labels:
  type: traefik

---
# SSH authentication logs (opt-in)
#
# Enables SSH brute-force detection — the case host-firewall remediation
# exists for. Without it, the host firewall enforces only decisions derived
# from Traefik's logs, the same ones reverse-proxy remediation covers.
#
# Prerequisites before uncommenting:
#   1. Uncomment the volume mount in docker-compose.yml:
#        - /var/log/auth.log:/var/log/auth.log:ro
#   2. Add crowdsecurity/sshd to CROWDSEC_COLLECTIONS in .env
#   3. Restart the CrowdSec container:
#        docker compose up -d --force-recreate crowdsec
#
# See docs/firewall-bouncer.md → "SSH detection"
#
# Uncomment together with the auth.log mount in docker-compose.yml — and only
# after confirming the file exists. See the note there: a journald-only host
# has none, and this container cannot read the journal.
# ---
# filenames:
#   - /var/log/auth.log
# labels:
#   type: syslog
