services:

  # --------------------------------------------------------
  # CROWDSEC ENGINE
  # Intrusion Detection and Prevention System.
  # Analyzes Traefik access logs, detects threats,
  # shares threat intel with CrowdSec community.
  #
  # Phase 1: Detection only (this service)
  # Phase 2: Traefik Bouncer Plugin (see core/traefik/)
  # Phase 3: Firewall Bouncer (host-level nftables)
  # --------------------------------------------------------
  crowdsec:
    # --- Identity ---
    image: crowdsecurity/crowdsec:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # Generous ceiling: a limit the normal workload reaches is a limit that
    # kills imports and background jobs. Retune from docker stats, not down to it.
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      GID: ${CROWDSEC_LOG_GID}
      COLLECTIONS: ${CROWDSEC_COLLECTIONS}

    # --- Storage ---
    volumes:
      # CrowdSec persistent data (database with decisions, bouncers, alerts)
      - ./volumes/data:/var/lib/crowdsec/data
      # CrowdSec persistent config (generated on first start, survives restarts)
      - ./volumes/config:/etc/crowdsec
      # Custom log acquisition and AppSec config
      - ./config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Acquisition sources must live in acquis.yaml or acquis.d/. Mounted
      # anywhere else the file is simply never read: the AppSec rules still
      # load, nothing listens on 7422, and the bouncer gets connection refused.
      - ./config/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      # Traefik access logs (read-only, relative path by default)
      - ${TRAEFIK_LOG_PATH}:/var/log/traefik:ro
      # SSH authentication logs — opt-in, and only possible on a host that
      # writes them to a file. The `sshd` collection ships enabled in
      # CROWDSEC_COLLECTIONS, so its rules load either way; without a source
      # they simply match nothing, which looks identical to working.
      #
      # Debian 12/13 log to journald and have no /var/log/auth.log. This
      # container cannot read the journal either — the image ships no
      # `journalctl`. So on a stock Debian host SSH detection needs rsyslog
      # installed first, and only then does uncommenting this help.
      #
      # Check before uncommenting:  ls -l /var/log/auth.log
      # An uncommented mount against a missing file makes Docker create a
      # directory there, and the acquisition silently reads nothing.
      # See docs/firewall-bouncer.md → "SSH detection"
      # - /var/log/auth.log:/var/log/auth.log:ro

    # --- Networking ---
    networks:
      - proxy-public
    ports:
      # LAPI on localhost only — for firewall bouncer (Phase 3)
      - "127.0.0.1:${CROWDSEC_LAPI_PORT}:8080"

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true
