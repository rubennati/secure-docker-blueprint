# Euro-Office — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:8080/
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  app:
    image: ghcr.io/euro-office/documentserver:${APP_TAG}
    container_name: euro-office-local-app
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      JWT_ENABLED: "false"
      WOPI_ENABLED: "true"
      TZ: ${TZ}
    volumes:
      - ./volumes/local/data:/var/www/onlyoffice/Data
      - ./volumes/local/logs:/var/log/onlyoffice
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
