# =============================================================================
# Orion Belt (EXPERIMENTAL) — production stack (Traefik for the API/console,
# direct port for the SSH gateway)
# =============================================================================
# Lightweight, reverse-agent, JIT-approval PAM. EXPERIMENTAL — read
# README.md before deploying this: single maintainer, 43 GitHub stars,
# repository created 2026-01, first stable release 2026-07-14. A PAM tool
# holds real access to real infrastructure; weigh a young project's risk
# deliberately, not as a formality.
#
# Spec: docs/standards/compose-structure.md · security-baseline.md
# =============================================================================

services:

  # --------------------------------------------------------
  # POSTGRESQL
  # --------------------------------------------------------
  db:
    image: postgres:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 100
        reservations:
          memory: 128m

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PWD
      TZ: ${TZ}
    secrets:
      - DB_PWD

    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

    networks:
      - app-internal

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

  # --------------------------------------------------------
  # ORION BELT SERVER (SSH gateway + API/web console)
  # --------------------------------------------------------
  orion-belt-server:
    # --- Identity ---
    image: ghcr.io/orion-belt-dev/orion-belt-server:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      # Verified against a live container: the bundled audit-logger plugin
      # otherwise fails to configure ("mkdir /var/log/orion-belt:
      # read-only file system") — non-fatal, the server still starts, but
      # the audit log plugin silently does nothing without this. Ephemeral
      # by design: if you need audit logs to survive a restart, replace
      # this with a bind mount instead.
      - /var/log/orion-belt

    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 100
        reservations:
          memory: 128m

    # --- Configuration ---
    # No _FILE support — see .env.example's Secrets section. The value
    # here must exactly match the plaintext secret files' contents, not
    # the secret filenames.
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      ORION_JWT_SECRET: ${ORION_JWT_SECRET}
      ORION_MFA_REQUIRED: ${ORION_MFA_REQUIRED}
      ORION_WEBAUTHN_ENABLED: ${ORION_WEBAUTHN_ENABLED}
      ORION_PUBLIC_HOST: ${ORION_PUBLIC_HOST}
      ORION_PUBLIC_URL: ${ORION_PUBLIC_URL}
      ORION_RECORDING_ENCRYPTION_KEY: ${ORION_RECORDING_ENCRYPTION_KEY}
      ORION_RECORDING_RETENTION_DAYS: ${ORION_RECORDING_RETENTION_DAYS}
      TZ: ${TZ}

    # --- Storage ---
    volumes:
      - ./volumes/recordings:/var/lib/orion-belt/recordings
      - ./volumes/hostkey:/etc/orion-belt

    # --- Networking ---
    networks:
      - proxy-public
      - app-internal

    ports:
      # Where agents (deployed separately, on the hosts you want to
      # protect) dial in, and where your own SSH client connects out. A
      # raw TCP listener: Traefik's HTTP router cannot carry SSH.
      - "${ORION_SSH_PORT}:2222"

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8080"

    # --- Health & Observability ---
    # Verified against a live container: GET /health returns
    # {"service":"orion-belt-api","status":"healthy",...} — a real
    # endpoint, not assumed from documentation.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true

  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
