# =============================================================================
# ShellHub — production stack (Traefik for the gateway, direct port for the
# SSH rendezvous)
# =============================================================================
# Agent-based, reverse-connection SSH access platform. Devices run a ShellHub
# agent (not part of this deployment — installed on the machines you want to
# reach) that dials out to the server below; the gateway fronts the web UI
# and API. See README.md for the full security model.
#
# Spec: docs/standards/compose-structure.md · security-baseline.md
# =============================================================================

services:

  # --------------------------------------------------------
  # POSTGRESQL
  # --------------------------------------------------------
  db:
    image: postgres:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 100
        reservations:
          memory: 128m

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PWD
      TZ: ${TZ}
    secrets:
      - DB_PWD

    # Postgres 18 changed the expected mount point — verified against a live
    # container: mounting at .../data (this repository's usual path for
    # every other Postgres 16 stack) produces a startup error demanding a
    # single mount at /var/lib/postgresql instead, since 18+ stores data in
    # a version-named subdirectory under it (pg_ctlcluster-compatible
    # layout). Do not copy the .../data path from another stack here.
    volumes:
      - ./volumes/postgres:/var/lib/postgresql

    networks:
      - app-internal

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

  # --------------------------------------------------------
  # VALKEY (Redis-compatible — job queue + cache, no persistence)
  # --------------------------------------------------------
  valkey:
    image: valkey/valkey:${VALKEY_TAG}
    container_name: ${CONTAINER_NAME_VALKEY}
    restart: unless-stopped
    # Matches upstream's own compose: no AOF, no RDB snapshots. Purely a
    # queue/cache — nothing here needs to survive a restart.
    command: ["valkey-server", "--appendonly", "no", "--save", ""]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Verified against a live container: the image's entrypoint starts as
    # root and calls `setpriv` to drop to its own user before exec'ing
    # valkey-server. Without SETUID/SETGID it fails with
    # "setpriv: setresuid failed: Operation not permitted" — the same
    # failure mode apps/_reference documents for postgres/redis.
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp

    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 50
        reservations:
          memory: 32m

    networks:
      app-internal:
        # The server image has "redis" hard-coded as the hostname it
        # connects to — verified against a live container: it does not
        # read a REDIS_HOST-style variable. The alias lets the service
        # keep its real name (this is Valkey, not Redis) everywhere else.
        aliases:
          - redis

    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # SERVER (API + SSH rendezvous — agents dial in here)
  # --------------------------------------------------------
  server:
    # --- Identity ---
    image: shellhubio/server:${SHELLHUB_VERSION}
    container_name: ${CONTAINER_NAME_SERVER}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

    # --- Resources ---
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 100
        reservations:
          memory: 128m

    # --- Configuration ---
    # PRIVATE_KEY/PUBLIC_KEY/SSH_HOST_KEY_FILE are upstream's own real Docker
    # Secrets — verified in the official compose. POSTGRES_PASSWORD has no
    # _FILE alternative on this side (see .env.example's Secrets section).
    environment:
      DATABASE: postgres
      PRIVATE_KEY: /run/secrets/api_private_key
      PUBLIC_KEY: /run/secrets/api_public_key
      SSH_HOST_KEY_FILE: /run/secrets/ssh_private_key
      SHELLHUB_EDITION: ${SHELLHUB_EDITION}
      SHELLHUB_AUTO_SSL: ${SHELLHUB_AUTO_SSL}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${DB_USER}
      POSTGRES_PASSWORD: ${SHELLHUB_POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${DB_NAME}
      SHELLHUB_LOG_LEVEL: ${SHELLHUB_LOG_LEVEL}
      SHELLHUB_LOG_FORMAT: ${SHELLHUB_LOG_FORMAT}
      SHELLHUB_SSH_PORT: 2222
      SHELLHUB_DOMAIN: ${APP_TRAEFIK_HOST}
      TZ: ${TZ}
    secrets:
      - api_private_key
      - api_public_key
      - ssh_private_key

    # --- Networking ---
    # No proxy-public: the gateway is the only HTTP-facing component. The
    # SSH port below is this service's own direct host publish.
    networks:
      - app-internal

    ports:
      # Where agents dial in, and where `ssh <device>@<host>` connects out.
      # A raw TCP listener: Traefik's HTTP router cannot carry SSH.
      - "${SHELLHUB_SSH_PORT}:2222"

    # --- Health & Observability ---
    # Verified against upstream's own compose file.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/healthcheck"]
      interval: 30s
      start_period: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # UI (web frontend, internal only — the gateway fronts it)
  # --------------------------------------------------------
  ui:
    image: shellhubio/ui:${SHELLHUB_VERSION}
    container_name: ${CONTAINER_NAME_UI}
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No read_only — verified against a live container: its startup script
    # (gen-config.sh) writes /var/www/config.json to bake SHELLHUB_EDITION
    # and related values into the served SPA at boot. That directory also
    # holds the built static site the image ships, so a tmpfs overlay would
    # hide the app rather than just permit the write.
    tmpfs:
      - /tmp

    memswap_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 50
        reservations:
          memory: 32m

    environment:
      SHELLHUB_EDITION: ${SHELLHUB_EDITION}
      TZ: ${TZ}

    networks:
      - app-internal

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080/health"]
      interval: 30s
      start_period: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # GATEWAY (reverse proxy to server + ui — this is what Traefik fronts)
  # --------------------------------------------------------
  shellhub-gateway:
    image: shellhubio/gateway:${SHELLHUB_VERSION}
    container_name: ${CONTAINER_NAME_GATEWAY}
    restart: unless-stopped
    depends_on:
      - server
      - ui

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    memswap_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 50
        reservations:
          memory: 32m

    environment:
      SHELLHUB_DOMAIN: ${APP_TRAEFIK_HOST}
      SHELLHUB_PROXY: ${SHELLHUB_PROXY}
      SHELLHUB_PROXY_TRUSTED_IPS: ${SHELLHUB_PROXY_TRUSTED_IPS}
      SHELLHUB_EDITION: ${SHELLHUB_EDITION}
      SHELLHUB_AUTO_SSL: ${SHELLHUB_AUTO_SSL}
      SHELLHUB_DATABASE: postgres
      SHELLHUB_LOG_LEVEL: ${SHELLHUB_LOG_LEVEL}
      SHELLHUB_LOG_FORMAT: ${SHELLHUB_LOG_FORMAT}
      TZ: ${TZ}

    networks:
      - proxy-public
      - app-internal

    # Verified against upstream's own compose: the gateway (Caddy) routes on
    # the Host header, matching SHELLHUB_DOMAIN — a plain request to
    # 127.0.0.1 with no matching Host does not hit a configured route. This
    # alias is upstream's own healthcheck workaround, not invented here.
    extra_hosts:
      - "healthcheck.internal:127.0.0.1"

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://healthcheck.internal/healthz"]
      interval: 30s
      start_period: 15s
      timeout: 5s
      retries: 5

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true

  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  api_private_key:
    file: ./.secrets/api_private_key
  api_public_key:
    file: ./.secrets/api_public_key
  ssh_private_key:
    file: ./.secrets/ssh_private_key
