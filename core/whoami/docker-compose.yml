services:

  # --------------------------------------------------------
  # WHOAMI
  # Tiny debug service that echoes HTTP request details.
  # Use to verify Traefik routing, TLS, and middlewares.
  # --------------------------------------------------------
  whoami:
    # --- Identity ---
    image: traefik/whoami:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

    # --- Resources ---
    # Small single-purpose service.
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 100
        reservations:
          memory: 32M

    # --- Networking ---
    networks:
      - proxy-public

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"

    # healthcheck: none — and none is possible. The image is built FROM scratch:
    # it holds the binary and nothing else, so there is no shell either —
    #   docker exec whoami sh  →  "sh": executable file not found in $PATH
    # and every form of healthcheck.test needs one. Docker treats a container
    # without a healthcheck as healthy, so this costs nothing.

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true
