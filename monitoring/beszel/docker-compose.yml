services:

  # --------------------------------------------------------
  # BESZEL HUB (web UI + metric aggregator)
  # --------------------------------------------------------
  # The hub generates an Ed25519 keypair on first start and uses it
  # to SSH INTO each registered agent. Agents do not connect back to
  # the hub — the hub initiates all connections.
  #
  # This compose runs the hub + one LOCAL agent on the same host.
  # For additional hosts deploy monitoring/beszel-agent/ there.
  beszel-hub:
    # --- Identity ---
    image: henrygd/beszel:${APP_TAG}
    container_name: ${CONTAINER_NAME_HUB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # Generous ceiling: a limit the normal workload reaches is a limit that
    # kills imports and background jobs. Retune from docker stats, not down to it.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M

    # --- Configuration ---
    environment:
      TZ: ${TZ}

    # --- Storage ---
    volumes:
      - ./volumes/hub-data:/beszel_data

    # --- Networking ---
    networks:
      - proxy-public

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8090"

    # --- Health & Observability ---
    # healthcheck: none — the hub image is a minimal Go binary with no shell,
    # wget or curl to probe with. Liveness comes from the restart policy, and
    # the hub is the one component nothing else watches (see monitoring/README).
    healthcheck:
      disable: true

  # --------------------------------------------------------
  # DOCKER SOCKET PROXY (Beszel agent → Docker API)
  # Read-only container metrics only — the agent never touches the
  # raw socket. See UPSTREAM.md for why CONTAINERS is the only
  # permission granted.
  # --------------------------------------------------------
  socket-proxy:
    # --- Identity ---
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_TAG}
    container_name: ${CONTAINER_NAME_SOCKET_PROXY}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp

    # --- Resources ---
    # Measured in single-digit MB; this is a ceiling, not an appetite.
    memswap_limit: 128M          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 50
        reservations:
          memory: 32M

    # --- Configuration ---
    environment:
      # The only permission the agent's Docker client calls: /containers/json,
      # /containers/{id}/json, /containers/{id}/stats, /containers/{id}/logs
      # (verified against agent/docker.go upstream). PING is for this proxy's
      # own healthcheck below, not used by the agent itself.
      CONTAINERS: 1
      PING: 1

      NETWORKS: 0
      INFO: 0
      EVENTS: 0
      VERSION: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      NODES: 0
      IMAGES: 0
      VOLUMES: 0
      SYSTEM: 0
      POST: 0

      # Container lifecycle control. Beszel is monitoring-only — never enabled.
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0

    # --- Storage ---
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # --- Networking ---
    networks:
      - app-internal
    # The agent runs with network_mode: host (below), which cannot join a
    # Docker network — it reaches this proxy over the host's loopback
    # interface instead. Bound to 127.0.0.1 only: never the LAN, never a
    # public interface.
    ports:
      - "127.0.0.1:2375:2375"

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # BESZEL AGENT — local (this host)
  # --------------------------------------------------------
  # Collects CPU / RAM / disk / network / per-container Docker stats
  # for the host running the hub. The hub SSHes to this agent on
  # port 45876 using its generated private key.
  agent:
    # --- Identity ---
    image: henrygd/beszel-agent:${APP_TAG}
    container_name: ${CONTAINER_NAME_AGENT}
    restart: unless-stopped

    depends_on:
      socket-proxy:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # Small single-purpose service.
    memswap_limit: 256M          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 100
        reservations:
          memory: 32M

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      PORT: "45876"
      # Hub's SSH public key — paste the full key from the hub UI
      # ("+ Add System", top right), including the "ssh-ed25519" type prefix.
      # Leave empty on first start; add key and restart agent after hub boots.
      KEY: ${AGENT_KEY}
      # Optional: comma-separated mount points beyond root FS.
      EXTRA_FILESYSTEMS: ${EXTRA_FILESYSTEMS}
      # Container metrics via the socket proxy above, not the raw socket.
      # 127.0.0.1 because network_mode: host below has no Docker network to
      # resolve "socket-proxy" on.
      DOCKER_HOST: tcp://127.0.0.1:2375

    # --- Networking ---
    # network_mode: host — required for accurate host network interface
    # stats (eth0, tailscale0, etc.). Without it the agent sees only
    # the container's veth, not the real host interfaces. CPU / RAM /
    # disk still work with bridge networking if you prefer isolation.
    #
    # Security note: port 45876 binds directly on the host network stack,
    # not behind Traefik. Protection is SSH key auth + Tailscale ACLs /
    # host firewall. Same pattern as core/portainer-agent/ and core/hawser/.
    network_mode: host

    # --- Health & Observability ---
    # healthcheck: none — the agent exposes no endpoint to probe. Its liveness
    # signal is the hub: an agent that stops reporting shows as down there.
    healthcheck:
      disable: true

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true

  # Private to the socket proxy. internal: true — no route to the internet,
  # no route from other stacks. The agent reaches the proxy over the
  # loopback-only published port instead (network_mode: host, above).
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true
