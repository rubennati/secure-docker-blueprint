services:

  # --------------------------------------------------------
  # BESZEL HUB (web UI + metric aggregator)
  # --------------------------------------------------------
  # The agent connects OUT to the hub over the private application
  # network and registers itself with a token. No agent port is opened
  # and no host port is published for hub-to-agent traffic.
  #
  # This compose runs the hub + one LOCAL agent on the same host.
  # For additional hosts deploy monitoring/beszel-agent/ there.
  beszel-hub:
    # --- Identity ---
    image: henrygd/beszel:${APP_TAG}
    container_name: ${CONTAINER_NAME_HUB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # Generous ceiling: a limit the normal workload reaches is a limit that
    # kills imports and background jobs. Retune from docker stats, not down to it.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M

    # --- Configuration ---
    environment:
      TZ: ${TZ}

    # --- Storage ---
    volumes:
      - ./volumes/hub-data:/beszel_data

    # --- Networking ---
    # proxy-public — reached through Traefik by the operator's browser.
    # app-internal — the private path the local agent uses to reach the hub.
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8090"

    # --- Health & Observability ---
    # healthcheck: none — the hub image is a minimal Go binary with no shell,
    # wget or curl to probe with. Liveness comes from the restart policy, and
    # the hub is the one component nothing else watches (see monitoring/README).
    healthcheck:
      disable: true

  # --------------------------------------------------------
  # DOCKER SOCKET PROXY (Beszel agent → Docker API)
  # Read-only container metrics only — the agent never touches the
  # raw socket. See UPSTREAM.md for why CONTAINERS is the only
  # permission granted.
  # --------------------------------------------------------
  socket-proxy:
    # --- Identity ---
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_TAG}
    container_name: ${CONTAINER_NAME_SOCKET_PROXY}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp

    # --- Resources ---
    # Measured in single-digit MB; this is a ceiling, not an appetite.
    memswap_limit: 128M          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 50
        reservations:
          memory: 32M

    # --- Configuration ---
    environment:
      # The only permission the agent's Docker client calls: /containers/json,
      # /containers/{id}/json, /containers/{id}/stats, /containers/{id}/logs
      # (verified against agent/docker.go upstream). PING is for this proxy's
      # own healthcheck below, not used by the agent itself.
      CONTAINERS: 1
      PING: 1

      NETWORKS: 0
      INFO: 0
      EVENTS: 0
      VERSION: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      NODES: 0
      IMAGES: 0
      VOLUMES: 0
      SYSTEM: 0
      POST: 0

      # Container lifecycle control. Beszel is monitoring-only — never enabled.
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0

    # --- Storage ---
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # --- Networking ---
    # No published port. The agent shares this network and reaches the proxy
    # by service name. Publishing would be ineffective in any case: Docker
    # silently ignores `ports:` on a container attached only to an
    # `internal: true` network — the mapping is accepted and never created.
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # BESZEL AGENT — local (this host)
  # --------------------------------------------------------
  # Collects host CPU / memory / disk and per-container Docker stats for
  # the host running the hub. It dials the hub over app-internal — no
  # listener, no published port, no host networking.
  agent:
    # --- Identity ---
    image: henrygd/beszel-agent:${APP_TAG}
    container_name: ${CONTAINER_NAME_AGENT}
    restart: unless-stopped

    depends_on:
      socket-proxy:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # Small single-purpose service.
    memswap_limit: 256M          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 100
        reservations:
          memory: 32M

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      # The agent opens the connection. It reaches the hub by service name on
      # app-internal, so nothing is published and no agent port is opened.
      HUB_URL: http://beszel-hub:8090
      # Registration token from the hub UI (Settings -> Tokens & Fingerprints).
      # Empty on first start; fill it once the hub is up, then start the agent.
      TOKEN: ${AGENT_TOKEN:-}
      # Hub's SSH public key — paste the full key from the hub UI
      # ("+ Add System", top right), including the "ssh-ed25519" type prefix.
      KEY: ${AGENT_KEY:-}
      # Stable name for this system. Without it the agent registers under its
      # container ID, which changes every time the container is recreated.
      SYSTEM_NAME: ${AGENT_SYSTEM_NAME:-}
      # Container metrics through the socket proxy, resolved by service name
      # on app-internal — never the raw socket, never a fixed address.
      DOCKER_HOST: tcp://socket-proxy:2375
      # A container cannot see the host's network namespace. Left unset, the
      # agent reports THIS CONTAINER's interface counters as the system's
      # bandwidth. `-*` selects no interface, so the field is omitted rather
      # than carrying a misleading value. See README, "What this provides".
      NICS: ${AGENT_NICS:--*}
      # Optional: comma-separated mount points beyond root FS.
      EXTRA_FILESYSTEMS: ${EXTRA_FILESYSTEMS}

    # --- Networking ---
    # No network_mode: host, no published port, no listener. The agent dials
    # out to the hub and to the socket proxy on this network; nothing dials in,
    # so there is no host port for an operator to firewall.
    networks:
      - app-internal

    # --- Health & Observability ---
    # healthcheck: none — the agent exposes no endpoint to probe. Its liveness
    # signal is the hub: an agent that stops reporting shows as down there.
    healthcheck:
      disable: true

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true

  # Private to the hub, the agent and the socket proxy. internal: true — no
  # route to the internet, no route from other stacks. Everything hub <-> agent
  # and agent -> Docker API travels here, by service name.
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true
