services:

  # --------------------------------------------------------
  # BESZEL AGENT (standalone — remote host)
  # --------------------------------------------------------
  # Runs on each additional host that a central Beszel hub should
  # monitor. The agent opens an outbound WSS/HTTPS connection to the
  # hub's own address and registers itself with a token. Nothing
  # connects IN: no listener, no published port, no inbound firewall
  # rule on the monitored host.
  #
  # Counterpart to monitoring/beszel/ (hub + local agent).
  # Deploy this compose on every host beyond the hub host.

  # --------------------------------------------------------
  # DOCKER SOCKET PROXY (Beszel agent → Docker API)
  # Read-only container metrics only — the agent never touches the
  # raw socket. See UPSTREAM.md for why CONTAINERS is the only
  # permission granted.
  # --------------------------------------------------------
  socket-proxy:
    # --- Identity ---
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_TAG}
    container_name: ${CONTAINER_NAME_SOCKET_PROXY}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp

    # --- Resources ---
    # Measured in single-digit MB; this is a ceiling, not an appetite.
    memswap_limit: 128M          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 50
        reservations:
          memory: 32M

    # --- Configuration ---
    environment:
      # The only permission the agent's Docker client calls: /containers/json,
      # /containers/{id}/json, /containers/{id}/stats, /containers/{id}/logs
      # (verified against agent/docker.go upstream). PING is for this proxy's
      # own healthcheck below, not used by the agent itself.
      CONTAINERS: 1
      PING: 1

      NETWORKS: 0
      INFO: 0
      EVENTS: 0
      VERSION: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      NODES: 0
      IMAGES: 0
      VOLUMES: 0
      SYSTEM: 0
      POST: 0

      # Container lifecycle control. Beszel is monitoring-only — never enabled.
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0

    # --- Storage ---
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # --- Networking ---
    # No published port, and app-internal only — the proxy never needs a route
    # out. The agent shares this network and reaches it by service name.
    # Publishing would be ineffective in any case: Docker silently ignores
    # `ports:` on a container attached only to an `internal: true` network.
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # BESZEL AGENT
  # --------------------------------------------------------
  agent:
    # --- Identity ---
    image: henrygd/beszel-agent:${APP_TAG}
    container_name: ${CONTAINER_NAME_AGENT}
    restart: unless-stopped

    depends_on:
      socket-proxy:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Resources ---
    # Small single-purpose service.
    memswap_limit: 256M          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 100
        reservations:
          memory: 32M

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      # The hub's own address, as the operator publishes it. The agent dials
      # this over app-egress; the hub never dials back.
      HUB_URL: ${HUB_URL:?Set HUB_URL in .env — the agent connects out to the hub}
      # Registration token from the hub UI (Settings -> Tokens & Fingerprints).
      TOKEN: ${AGENT_TOKEN:-}
      # Hub's SSH public key — paste the full key from the hub UI
      # ("+ Add System", top right), including the "ssh-ed25519" type prefix.
      KEY: ${AGENT_KEY:-}
      # Stable name for this system. Without it the agent registers under its
      # container ID, which changes every time the container is recreated.
      SYSTEM_NAME: ${AGENT_SYSTEM_NAME:-}
      # Container metrics through the socket proxy, resolved by service name
      # on app-internal — never the raw socket, never a fixed address.
      DOCKER_HOST: tcp://socket-proxy:2375
      # A container cannot see the host's network namespace. Left unset, the
      # agent reports THIS CONTAINER's interface counters as the system's
      # bandwidth. `-*` selects no interface, so the field is omitted rather
      # than carrying a misleading value. See README, "What this provides".
      NICS: ${AGENT_NICS:--*}
      # Optional: comma-separated mount points beyond root FS.
      EXTRA_FILESYSTEMS: ${EXTRA_FILESYSTEMS}

    # --- Health & Observability ---
    # healthcheck: none — the image has no shell, so there is nothing for
    # healthcheck.test to run. Confirmed with
    # `docker run --rm --entrypoint sh <image>`.

    # --- Networking ---
    # app-internal — reaches the socket proxy, which has no route out.
    # app-egress  — the one outbound path, used to dial the hub.
    # No network_mode: host, no published port, no listener: nothing on this
    # host has to be opened or firewalled for the agent.
    networks:
      - app-internal
      - app-egress

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  # Private to the agent and the socket proxy. internal: true — no route to
  # the internet, no route from other stacks. The agent reaches the proxy
  # here, by service name.
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

  # Outbound for the agent only — it dials the hub. The socket proxy stays on
  # app-internal alone and has no route out.
  app-egress:
    name: ${COMPOSE_PROJECT_NAME}-egress
