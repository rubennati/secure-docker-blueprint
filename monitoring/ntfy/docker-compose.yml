services:

  # --------------------------------------------------------
  # NTFY (push notification server)
  # Receives alerts from the monitoring services and delivers them to phones
  # and desktops. Deliberately deployable on its own host — see README.
  # --------------------------------------------------------
  ntfy-app:
    # --- Identity ---
    image: binwiederhier/ntfy:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    # The image entrypoint is the ntfy binary itself; `serve` starts the server.
    command: ["serve"]

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Upstream runs as root. With every capability dropped, root cannot write
    # into directories it does not own — the server died with "unable to open
    # database file" on a cache directory the operator owned. So it runs as the
    # operator's user, the owner of ./config and ./volumes, which exist before
    # the first start (Docker would create them as root).
    user: "${APP_UID}:${APP_GID}"

    # --- Resources ---
    # Starting values, not measured ones. Retune from `docker stats` to ~2x peak.
    deploy:
      resources:
        limits:
          memory: 256m
          # cpus: derived starting value, not measured — v0.9.0
          cpus: "0.50"
          pids: 100
        reservations:
          memory: 64m

    # --- Configuration ---
    # Every server setting lives in config/server.yml — one place, rather than
    # split between a file and NTFY_* environment variables.
    environment:
      TZ: ${TZ}

    # --- Storage ---
    # Config read-only: the container must not rewrite its own configuration.
    # cache/ holds the message cache and attachments, lib/ the user database.
    volumes:
      - ./config:/etc/ntfy:ro
      - ./volumes/cache:/var/cache/ntfy
      - ./volumes/lib:/var/lib/ntfy

    # --- Networking ---
    networks:
      - proxy-public

    # --- Traefik ---
    labels:
      # Router
      # Two routers on one service. The public one is the receiver's face for the
      # devices that carry it: GET only, on the topics named in NTFY_PUBLIC_TOPICS
      # (subscribe, poll, WebSocket, the app's auth check) and the account
      # lookup the apps make. Everything else — the web app, login, account
      # management, publishing — is the second router, for the operator's
      # network. Traefik picks the longer rule first, so a request from the
      # internet that matches neither the paths nor GET lands on the second
      # router and is refused by its access policy. auth-default-access:
      # deny-all in config/server.yml is what makes the public router safe:
      # nothing on it answers without credentials.
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`) && Method(`GET`) && (PathRegexp(`^/(${NTFY_PUBLIC_TOPICS})(/|$)`) || Path(`/v1/account`))"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      # Router: the operator's side
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ui.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ui.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ui.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ui.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ui.middlewares=${APP_TRAEFIK_UI_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"

    # --- Health & Observability ---
    # ntfy serves /v1/health and the image ships wget. Checking the payload
    # rather than the status code — a reachable server can still report unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true
