; Loaded after the image's own PHP settings.

; /tmp holds the application archive of the image and stays read-only; PHP's
; temporary files and OPcache's lock file go to the /var/tmp tmpfs instead.
sys_temp_dir = /var/tmp
upload_tmp_dir = /var/tmp
opcache.lockfile_path = /var/tmp

; Upload progress is an attack path of CVE-2026-109619. Akaunting reports it as
; an error once a day while it is on, and only php.ini can switch it off.
session.upload_progress.enabled = 0
