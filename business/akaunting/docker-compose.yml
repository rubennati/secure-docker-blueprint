# =============================================================================
# Akaunting — production stack (Traefik + Docker Secrets)
# =============================================================================
# Accounting for small businesses: invoices, bills, customers, vendors, bank
# accounts and reports. Laravel on Apache, with MariaDB.
#
# Image: akaunting/akaunting (https://hub.docker.com/r/akaunting/akaunting)
# Source: https://github.com/akaunting/akaunting
#
# Upstream's compose mounts the whole webroot as a volume. This one keeps the
# application code in the image — so the pinned tag is what actually runs — and
# mounts only the two things that change: storage/ and the .env file the
# installer writes. See UPSTREAM.md for why.
#
# Spec: docs/standards/compose-structure.md · security-baseline.md
# =============================================================================

services:

  # --------------------------------------------------------
  # DATABASE (MariaDB)
  # --------------------------------------------------------
  db:
    # --- Identity ---
    image: mariadb:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]

    # --- Resources ---
    # Ceiling above the buffer pool, connections and temporary tables.
    memswap_limit: 1G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 200
        reservations:
          memory: 256M

    # --- Configuration ---
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PWD
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PWD
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    secrets:
      - DB_PWD
      - DB_ROOT_PWD

    # --- Storage ---
    volumes:
      - ./volumes/mysql:/var/lib/mysql

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------
  # AKAUNTING
  # On proxy-public, so it carries the stack identity + role suffix
  # --------------------------------------------------------
  akaunting-app:
    # --- Identity ---
    image: akaunting/akaunting:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    # Apache starts as root and hands its workers to www-data (uid 33). Both
    # capabilities are needed for that hand-off: with SETUID alone the workers
    # stay root while the site still answers — measured, see UPSTREAM.md.
    # NET_BIND_SERVICE is not needed: Docker lets a container bind port 80.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true

    # --- Resources ---
    # Apache with mod_php and a handful of workers; derived starting values.
    memswap_limit: 1G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 256M

    # --- Configuration ---
    # entrypoint.sh replaces the image's own, which enables an Apache module and
    # chowns the whole webroot on every start — both writes into the image.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["docker-php-entrypoint", "apache2-foreground"]
    environment:
      APP_URL: https://${APP_TRAEFIK_HOST}
      # Laravel reads real environment variables before .env, so the database
      # connection is defined here and the password comes from the secret.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PREFIX: ${DB_PREFIX}
      TZ: ${TZ}
    secrets:
      - DB_PWD
      - ADMIN_PWD
    depends_on:
      db:
        condition: service_healthy

    # --- Storage ---
    # storage/ holds uploads, logs, sessions and caches; .env holds the
    # application key and the installed flag. Both belong to uid 33 on the host.
    # Everything else is the image.
    volumes:
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./config/rewrite.load:/etc/apache2/mods-enabled/rewrite.load:ro
      - ./volumes/storage:/var/www/html/storage
      - ./volumes/app.env:/var/www/html/.env
      # Compiled service and package caches Laravel rebuilds as needed. The image
      # ships this directory owned by root, and a plain tmpfs mounts as 755 root,
      # so www-data could not write it. Long syntax to set the mode: Compose
      # takes the bit pattern as a decimal number, and 1023 is octal 1777.
      - type: tmpfs
        target: /var/www/html/bootstrap/cache
        tmpfs:
          mode: 1023
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
      - /var/log/apache2

    # --- Networking ---
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"

    # --- Health & Observability ---
    # The login page answers 200 once installed; before ops/install.sh it
    # redirects to the installer, which curl -f also accepts.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/auth/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  DB_ROOT_PWD:
    file: ./.secrets/db_root_pwd.txt
  ADMIN_PWD:
    file: ./.secrets/admin_pwd.txt
