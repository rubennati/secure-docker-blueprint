# Plane — local
#
#   cp .env.local.example .env.local
#   ops/init.sh
#   sudo chown -R 1000:1000 volumes/redis volumes/uploads volumes/logs
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   open http://localhost:8080/god-mode   # claim it, then close sign-up
#   docker compose -f docker-compose.local.yml --env-file .env.local down
#
# Thirteen containers and about 1.4 GiB at rest. The first start runs the
# migrator and takes a few minutes.

# Plane — Community Edition
#
# Thirteen services from six application images. The shape is upstream's; what
# differs is in UPSTREAM.md, and the short version is: nothing here publishes a
# port except through Traefik, every credential is a Docker Secret rather than
# a default like `plane`/`plane`, and the MinIO image upstream names no longer
# exists on Docker Hub.

# --------------------------------------------------------
# SHARED ENVIRONMENT
# Upstream groups these with YAML anchors and so does this file — six backend
# and frontend services read overlapping sets, and writing them out per service
# would hide the differences that matter.
#
# Nothing secret is here. The credentials come from config/entrypoint.sh, which
# reads them from Docker Secrets.
# --------------------------------------------------------
x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: ${DB_NAME}
  POSTGRES_USER: ${DB_USER}
  POSTGRES_DB: ${DB_NAME}
  POSTGRES_PORT: "5432"
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://plane-redis:6379/

x-s3-env: &s3-env
  AWS_REGION: ""
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${S3_BUCKET}
  MINIO_ENDPOINT_SSL: "0"
  USE_MINIO: "1"

x-app-env: &app-env
  WEB_URL: http://localhost:8080
  DEBUG: "0"
  CORS_ALLOWED_ORIGINS: http://localhost:8080
  GUNICORN_WORKERS: ${APP_GUNICORN_WORKERS}
  API_KEY_RATE_LIMIT: ${APP_API_KEY_RATE_LIMIT}
  # Empty means no restriction. A webhook is an outbound request the
  # application makes on a user's behalf, so it is worth narrowing.
  WEBHOOK_ALLOWED_IPS: ${APP_WEBHOOK_ALLOWED_IPS}
  WEBHOOK_ALLOWED_HOSTS: ${APP_WEBHOOK_ALLOWED_HOSTS}

x-proxy-env: &proxy-env
  APP_DOMAIN: localhost
  FILE_SIZE_LIMIT: ${APP_FILE_SIZE_LIMIT}
  BUCKET_NAME: ${S3_BUCKET}
  # Traefik terminates TLS, so this proxy serves plain HTTP on 80 and asks for
  # no certificate of its own.
  SITE_ADDRESS: ":80"
  LISTEN_HTTP_PORT: "80"
  # CERT_EMAIL, CERT_ACME_CA and CERT_ACME_DNS are deliberately absent. The
  # Caddyfile writes `acme_ca {$CERT_ACME_CA:https://acme-v02...}` — setting
  # the variable to an empty string overrides that default and leaves the
  # directive without an argument, which Caddy refuses to parse. Unset is what
  # keeps the default, and none of it is used: Traefik terminates TLS and this
  # proxy serves :80.

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  # --------------------------------------------------------
  # POSTGRESQL
  # Every project, issue, cycle and comment. Pinned to the 15 line upstream
  # tests against, at its newest patch rather than the 2024 build upstream
  # names.
  # --------------------------------------------------------
  plane-db:
    image: postgres:${DB_TAG}
    container_name: plane-local-db
    restart: unless-stopped
    <<: *hardening
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    memswap_limit: 1g          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 256m
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ}
    secrets:
      - POSTGRES_PASSWORD
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # VALKEY
  # Cache and the channel layer behind the live updates.
  # --------------------------------------------------------
  plane-redis:
    image: valkey/valkey:${REDIS_TAG}
    container_name: plane-local-redis
    restart: unless-stopped
    <<: *hardening
    read_only: true
    user: "${REDIS_UID}:${REDIS_GID}"
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
          pids: 100
        reservations:
          memory: 64m
    environment:
      TZ: ${TZ}
    volumes:
      - ./volumes/redis:/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------
  # RABBITMQ
  # The task queue the workers read.
  # --------------------------------------------------------
  plane-mq:
    image: rabbitmq:${MQ_TAG}
    container_name: plane-local-mq
    restart: unless-stopped
    <<: *hardening
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
          pids: 200
        reservations:
          memory: 128m
    # 3.13 rejects RABBITMQ_DEFAULT_PASS_FILE as deprecated and exits, so the
    # wrapper exports the password instead. See config/rabbitmq-entrypoint.sh.
    entrypoint: ["/bin/sh", "/config/rabbitmq-entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER}
      RABBITMQ_DEFAULT_VHOST: ${MQ_VHOST}
      TZ: ${TZ}
    secrets:
      - RABBITMQ_PASSWORD
    volumes:
      - ./config/rabbitmq-entrypoint.sh:/config/rabbitmq-entrypoint.sh:ro
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------
  # MINIO
  # Uploads. Reached only through the bundled proxy, which is itself only
  # reached through Traefik — so this stays off proxy-public entirely.
  #
  # `quay.io/minio/minio`, not the `minio/minio` upstream names: that Docker
  # Hub repository no longer exists.
  # --------------------------------------------------------
  plane-minio:
    image: quay.io/minio/minio:${MINIO_TAG}
    container_name: plane-local-minio
    restart: unless-stopped
    <<: *hardening
    user: "${MINIO_UID}:${MINIO_GID}"
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 128m
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/AWS_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/AWS_SECRET_ACCESS_KEY
      TZ: ${TZ}
    secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    volumes:
      - ./volumes/uploads:/export
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # MIGRATOR
  # Runs the schema migrations and exits. Everything else waits for it.
  # --------------------------------------------------------
  plane-migrator:
    image: makeplane/plane-backend:${APP_TAG}
    container_name: plane-local-migrator
    restart: on-failure
    <<: *hardening
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    memswap_limit: 1g          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 128m
    user: "${APP_UID}:${APP_GID}"
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    command: ["./bin/docker-entrypoint-migrator.sh"]
    environment:
      <<: [*app-env, *db-env, *redis-env, *s3-env]
      TZ: ${TZ}
    secrets: &backend-secrets
      - SECRET_KEY
      - LIVE_SERVER_SECRET_KEY
      - DATABASE_URL
      - POSTGRES_PASSWORD
      - AMQP_URL
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    volumes:
      - ./config/entrypoint.sh:/config/entrypoint.sh:ro
      - ./volumes/logs:/code/plane/logs
    networks:
      - app-internal

  # --------------------------------------------------------
  # API
  # Django and gunicorn. Everything the interfaces do goes through here.
  # --------------------------------------------------------
  plane-api:
    image: makeplane/plane-backend:${APP_TAG}
    container_name: plane-local-api
    restart: unless-stopped
    <<: *hardening
    depends_on:
      plane-migrator:
        condition: service_completed_successfully
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
    memswap_limit: 2g          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.00"
          pids: 500
        reservations:
          memory: 512m
    user: "${APP_UID}:${APP_GID}"
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    command: ["./bin/docker-entrypoint-api.sh"]
    environment:
      <<: [*app-env, *db-env, *redis-env, *s3-env]
      TZ: ${TZ}
    secrets: *backend-secrets
    volumes:
      - ./config/entrypoint.sh:/config/entrypoint.sh:ro
      - ./volumes/logs:/code/plane/logs
    networks:
      app-internal:
        aliases:
          # The proxy's Caddyfile names upstream's services directly.
          - api
    # The backend image carries no curl and no wget. It is a Python image, so
    # the probe uses the interpreter that is certainly there.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/instances/', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # --------------------------------------------------------
  # WORKER
  # The background queue: notifications, exports, webhooks.
  # --------------------------------------------------------
  plane-worker:
    image: makeplane/plane-backend:${APP_TAG}
    container_name: plane-local-worker
    restart: unless-stopped
    <<: *hardening
    depends_on:
      plane-api:
        condition: service_healthy
    # 638 MiB anonymous idle — the largest single service here, and closer
    # to its ceiling than anything else. Measured 2026-09-24 with an empty
    # queue; a real export or import goes through this process.
    memswap_limit: 2g          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 512m
    user: "${APP_UID}:${APP_GID}"
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    command: ["./bin/docker-entrypoint-worker.sh"]
    environment:
      <<: [*app-env, *db-env, *redis-env, *s3-env]
      TZ: ${TZ}
    secrets: *backend-secrets
    volumes:
      - ./config/entrypoint.sh:/config/entrypoint.sh:ro
      - ./volumes/logs:/code/plane/logs
    networks:
      - app-internal

  # --------------------------------------------------------
  # BEAT WORKER
  # The scheduler that puts recurring jobs on the queue.
  # --------------------------------------------------------
  plane-beat-worker:
    image: makeplane/plane-backend:${APP_TAG}
    container_name: plane-local-beat
    restart: unless-stopped
    <<: *hardening
    depends_on:
      plane-api:
        condition: service_healthy
    # 138 MiB anonymous idle, measured 2026-09-24.
    memswap_limit: 1g          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.50"
          pids: 200
        reservations:
          memory: 128m
    user: "${APP_UID}:${APP_GID}"
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    command: ["./bin/docker-entrypoint-beat.sh"]
    environment:
      <<: [*app-env, *db-env, *redis-env, *s3-env]
      TZ: ${TZ}
    secrets: *backend-secrets
    volumes:
      - ./config/entrypoint.sh:/config/entrypoint.sh:ro
      - ./volumes/logs:/code/plane/logs
    networks:
      - app-internal

  # --------------------------------------------------------
  # LIVE
  # The collaborative editor's websocket server.
  # --------------------------------------------------------
  plane-live:
    image: makeplane/plane-live:${APP_TAG}
    container_name: plane-local-live
    restart: unless-stopped
    <<: *hardening
    depends_on:
      plane-api:
        condition: service_healthy
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 128m
    user: "${APP_UID}:${APP_GID}"
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    # The image's own entrypoint and command. `node live/dist/server.js` is not
    # a path that exists in it.
    command: ["docker-entrypoint.sh", "node", "apps/live"]
    environment:
      <<: *redis-env
      API_BASE_URL: http://plane-api:8000
      TZ: ${TZ}
    secrets:
      - LIVE_SERVER_SECRET_KEY
    volumes:
      - ./config/entrypoint.sh:/config/entrypoint.sh:ro
    networks:
      app-internal:
        aliases:
          # The proxy's Caddyfile names upstream's services directly.
          - live

  # --------------------------------------------------------
  # WEB, SPACE, ADMIN
  # Three Next.js interfaces: the application, the public project pages, and
  # the instance administration behind /god-mode.
  # --------------------------------------------------------
  plane-web:
    image: makeplane/plane-frontend:${APP_TAG}
    container_name: plane-local-web
    restart: unless-stopped
    <<: *hardening
    cap_add:
      # nginx's entrypoint chowns /var/cache/nginx as root before dropping to
      # uid 101. Without these it exits on
      # `chown("/var/cache/nginx/client_temp", 101) failed`.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    depends_on:
      plane-api:
        condition: service_healthy
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 128m
    environment:
      TZ: ${TZ}
    networks:
      app-internal:
        aliases:
          # The proxy's Caddyfile names upstream's services directly.
          - web

  plane-space:
    image: makeplane/plane-space:${APP_TAG}
    container_name: plane-local-space
    restart: unless-stopped
    <<: *hardening
    cap_add:
      # nginx's entrypoint chowns /var/cache/nginx as root before dropping to
      # uid 101. Without these it exits on
      # `chown("/var/cache/nginx/client_temp", 101) failed`.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    depends_on:
      plane-api:
        condition: service_healthy
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
          pids: 200
        reservations:
          memory: 128m
    environment:
      TZ: ${TZ}
    networks:
      app-internal:
        aliases:
          # The proxy's Caddyfile names upstream's services directly.
          - space

  plane-admin:
    image: makeplane/plane-admin:${APP_TAG}
    container_name: plane-local-admin
    restart: unless-stopped
    <<: *hardening
    cap_add:
      # nginx's entrypoint chowns /var/cache/nginx as root before dropping to
      # uid 101. Without these it exits on
      # `chown("/var/cache/nginx/client_temp", 101) failed`.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    depends_on:
      plane-api:
        condition: service_healthy
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
          pids: 200
        reservations:
          memory: 128m
    environment:
      TZ: ${TZ}
    networks:
      app-internal:
        aliases:
          # The proxy's Caddyfile names upstream's services directly.
          - admin

  # --------------------------------------------------------
  # PROXY
  # Plane's own Caddy. It is what knows which path belongs to which of the six
  # services, and it is what serves uploads out of MinIO at /<bucket>/.
  #
  # Keeping it as an internal hop is what keeps MinIO and the four interfaces
  # off proxy-public: Traefik talks to this, and this talks to them.
  # --------------------------------------------------------
  plane-proxy:
    image: makeplane/plane-proxy:${APP_TAG}
    container_name: plane-local-proxy
    restart: unless-stopped
    <<: *hardening
    cap_add:
      # /usr/bin/caddy carries `cap_net_bind_service=ep`. A file with an
      # effective capability set cannot be executed at all when the bounding
      # set lacks it: the kernel refuses the exec with
      # `operation not permitted`, naming neither the file nor the capability.
      - NET_BIND_SERVICE
    depends_on:
      plane-api:
        condition: service_healthy
    memswap_limit: 256m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
          pids: 100
        reservations:
          memory: 64m
    environment:
      <<: *proxy-env
      TZ: ${TZ}
    volumes:
      - ./volumes/proxy-config:/config
      - ./volumes/proxy-data:/data
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app-internal
# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  app-internal:
    name: plane-local-internal
    internal: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  SECRET_KEY:
    file: ./.secrets/secret_key.txt
  LIVE_SERVER_SECRET_KEY:
    file: ./.secrets/live_server_secret_key.txt
  DATABASE_URL:
    file: ./.secrets/database_url.txt
  POSTGRES_PASSWORD:
    file: ./.secrets/postgres_password.txt
  AMQP_URL:
    file: ./.secrets/amqp_url.txt
  RABBITMQ_PASSWORD:
    file: ./.secrets/rabbitmq_password.txt
  AWS_ACCESS_KEY_ID:
    file: ./.secrets/aws_access_key_id.txt
  AWS_SECRET_ACCESS_KEY:
    file: ./.secrets/aws_secret_access_key.txt
