# Zammad — local
#
#   cp .env.local.example .env.local
#   mkdir -p volumes/local/zammad-storage
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   docker compose -f docker-compose.local.yml --env-file .env.local logs -f init
#   http://localhost:8080
#   docker compose -f docker-compose.local.yml --env-file .env.local down

x-shared: &zammad-shared
  image: ghcr.io/zammad/zammad:${APP_TAG}
  environment: &zammad-env
    TZ: ${TZ}
    POSTGRESQL_HOST: db
    POSTGRESQL_PORT: "5432"
    POSTGRESQL_DB: ${DB_NAME}
    POSTGRESQL_USER: ${DB_USER}
    POSTGRESQL_PASS: ${DB_PASSWORD}
    POSTGRESQL_OPTIONS: "?pool=50"
    REDIS_URL: "redis://redis:6379"
    MEMCACHE_SERVERS: "memcached:11211"
    ELASTICSEARCH_ENABLED: "false"
    ZAMMAD_FQDN: "localhost:8080"
    ZAMMAD_HTTP_TYPE: http
    RAILS_TRUSTED_PROXIES: "0.0.0.0/0"
    NGINX_SERVER_NAME: localhost
    NGINX_SERVER_SCHEME: http
    NGINX_CLIENT_MAX_BODY_SIZE: "50M"
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - zammad-local

services:

  db:
    image: postgres:${DB_TAG}
    container_name: zammad-local-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./volumes/local/postgres:/var/lib/postgresql/data
    networks: [zammad-local]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:${REDIS_TAG}
    container_name: zammad-local-redis
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./volumes/local/redis:/data
    networks: [zammad-local]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:${MEMCACHED_TAG}
    container_name: zammad-local-memcached
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: memcached -m 256M
    networks: [zammad-local]

  init:
    <<: *zammad-shared
    container_name: zammad-local-init
    restart: on-failure
    command: ["zammad-init"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./volumes/local/zammad-storage:/opt/zammad/storage

  railsserver:
    <<: *zammad-shared
    container_name: zammad-local-railsserver
    command: ["zammad-railsserver"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./volumes/local/zammad-storage:/opt/zammad/storage

  websocket:
    <<: *zammad-shared
    container_name: zammad-local-websocket
    command: ["zammad-websocket"]
    depends_on:
      init:
        condition: service_completed_successfully

  scheduler:
    <<: *zammad-shared
    container_name: zammad-local-scheduler
    command: ["zammad-scheduler"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./volumes/local/zammad-storage:/opt/zammad/storage

  nginx:
    <<: *zammad-shared
    container_name: zammad-local-nginx
    command: ["zammad-nginx"]
    depends_on:
      railsserver:
        condition: service_started
    volumes:
      - ./volumes/local/zammad-storage:/opt/zammad/storage:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [zammad-local]
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  zammad-local:
    name: zammad-local
