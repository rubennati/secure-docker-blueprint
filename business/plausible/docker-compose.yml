services:

  # --------------------------------------------------------
  # POSTGRESQL
  # Accounts, sites, goals and settings. The event data does not live here —
  # that is ClickHouse's job below.
  # --------------------------------------------------------
  plausible-db:
    # --- Identity ---
    image: postgres:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official entrypoint starts as root, fixes ownership on the data
    # directory and then drops to the postgres user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # --- Resources ---
    memswap_limit: 512m          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          # cpus: derived starting value, not measured — v0.10.0
          cpus: "0.50"
          pids: 200
        reservations:
          memory: 128m

    # --- Configuration ---
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PWD
      # PostgreSQL 18 keeps its cluster under /var/lib/postgresql/<major> and
      # refuses to start when a volume sits on the old path without this. Same
      # pattern as apps/defectdojo.
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ}
    secrets:
      - DB_PWD

    # --- Storage ---
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # CLICKHOUSE (the event store)
  # Every pageview lands here. It is the reason this stack needs more memory
  # than its page count suggests, and the four configuration files under
  # config/clickhouse/ are what keep a small instance from behaving like a
  # cluster node.
  # --------------------------------------------------------
  plausible-events-db:
    # --- Identity ---
    image: clickhouse/clickhouse-server:${CLICKHOUSE_TAG}
    container_name: ${CONTAINER_NAME_EVENTS_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint runs as root to chown the data directory and then drops to
    # the clickhouse user. SYS_NICE is what the server asks for when it sets
    # thread priorities; without it the start log carries a warning and nothing
    # else, so it is not granted here.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # --- Resources ---
    # 165 MiB anonymous plus 5 MiB page cache with the low-resource profile
    # applied and the schema created, measured 2026-09-23. ClickHouse sizes
    # several caches from the machine it sees rather than from its cgroup, so
    # the ceiling is where it is told to stop rather than where it idles — and
    # an event store grows into it as the data does.
    memswap_limit: 2g            # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2g
          # cpus: derived starting value, not measured — v0.10.0
          cpus: "2.00"
          pids: 500
        reservations:
          memory: 512m
    # Upstream's own compose raises this; ClickHouse opens a file per data part
    # and the default soft limit is where a busy instance stops.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    # --- Configuration ---
    # No password: the server is on an internal network with no published port
    # and nothing but Plausible on it. That is upstream's arrangement too, and
    # the README says so plainly rather than implying a credential exists.
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      TZ: ${TZ}

    # --- Storage ---
    # The four XML files come from upstream's community-edition repository
    # (MIT) and are vendored here so the stack does not depend on a checkout of
    # it. See UPSTREAM.md for what each one does.
    volumes:
      - ./config/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./config/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./config/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./config/clickhouse/users.d/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
      - ./volumes/clickhouse:/var/lib/clickhouse
      - ./volumes/clickhouse-logs:/var/log/clickhouse-server

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------
  # PLAUSIBLE (community edition)
  # Cookie-free web analytics. The command creates the databases and applies
  # migrations before starting — upstream's own, and it is safe to repeat.
  # --------------------------------------------------------
  plausible-app:
    # --- Identity ---
    image: ghcr.io/plausible/community-edition:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    depends_on:
      plausible-db:
        condition: service_healthy
      plausible-events-db:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # No `user:` — the image already runs as uid 999, which is what
    # ./volumes/plausible has to belong to.

    # --- Resources ---
    # 298 MiB anonymous plus 67 MiB page cache, idle after migrations,
    # measured 2026-09-23.
    memswap_limit: 1g            # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1g
          # cpus: derived starting value, not measured — v0.10.0
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 256m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    # --- Configuration ---
    # Plausible reads every setting from /run/secrets/<NAME> before it looks at
    # the environment (`CONFIG_DIR`, default `/run/secrets`), so a Docker Secret
    # named after the variable needs no wrapper and no _FILE suffix. The four
    # below are secrets for that reason; everything here is not.
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      BASE_URL: https://${APP_TRAEFIK_HOST}
      # The writable volume, which is also where the release puts its temporary
      # files — without this they would go to the read-only root.
      TMPDIR: /var/lib/plausible/tmp
      # Upstream's CE default is `invite_only`; `true` closes it entirely,
      # because the first account is created with ops/create-admin.sh and
      # further accounts are invited from inside a site's settings.
      #
      # This does NOT close the sign-up form on a fresh instance: until one
      # account exists, Plausible funnels /login and /sites to /register
      # whatever this says. Measured — see UPSTREAM.md.
      DISABLE_REGISTRATION: "true"
      LOG_LEVEL: ${APP_LOG_LEVEL}
      TZ: ${TZ}
      # Timezone rules change, so the release keeps its own copy current by
      # polling IANA. That is the one outbound call this stack makes on its
      # own; uncomment to stop it and accept stale rules instead.
      #ERL_ZFLAGS: "-tzdata autoupdate disabled"
    secrets:
      - SECRET_KEY_BASE
      - DATABASE_URL
      - CLICKHOUSE_DATABASE_URL
      - TOTP_VAULT_KEY

    # --- Storage ---
    volumes:
      - ./volumes/plausible:/var/lib/plausible

    # --- Networking ---
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    labels:
      # Router
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # TLS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      # Uncomment ONLY for per-domain certificates; leave off when a wildcard
      # certificate already covers this host.
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      # Middlewares — who may reach it, then what headers apply.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8000"

    # --- Health & Observability ---
    # /api/health answers without a session. The image carries no curl and no
    # wget on PATH, but busybox provides one.
    healthcheck:
      test: ["CMD-SHELL", "busybox wget -q -O /dev/null http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true

  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
# The file names are lower case; the secret names are what Plausible looks for
# in /run/secrets, so they match the variable names exactly.
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  SECRET_KEY_BASE:
    file: ./.secrets/secret_key_base.txt
  DATABASE_URL:
    file: ./.secrets/database_url.txt
  CLICKHOUSE_DATABASE_URL:
    file: ./.secrets/clickhouse_database_url.txt
  TOTP_VAULT_KEY:
    file: ./.secrets/totp_vault_key.txt
