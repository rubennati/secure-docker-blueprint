# https://laravel.com/docs/master/deployment#nginx
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # BLUEPRINT ADDITION: Snappdf/Chromium PDF rendering can take longer than
        # the nginx default (60s), causing 504 on /api/v1/live_design and
        # /api/v1/live_preview. These timeouts give Chromium adequate render time.
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    300s;
        fastcgi_read_timeout    300s;
        send_timeout            300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
