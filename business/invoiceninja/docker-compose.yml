services:

  # --------------------------------------------------------
  # APP (Invoice Ninja — PHP-FPM + Supervisor)
  # --------------------------------------------------------
  app:
    # --- Identity ---
    image: invoiceninja/invoiceninja-debian:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    # The image's own entrypoint reads plain environment variables only. This
    # wrapper reads the secrets first and exports them, then hands over to it.
    # See ops/entrypoint.sh and UPSTREAM.md.
    entrypoint: ["/entrypoint.sh"]
    command: ["supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    environment:
      TZ: ${TZ}
      # Application
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      IS_DOCKER: "true"
      NINJA_ENVIRONMENT: selfhost
      SCOUT_DRIVER: "null"
      FILESYSTEM_DISK: debian_docker
      # PDF rendering
      PDF_GENERATOR: ${PDF_GENERATOR}
      PHANTOMJS_PDF_GENERATION: "false"
      # Database — the password arrives from a secret via the entrypoint
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      # Cache, queue and sessions
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # First start only — creates the initial account
      IN_USER_EMAIL: ${IN_USER_EMAIL}
      # Mail
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    secrets:
      - DB_PWD
      - APP_KEY
      - REDIS_PWD
      - MAIL_PWD
      - IN_PWD

    # --- Storage ---
    # Chromium renders the PDFs and the live design preview, and it uses shared
    # memory heavily. Docker's default /dev/shm is 64 MB, which is not enough:
    # the render does not fail, it stalls, and the request dies on the 60-second
    # timeout with a Chromium command line in the log that looks like a launch
    # problem. Asynchronous renders in the queue worker still complete, so the
    # invoice PDF arrives while the preview appears broken.
    shm_size: 512m
    volumes:
      - ./ops/entrypoint.sh:/entrypoint.sh:ro
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage

    # --- Networking ---
    networks:
      - app-internal
      - app-egress

    # --- Health & Observability ---
    # Supervisor runs three programs and all three matter: php-fpm serves the
    # interface, queue-worker sends the mail, scheduler raises the recurring
    # invoices and reminders. A check that only proves PHP starts would report
    # healthy with the last two dead.
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/supervisor/supervisord.conf status | grep -qv RUNNING && exit 1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        limits:
          # Chromium renders the PDFs and the live design previews; it exceeds
          # 512M under concurrent load or with complex templates.
          memory: 1G
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 256M

  # --------------------------------------------------------
  # NGINX (Web Server)
  # --------------------------------------------------------
  nginx:
    # --- Identity ---
    image: nginx:${NGINX_TAG}
    container_name: ${CONTAINER_NAME_NGINX}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    environment:
      TZ: ${TZ}

    # --- Storage ---
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro

    # --- Networking ---
    networks:
      - app-internal
      - proxy-public

    # --- Traefik ---
    labels:
      # Router
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # TLS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      # Middlewares
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"

    # --- Health & Observability ---
    # `/health` answers 200 with {"status":"ok","message":"API is healthy"}.
    #
    # It is not the endpoint the API reference documents — that is
    # /api/v1/health_check, described as needing no authentication, which
    # answers 403 on this instance. Measured, not assumed; revisit if `/health`
    # ever stops answering, since nothing upstream promises it.
    #
    # Do not check the site root: it answers 302 to the login, busybox wget
    # treats that as a failure, and an unhealthy container is one Traefik drops
    # from the load balancer — so the symptom is a 404 from the proxy, which
    # looks nothing like a health problem.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 50
        reservations:
          memory: 32M

  # --------------------------------------------------------
  # DATABASE (MySQL)
  # --------------------------------------------------------
  mysql:
    # --- Identity ---
    image: mysql:${MYSQL_TAG}
    container_name: ${CONTAINER_NAME_MYSQL}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    # DEVIATION: MySQL rather than MariaDB — upstream targets MySQL 8 and ships
    # it in its own compose file. MariaDB is offered there only as a commented
    # alternative and is not exercised here.
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PWD
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PWD
    secrets:
      - DB_PWD
      - DB_ROOT_PWD

    # --- Storage ---
    volumes:
      - mysql_data:/var/lib/mysql

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    # Connects as the application user to the application database, so the
    # schema and grants are in place before `app` starts — not merely that
    # mysqld is listening. Reads the password from the secret, since the
    # _FILE form means the variable itself is not set.
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$$(cat /run/secrets/DB_PWD)\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
          pids: 200
        reservations:
          memory: 256M

  # --------------------------------------------------------
  # REDIS (Cache / Queue / Sessions)
  # --------------------------------------------------------
  redis:
    # --- Identity ---
    image: redis:${REDIS_TAG}
    container_name: ${CONTAINER_NAME_REDIS}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    # The password is read from the secret at startup, so it never appears in
    # the process environment.
    command: >
      sh -c 'exec redis-server
      --requirepass "$$(cat /run/secrets/REDIS_PWD)"
      --maxmemory 192mb
      --maxmemory-policy noeviction'
    secrets:
      - REDIS_PWD

    # --- Storage ---
    volumes:
      - redis_data:/data

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/REDIS_PWD)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
          pids: 50
        reservations:
          memory: 64M

# --------------------------------------------------------
# VOLUMES
# --------------------------------------------------------
volumes:
  app_public:
    driver: local
  app_storage:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true
    name: ${TRAEFIK_NETWORK}

  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

  # Outbound for the application container only — it sends mail, checks for
  # updates and fetches exchange rates. The database and cache stay on
  # app-internal alone and have no route out.
  app-egress:
    name: ${COMPOSE_PROJECT_NAME}-egress

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  DB_ROOT_PWD:
    file: ./.secrets/db_root_pwd.txt
  REDIS_PWD:
    file: ./.secrets/redis_pwd.txt
  APP_KEY:
    file: ./.secrets/app_key.txt
  MAIL_PWD:
    file: ./.secrets/mail_pwd.txt
  IN_PWD:
    file: ./.secrets/in_pwd.txt
