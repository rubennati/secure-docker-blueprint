services:

  # --------------------------------------------------------
  # DATABASE (PostgreSQL)
  # --------------------------------------------------------
  db:
    image: postgres:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Re-added deliberately: the official entrypoint starts as root, fixes
    # ownership on the data directory, then drops to the service user.
    # Set per image family: docs/standards/security-baseline.md.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # --- Resources ---
    # Ceiling above the buffer pool, connections and temporary tables.
    memswap_limit: 1G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 200
        reservations:
          memory: 256M

    environment:
      # PostgreSQL 18 keeps its cluster under /var/lib/postgresql/<major> and
      # refuses to start when a volume sits on the old path without this. Same
      # pattern as apps/shlink.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PWD
      TZ: ${TZ}
    secrets:
      - DB_PWD

    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

    networks:
      - app-internal

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --------------------------------------------------------
  # INSTALL (one-shot): schema on first start, migrations after an upgrade
  # --------------------------------------------------------
  listmonk-install:
    image: listmonk/listmonk:${APP_TAG}
    container_name: ${COMPOSE_PROJECT_NAME}-install
    restart: "no"
    # healthcheck: none — a one-shot; the next service waits for its exit code
    depends_on:
      db:
        condition: service_healthy
    # On a set-up database both steps are no-ops.
    command: ["sh", "-c", "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config ''"]
    # The image's entrypoint only drops privileges through PUID, and then keeps
    # a root shell as PID 1; starting as an unprivileged user skips both.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      TZ: ${TZ}
      # --install prints the address and fails without it
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_app__root_url: "https://${APP_TRAEFIK_HOST}"
      LISTMONK_db__host: db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: ${DB_USER}
      LISTMONK_db__password: ${DB_PWD_INLINE}
      LISTMONK_db__database: ${DB_NAME}
      LISTMONK_db__ssl_mode: disable
    networks:
      - app-internal
    memswap_limit: 256M          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 50

  # --------------------------------------------------------
  # SMTP PLACEHOLDER GUARD (one-shot)
  # --------------------------------------------------------
  # The install seeds the SMTP server `smtp.yoursite.com` — a registered domain
  # that resolves to a third party. Until an operator sets a real server, an
  # opt-in mail (the subscriber's address) or a notification went there on
  # port 25 (measured on the step 8 lab host; final audit FA-02). This step
  # replaces exactly that placeholder with `smtp.invalid` (RFC 2606: never
  # resolves) before the application loads its settings; a server the operator
  # configured is never touched, so it is a no-op on every later start.
  smtp-guard:
    image: postgres:${DB_TAG}
    container_name: ${COMPOSE_PROJECT_NAME}-smtp-guard
    restart: "no"
    # healthcheck: none — a one-shot; the application waits for its exit code
    depends_on:
      listmonk-install:
        condition: service_completed_successfully
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGDATABASE: ${DB_NAME}
      PGPASSWORD: ${DB_PWD_INLINE}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -Atc
      - >-
        UPDATE settings
        SET value = replace(value::text, '"smtp.yoursite.com"', '"smtp.invalid"')::jsonb, updated_at = now()
        WHERE key = 'smtp' AND value::text LIKE '%"smtp.yoursite.com"%'
        RETURNING 'smtp placeholder replaced by smtp.invalid'
    networks:
      - app-internal
    memswap_limit: 64M           # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 20

  # --------------------------------------------------------
  # LISTMONK (newsletter + mailing list manager)
  # --------------------------------------------------------
  listmonk-app:
    image: listmonk/listmonk:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    # --- Resources ---
    # Generous ceiling: a limit the normal workload reaches is a limit that
    # kills imports and background jobs. Retune from docker stats, not down to it.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M

    depends_on:
      db:
        condition: service_healthy
      # schema and migrations, then the SMTP placeholder — both before the
      # application reads its settings
      smtp-guard:
        condition: service_completed_successfully
    command: ["./listmonk", "--config", ""]

    # A single Go binary: no root, no capability. The upload directory must
    # belong to APP_UID (README, Setup). Measured on the step 8 lab host
    # (final audit FA-06): setup, login, API, subscription and an upload.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      TZ: ${TZ}
      # Listmonk reads its config from env vars with LISTMONK_ prefix.
      # No _FILE support for the DB password — blueprint DB_PWD_INLINE pattern.
      LISTMONK_app__address: "0.0.0.0:9000"
      # Public root URL — used in unsubscribe links, tracking pixels, forms.
      # Must match the external hostname Traefik exposes.
      LISTMONK_app__root_url: "https://${APP_TRAEFIK_HOST}"
      LISTMONK_db__host: db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: ${DB_USER}
      LISTMONK_db__password: ${DB_PWD_INLINE}
      LISTMONK_db__database: ${DB_NAME}
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: "25"
      LISTMONK_db__max_idle: "25"
      LISTMONK_db__max_lifetime: "300s"

    volumes:
      - ./volumes/uploads:/listmonk/uploads

    # --- Health & Observability ---
    # Not an HTTP service — this confirms the port accepts a connection.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - proxy-public
      - app-internal

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      # NOTE: /subscription/*, /link/*, /campaign/* must be reachable by
      # external subscribers. If you want the admin at /admin VPN-only
      # but public subscription paths, split into two routers — see README.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=frame-self@file,${APP_TRAEFIK_HEADERS}@file,${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_LIMIT}@file,${APP_TRAEFIK_AUTH}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=9000"

networks:
  proxy-public:
    name: ${TRAEFIK_NETWORK}
    external: true
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
