services:

  # --------------------------------------------------------
  # DATABASE (MariaDB)
  # --------------------------------------------------------
  db:
    # --- Identity ---
    image: mariadb:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    # --- Resources ---
    # Ceiling above the buffer pool, connections and temporary tables.
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 200
        reservations:
          memory: 256M

    # --- Configuration ---
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PWD
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PWD
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DISABLE_UPGRADE_BACKUP: "1"
      TZ: ${TZ}
    command:
      - --max-allowed-packet=64MB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    secrets:
      - DB_PWD
      - DB_ROOT_PWD

    # --- Storage ---
    volumes:
      - ./volumes/mysql:/var/lib/mysql

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------
  # MATOMO (analytics app)
  # --------------------------------------------------------
  matomo-app:
    # --- Identity ---
    image: matomo:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    # --- Resources ---
    # Generous ceiling: a limit the normal workload reaches is a limit that
    # kills imports and background jobs. Retune from docker stats, not down to it.
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 128M

    depends_on:
      db:
        condition: service_healthy

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      MATOMO_DATABASE_HOST: db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_DBNAME: ${DB_NAME}
      MATOMO_DATABASE_USERNAME: ${DB_USER}
      # Matomo supports _FILE natively (since 4.x)
      MATOMO_DATABASE_PASSWORD_FILE: /run/secrets/DB_PWD
      MATOMO_DATABASE_TABLES_PREFIX: ${DB_TABLES_PREFIX}
    secrets:
      - DB_PWD

    # --- Storage ---
    volumes:
      - ./volumes/config:/var/www/html/config
      - ./volumes/logs:/var/www/html/logs
      - ./volumes/matomo:/var/www/html

    # --- Health & Observability ---
    # Any HTTP answer means the server is serving, including a 5xx —
    # `-f` is deliberately absent, but not for the reason once written here.
    # curl --fail triggers at 400 and above; it does not fail on a redirect,
    # so a 3xx passes either way. What omitting it really buys is that a
    # broken application still reports healthy. Add `-f` once the response
    # this endpoint gives during startup is known (v0.8.0 / .ai/tasks.md).
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # --- Networking ---
    networks:
      - proxy-public
      - app-internal

    # --- Traefik ---
    labels:
      # Router
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # TLS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      #- "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${APP_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      # Middlewares (proto headers + access + security — Matomo behind a
      # proxy needs the forwarded proto to generate https:// tracking URLs)
      #
      # sec-3 is applied here rather than through APP_TRAEFIK_SECURITY, because a
      # per-app middleware has to run after it. Matomo sets X-Frame-Options itself
      # and does so per endpoint: `deny` on the reporting UI, absent on the
      # Widgetize endpoints that exist to be embedded. A second header from the
      # proxy is not stricter — it is a conflicting value on the widget responses,
      # and the widget iframes stop loading. strip-xfo removes it after sec-3 so
      # the application decides, which is the same treatment apps/vaultwarden gets
      # for the same reason.
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-strip-xfo.headers.customResponseHeaders.X-Frame-Options="
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${COMPOSE_PROJECT_NAME}-headers@docker,${APP_TRAEFIK_ACCESS}@file,sec-3@file,${COMPOSE_PROJECT_NAME}-strip-xfo"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.customrequestheaders.X-Forwarded-Host=${APP_TRAEFIK_HOST}"
      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true

  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  DB_ROOT_PWD:
    file: ./.secrets/db_root_pwd.txt
