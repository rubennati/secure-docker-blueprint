# Kimai — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:8001
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  db:
    image: mariadb:${DB_TAG}
    container_name: kimai-local-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./volumes/local/mysql:/var/lib/mysql
    networks: [kimai-local]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: kimai/kimai2:${APP_TAG}
    container_name: kimai-local-app
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ}
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      TRUSTED_HOSTS: "localhost"
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?charset=utf8mb4&serverVersion=11.4.0-MariaDB"
      ADMINMAIL: ${ADMIN_EMAIL}
      ADMINPASS: ${ADMIN_PASSWORD}
    volumes:
      - ./volumes/local/data:/opt/kimai/var/data
      - ./volumes/local/plugins:/opt/kimai/var/plugins
    ports:
      - "127.0.0.1:8001:8001"
    networks: [kimai-local]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Host: localhost' http://127.0.0.1:8001/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  kimai-local:
    name: kimai-local
