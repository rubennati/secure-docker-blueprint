# =============================================================================
# ERPNext — production stack (Traefik + Docker Secrets)
# =============================================================================
# ERP for small and mid-sized businesses on the Frappe framework: accounting,
# stock, buying, selling, manufacturing, projects, HR. One image runs every
# Frappe role — nginx, Gunicorn, Socket.IO, two queue workers, the scheduler and
# a one-shot configurator — beside MariaDB and two Redis instances.
#
# Image: frappe/erpnext
# Source: https://github.com/frappe/frappe_docker (compose.yaml + overrides/)
#
# Frappe keeps its connection settings in sites/common_site_config.json and each
# site's database password in sites/<site>/site_config.json, where it also adds
# an encryption key the first time it encrypts a value. The configurator writes
# the first file from the Docker Secrets; ops/create-site.sh creates the site,
# which writes the second.
#
# Spec: docs/standards/compose-structure.md · security-baseline.md
# =============================================================================

x-frappe-hardening: &frappe-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

# config/ takes bench's file locks, as uid 1000, and bench only treats the
# directory as a bench while config/pids exists. A plain tmpfs mounts as 755
# root — long syntax to set the mode: 1023 is octal 1777.
x-frappe-storage: &frappe-storage
  volumes:
    - ./volumes/sites:/home/frappe/frappe-bench/sites
    - ./volumes/logs:/home/frappe/frappe-bench/logs
    - type: tmpfs
      target: /home/frappe/frappe-bench/config
      tmpfs:
        mode: 1023
    - type: tmpfs
      target: /home/frappe/frappe-bench/config/pids
      tmpfs:
        mode: 1023
  tmpfs:
    - /tmp

services:

  # --------------------------------------------------------
  # FRONTEND (nginx: static files, proxy to Gunicorn and Socket.IO)
  # On proxy-public, so it carries the stack identity + role suffix
  # --------------------------------------------------------
  erpnext-frontend:
    # --- Identity ---
    image: frappe/erpnext:${APP_TAG}
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped
    # The image runs as uid 1000 (frappe) in every role.

    # --- Security ---
    <<: *frappe-hardening

    # --- Resources ---
    memswap_limit: 256m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 100
        reservations:
          memory: 32m

    # --- Configuration ---
    # The site is chosen by this name rather than by the Host header, so the
    # single site answers on the router's host name.
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      # Traefik sets X-Forwarded-For; only containers on this stack's networks
      # can reach nginx.
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      TZ: ${TZ}
    depends_on:
      erpnext-backend:
        condition: service_started
      erpnext-websocket:
        condition: service_started

    # --- Storage ---
    # nginx-entrypoint.sh writes the site config at start; nginx needs a PID file
    # and temp paths. All three belong to uid 1000, and a plain tmpfs mounts as
    # 755 root — long syntax to set the mode: 1023 is octal 1777.
    volumes:
      - ./volumes/sites:/home/frappe/frappe-bench/sites
      - ./volumes/logs:/home/frappe/frappe-bench/logs
      - ./config/nginx-socketio.conf:/etc/nginx/sites-enabled/socketio-internal.conf:ro
      - type: tmpfs
        target: /etc/nginx/conf.d
        tmpfs:
          mode: 1023
      - type: tmpfs
        target: /var/lib/nginx
        tmpfs:
          mode: 1023
      - type: tmpfs
        target: /run
        tmpfs:
          mode: 1023
    tmpfs:
      - /tmp

    # --- Networking ---
    networks:
      proxy-public:
      app-internal:
        aliases:
          # The realtime service reaches the site under its own name here.
          - ${SITE_NAME}

    # --- Traefik ---
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8080"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-socketio.rule=Host(`${APP_TRAEFIK_HOST}`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-socketio.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-socketio.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-socketio.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-socketio.tls.options=${APP_TRAEFIK_TLS_OPTION}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-socketio.middlewares=${APP_TRAEFIK_THREAT}${APP_TRAEFIK_ACCESS}@file,${APP_TRAEFIK_SECURITY}@file"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-socketio.service=${COMPOSE_PROJECT_NAME}-socketio"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-socketio.loadbalancer.server.port=8081"

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # BACKEND (Gunicorn)
  # --------------------------------------------------------
  erpnext-backend:
    # --- Identity ---
    image: frappe/erpnext:${APP_TAG}
    container_name: ${CONTAINER_NAME_BACKEND}
    restart: unless-stopped

    # --- Security & Storage (shared by every Frappe role) ---
    <<: [*frappe-hardening, *frappe-storage]

    # --- Resources ---
    # Two Gunicorn workers with four threads each (upstream's default).
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 512M

    # --- Configuration ---
    # DB_PWD and ADMIN_PWD are read by ops/create-site.sh inside this container.
    environment:
      TZ: ${TZ}
    secrets:
      - DB_PWD
      - ADMIN_PWD
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully

    # --- Networking ---
    # Outbound for email, webhooks and integrations sent from a request.
    networks:
      - app-internal
      - app-egress

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------
  # WEBSOCKET (Socket.IO: realtime updates in the browser)
  # --------------------------------------------------------
  erpnext-websocket:
    # --- Identity ---
    image: frappe/erpnext:${APP_TAG}
    container_name: ${CONTAINER_NAME_WEBSOCKET}
    restart: unless-stopped

    # --- Security & Storage (shared by every Frappe role) ---
    <<: [*frappe-hardening, *frappe-storage]

    # --- Resources ---
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 100
        reservations:
          memory: 64m

    # --- Configuration ---
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      TZ: ${TZ}
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # QUEUE WORKERS (background jobs)
  # --------------------------------------------------------
  erpnext-queue-short:
    # --- Identity ---
    image: frappe/erpnext:${APP_TAG}
    container_name: ${CONTAINER_NAME_QUEUE_SHORT}
    restart: unless-stopped

    # --- Security & Storage (shared by every Frappe role) ---
    <<: [*frappe-hardening, *frappe-storage]

    # --- Resources ---
    memswap_limit: 1G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 100
        reservations:
          memory: 128M

    # --- Configuration ---
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      TZ: ${TZ}
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully

    # --- Networking ---
    # Outbound: queued email, webhooks and integrations.
    networks:
      - app-internal
      - app-egress

    # --- Health & Observability ---
    # Liveness of the worker process.
    healthcheck:
      test: ["CMD", "grep", "-q", "worker", "/proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  erpnext-queue-long:
    # --- Identity ---
    image: frappe/erpnext:${APP_TAG}
    container_name: ${CONTAINER_NAME_QUEUE_LONG}
    restart: unless-stopped

    # --- Security & Storage (shared by every Frappe role) ---
    <<: [*frappe-hardening, *frappe-storage]

    # --- Resources ---
    # Long jobs: imports, reports, recalculations.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 100
        reservations:
          memory: 128M

    # --- Configuration ---
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      TZ: ${TZ}
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully

    # --- Networking ---
    networks:
      - app-internal
      - app-egress

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "grep", "-q", "worker", "/proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------
  # SCHEDULER (enqueues the scheduled jobs)
  # --------------------------------------------------------
  erpnext-scheduler:
    # --- Identity ---
    image: frappe/erpnext:${APP_TAG}
    container_name: ${CONTAINER_NAME_SCHEDULER}
    restart: unless-stopped

    # --- Security & Storage (shared by every Frappe role) ---
    <<: [*frappe-hardening, *frappe-storage]

    # --- Resources ---
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 50
        reservations:
          memory: 64m

    # --- Configuration ---
    command: ["bench", "schedule"]
    environment:
      TZ: ${TZ}
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "grep", "-q", "schedule", "/proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------
  # CONFIGURATOR (one-shot: writes common_site_config.json)
  # --------------------------------------------------------
  erpnext-configurator:
    # --- Identity ---
    image: frappe/erpnext:${APP_TAG}
    container_name: ${CONTAINER_NAME_CONFIGURATOR}
    restart: on-failure

    # --- Security & Storage (shared by every Frappe role) ---
    <<: [*frappe-hardening, *frappe-storage]

    # --- Resources ---
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 50
        reservations:
          memory: 64m

    # --- Configuration ---
    # Upstream's configurator, with the Redis password added to both URLs. The
    # image seeds an empty common_site_config.json only into a named volume; a
    # bind mount starts empty, so the file is created when missing. Frappe's
    # command runner is called directly, as bench itself calls it: bench logs
    # every command line, the password included, to logs/bench.log.
    entrypoint: ["bash", "-c"]
    command:
      - >
        set -e;
        ls -1 apps > sites/apps.txt;
        [ -f sites/common_site_config.json ] || echo "{}" > sites/common_site_config.json;
        cd sites;
        fc() { ../env/bin/python -m frappe.utils.bench_helper frappe "$$@"; };
        pw="$$(cat /run/secrets/REDIS_PWD)";
        fc set-config -g db_host db;
        fc set-config -gp db_port 3306;
        fc set-config -g redis_cache "redis://:$${pw}@redis-cache:6379";
        fc set-config -g redis_queue "redis://:$${pw}@redis-queue:6379";
        fc set-config -g redis_socketio "redis://:$${pw}@redis-queue:6379";
        fc set-config -gp socketio_port 9000;
        fc set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      TZ: ${TZ}
    secrets:
      - REDIS_PWD
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

    # --- Networking ---
    networks:
      - app-internal

    # healthcheck: none — this container runs once and exits.

  # --------------------------------------------------------
  # DATABASE (MariaDB)
  # --------------------------------------------------------
  db:
    # --- Identity ---
    image: mariadb:${DB_TAG}
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    # --- Resources ---
    # Ceiling above the buffer pool, connections and temporary tables.
    memswap_limit: 2G          # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200
        reservations:
          memory: 256M

    # --- Configuration ---
    # The entrypoint creates the site's database and user; bench then uses them
    # without the root password. Character set and handshake as upstream sets
    # them.
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PWD
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PWD
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    secrets:
      - DB_PWD
      - DB_ROOT_PWD

    # --- Storage ---
    volumes:
      - ./volumes/mysql:/var/lib/mysql

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------
  # REDIS (cache, and queue + Socket.IO)
  # --------------------------------------------------------
  redis-cache:
    # --- Identity ---
    image: redis:${REDIS_TAG}
    container_name: ${CONTAINER_NAME_REDIS_CACHE}
    restart: unless-stopped
    user: "999:999"

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    # --- Resources ---
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 100
        reservations:
          memory: 32m

    # --- Configuration ---
    entrypoint: ["/bin/sh", "/redis-entrypoint.sh", "cache"]
    secrets:
      - REDIS_PWD

    # --- Storage ---
    volumes:
      - ./config/redis-entrypoint.sh:/redis-entrypoint.sh:ro
    tmpfs:
      - /tmp

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/REDIS_PWD)\" redis-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis-queue:
    # --- Identity ---
    image: redis:${REDIS_TAG}
    container_name: ${CONTAINER_NAME_REDIS_QUEUE}
    restart: unless-stopped
    user: "999:999"

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    # --- Resources ---
    memswap_limit: 512m        # == memory: no swap
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 100
        reservations:
          memory: 32m

    # --- Configuration ---
    entrypoint: ["/bin/sh", "/redis-entrypoint.sh", "queue"]
    secrets:
      - REDIS_PWD

    # --- Storage ---
    volumes:
      - ./config/redis-entrypoint.sh:/redis-entrypoint.sh:ro
      - ./volumes/redis-queue:/data
    tmpfs:
      - /tmp

    # --- Networking ---
    networks:
      - app-internal

    # --- Health & Observability ---
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/REDIS_PWD)\" redis-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

# --------------------------------------------------------
# NETWORKS
# --------------------------------------------------------
networks:
  proxy-public:
    external: true
  app-internal:
    name: ${COMPOSE_PROJECT_NAME}-internal
    internal: true
  # Outbound for the backend and the queue workers.
  app-egress:
    name: ${COMPOSE_PROJECT_NAME}-egress

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  DB_PWD:
    file: ./.secrets/db_pwd.txt
  DB_ROOT_PWD:
    file: ./.secrets/db_root_pwd.txt
  REDIS_PWD:
    file: ./.secrets/redis_pwd.txt
  ADMIN_PWD:
    file: ./.secrets/admin_pwd.txt
