# Second listener for /socket.io, mounted into /etc/nginx/sites-enabled/.
#
# The realtime service authenticates a socket by fetching the session from the
# site it believes it is serving: it takes the Origin header the proxy sent and
# calls <Origin>/api/method/frappe.realtime.get_user_info. The image's own
# template sets that Origin to the public URL, which a container on
# app-internal cannot reach — every socket is then refused with
# "Unauthorized: TypeError: fetch failed" and the desk runs without live
# updates.
#
# This block sends the same request to an address that exists on app-internal:
# the frontend itself, under the site's own name, which the compose file adds
# as a network alias. The site name travels in Host, so the backend resolves
# the site the same way as for any other request.
server {
    listen 8081;
    server_name _;
    absolute_redirect off;

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_set_header Origin http://$host:8080;
        proxy_set_header Host $host;

        proxy_pass http://socketio-server;
    }
}
