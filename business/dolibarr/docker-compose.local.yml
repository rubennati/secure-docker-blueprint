# Dolibarr — local
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   http://localhost:8080
#   docker compose -f docker-compose.local.yml --env-file .env.local down

services:

  db:
    image: mariadb:${DB_TAG}
    container_name: dolibarr-local-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./volumes/local/mysql:/var/lib/mysql
    networks: [dolibarr-local]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: dolibarr/dolibarr:${APP_TAG}
    container_name: dolibarr-local-app
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ}
      PHP_INI_DATE_TIMEZONE: ${TZ}
      DOLI_URL_ROOT: http://localhost:8080
      DOLI_DB_HOST: db
      DOLI_DB_NAME: ${DB_NAME}
      DOLI_DB_USER: ${DB_USER}
      DOLI_DB_PASSWORD: ${DB_PASSWORD}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
    volumes:
      - ./volumes/local/documents:/var/www/documents
      - ./volumes/local/custom:/var/www/html/custom
    ports:
      - "127.0.0.1:8080:80"
    networks: [dolibarr-local]
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  dolibarr-local:
    name: dolibarr-local
